<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Choisir les 12 fonds</title>
<link href="loginail-creer/polices.css" rel="stylesheet">
<style>
:root{--noir:#1E1C1B;--fond:#F6F3EF;--gris:#6B625C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--noir);font-family:Jost,Helvetica,sans-serif;overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:20px 14px 150px}
h1{margin:0 0 4px;text-align:center;font:500 22px/1.2 Jost,sans-serif}
.chapo{margin:0 auto 14px;max-width:320px;text-align:center;font:300 13.5px/1.5 Jost,sans-serif;color:var(--gris)}
h2{margin:22px 0 8px;font:500 10.5px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);text-align:center}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vg{position:relative;aspect-ratio:44/78;border:0;padding:0;border-radius:13px;overflow:hidden;background:#eee;cursor:pointer;transition:transform .15s,opacity .15s}
.vg .tuile{position:absolute;inset:0;width:100%!important;height:100%!important;border-radius:0!important;background-size:cover}
.vg.on{transform:scale(.9);box-shadow:0 0 0 3px #fff,0 8px 16px -6px rgba(0,0,0,.45)}
.vg.on:after{content:attr(data-k);position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--noir);display:grid;place-items:center;font:500 12px Jost,sans-serif}
body.plein .vg:not(.on){opacity:.35}
.bas{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px 22px 0 0;box-shadow:0 -10px 26px -18px rgba(0,0,0,.35)}
.bas>div{max-width:452px;margin:0 auto;display:flex;align-items:center;gap:10px}
#nb{flex:none;font:500 15px Jost,sans-serif;min-width:62px}
#ok{flex:1;border:0;border-radius:999px;background:var(--noir);color:#fff;padding:15px;font:500 12px Jost,sans-serif;letter-spacing:.16em}
#ok:disabled{opacity:.3}
#vide{flex:none;border:0;background:none;font:400 12.5px Jost,sans-serif;color:var(--gris);text-decoration:underline;text-underline-offset:3px;padding:6px}
#msg{max-width:452px;margin:8px auto 0;text-align:center;font:400 12.5px/1.4 Jost,sans-serif;color:var(--gris)}
</style></head><body><main>
<h1>Vos 12 fonds « les plus choisis »</h1>
<p class="chapo">Touchez vos 12 préférés. Ce sont ceux que les prothésistes verront en premier, avant toutes les catégories.</p>
<div id="liste"></div>
</main>
<div class="bas"><div><b id="nb">0 / 12</b><button id="ok" type="button" disabled>C’EST CHOISI</button><button id="vide" type="button">Tout enlever</button></div><p id="msg"></p></div>
<script src="loginail-site/fonds-100.js"></script>
<script>
const MAX = 12, F = (window.FONDS100 && FONDS100.f) || [], $ = i => document.getElementById(i);
let C = []; try { C = JSON.parse(localStorage.getItem("fonds-choisis-marie") || "[]").filter(n => F.some(x => x[0] === n)); } catch (e) {}
const tuile = h => String(h).replace(/url\((['"]?)\.\.\/loginail-site\//g, "url($1loginail-site/").replace(/fonds-img\//g, "fonds-mini/");
const cats = []; F.forEach(x => { const c = (x[3] || [])[0] || "Divers"; if (!cats.includes(c)) cats.push(c); });
$("liste").innerHTML = cats.map(c => `<h2>${c}</h2><div class="gr">${F.filter(x => ((x[3] || [])[0] || "Divers") === c).map(x => `<button class="vg" type="button" data-f="${x[0].replace(/"/g, "&quot;")}" title="${x[0].replace(/"/g, "&quot;")}">${tuile(x[1])}</button>`).join("")}</div>`).join("");
function maj() { document.querySelectorAll(".vg").forEach(b => { const k = C.indexOf(b.dataset.f); b.classList.toggle("on", k >= 0); if (k >= 0) b.dataset.k = k + 1; else delete b.dataset.k; });
  $("nb").textContent = `${C.length} / ${MAX}`; $("ok").disabled = C.length !== MAX; document.body.classList.toggle("plein", C.length >= MAX);
  try { localStorage.setItem("fonds-choisis-marie", JSON.stringify(C)); } catch (e) {} }
$("liste").onclick = e => { const b = e.target.closest(".vg"); if (!b) return; const n = b.dataset.f, k = C.indexOf(n);
  if (k >= 0) C.splice(k, 1); else if (C.length < MAX) C.push(n); else { $("msg").textContent = "12 au maximum : touchez-en un déjà choisi pour l’enlever."; return; }
  $("msg").textContent = ""; maj(); };
$("vide").onclick = () => { C = []; $("msg").textContent = ""; maj(); };
$("ok").onclick = async () => { const t = "Mes 12 fonds : " + C.join(" | ");
  try { await navigator.clipboard.writeText(t); $("msg").textContent = "C’est noté et copié. Collez la liste dans votre message à Claude."; } catch (e) { $("msg").textContent = "C’est noté. Dites à Claude que c’est choisi."; } };
maj();
</script></body></html>
