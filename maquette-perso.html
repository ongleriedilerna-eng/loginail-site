<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<title>Personnalisez votre site · maquette</title>
<link href="loginail-creer/polices.css" rel="stylesheet"><link href="loginail-site/polices-sites.css" rel="stylesheet">
<style>
/* 08/11 (Marie) : MAQUETTE « Personnalisez votre site ».
   En haut l'étape, au milieu son vrai site dans un téléphone (TOUJOURS la même taille, à toutes les étapes), en bas les choix (hauteur fixe).
   Derrière : son fond en transparence (il bouge aussi s'il bouge). Boutons en « verre » (pilules blanches transparentes), « Suivant » au milieu.
   Ordre : 1 En-tête (flèches) → 2 Fond → 3 Couleurs (le nom, puis les boutons, puis le site ; rangées par teinte) → 4 Écriture → 5 Charms.
   Chaque changement se fait en fondu (pas de carré blanc). */
:root{--noir:#1E1C1B;--fond:#F6F3EF;--muted:#6B625C;--basH:204px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#E7E2DC;font-family:Jost,sans-serif;color:var(--noir);overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
#tel{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:var(--fond)}
#ambiance{position:absolute;inset:0;opacity:.24;overflow:hidden;pointer-events:none}
#ambiance>*{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important}
.haut{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:3;padding:0 22px}
.haut b{font:500 10px Jost,sans-serif;letter-spacing:.26em;text-transform:uppercase}
.barre{display:flex;gap:4px}.barre i{width:24px;height:3px;border-radius:2px;background:rgba(30,28,27,.15);transition:background .3s}.barre i.on{background:var(--noir)}
.haut h2{margin:4px 0 0;font:400 20px/1.1 Jost,sans-serif;text-align:center;letter-spacing:-.01em}
.haut p{margin:0;font:300 12px Jost,sans-serif;color:var(--muted);text-align:center}
#mini{position:absolute;left:50%;transform:translateX(-50%);border-radius:30px;border:6px solid #111;background:#111;overflow:hidden;box-shadow:0 22px 40px -22px rgba(0,0,0,.6);z-index:2}
#site{position:absolute;top:0;left:0;width:390px;height:844px;border:0;transform-origin:0 0;background:#fff;transition:opacity .18s}
#site.fondu{opacity:.35}
.verre{border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 20px -12px rgba(0,0,0,.4)}
.fl{position:absolute;z-index:4;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:300 24px/1 Jost,sans-serif;transform:translate(-50%,-50%);padding:0 0 3px}
#oeil svg{width:18px;height:18px}
.plein #mini{border-radius:0;border-width:0}
.plein .fl,.plein .haut,.plein .bas{opacity:0;pointer-events:none}
#fermerPlein{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:6;border-radius:999px;padding:10px 15px;font:400 13px Jost,sans-serif}
.bas{position:absolute;left:0;right:0;bottom:0;height:calc(var(--basH) + env(safe-area-inset-bottom));padding:0 0 calc(env(safe-area-inset-bottom) + 12px);z-index:3;display:flex;flex-direction:column}
.choix{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ligneH{display:flex;gap:9px;overflow-x:auto;padding:4px 22px 6px;scroll-snap-type:x proximity;scrollbar-width:none}.ligneH::-webkit-scrollbar{display:none}
.ligneH>*{flex:none;scroll-snap-align:center}
.pied{position:relative;display:flex;justify-content:center;align-items:center;padding:8px 22px 0;height:62px}
.retour{position:absolute;left:22px;top:50%;margin-top:4px;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;font:300 22px/1 Jost,sans-serif;padding:0 0 3px}
.suivant{width:62%;border-radius:999px;padding:16px;font:500 12.5px Jost,sans-serif;letter-spacing:.2em;color:var(--noir)}
.puce{border-radius:999px;padding:8px 14px;font:400 13.5px Jost,sans-serif;white-space:nowrap}
.puce.on{background:var(--noir);color:var(--fond);border-color:var(--noir)}
.pts{display:flex;gap:6px;justify-content:center;padding:8px 0 4px}.pts i{width:7px;height:7px;border-radius:50%;background:rgba(30,28,27,.2);transition:all .25s}.pts i.on{width:20px;border-radius:4px;background:var(--noir)}
.style-lien{display:block;margin:6px auto 0;border:0;background:none;padding:4px;font:400 12.5px Jost,sans-serif;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
/* 08/11 (Marie) : le fond en vignettes, comme de petits fonds d'écran (fini les ronds) */
.grilleF{display:flex;gap:8px;overflow-x:auto;padding:6px 22px 8px;scrollbar-width:none;scroll-snap-type:x proximity}.grilleF::-webkit-scrollbar{display:none}
.vg{flex:none;width:44px;height:78px;padding:0;border:0;border-radius:11px;overflow:hidden;position:relative;background:#eee;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);scroll-snap-align:center;transition:transform .2s}
.vg .f100{position:absolute!important;left:0;top:0;width:170px!important;height:302px!important;transform:scale(.2588);transform-origin:0 0;pointer-events:none}
.vg .f100 .tuile{width:170px!important;height:302px!important;border-radius:0!important}
.vg.on{box-shadow:0 0 0 2.5px var(--fond),0 0 0 4px var(--noir);transform:translateY(-2px)}
.vg.sans{display:grid;place-items:center;font:400 9.5px Jost,sans-serif;color:var(--muted);background:rgba(255,255,255,.6);border:1px dashed rgba(30,28,27,.3)}
.pastille{width:40px;height:40px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .2s}
.pastille.on{transform:scale(1.08);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 0 0 3px var(--fond),0 0 0 4.5px var(--noir)}
.pol{border-radius:16px;padding:10px 15px;font-size:20px;white-space:nowrap;min-width:80px}
.pol.on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--noir)}
/* 08/11 (Marie) : les charms comme les stickers de l'iPhone : un tiroir, une grille de gros charms, les familles en petites icônes */
.tiroir{margin:0 12px;height:100%;display:flex;flex-direction:column;border-radius:22px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 26px -14px rgba(0,0,0,.35);overflow:hidden}
.familles{display:flex;align-items:center;gap:2px;padding:6px 8px 4px;overflow-x:auto;scrollbar-width:none;flex:none}.familles::-webkit-scrollbar{display:none}
.familles button{flex:none;width:34px;height:30px;border:0;border-radius:10px;background:transparent center/22px no-repeat;padding:0;opacity:.55;font:500 15px/30px Jost,sans-serif;transition:background .2s,opacity .2s}
.familles button.on{opacity:1;background-color:rgba(30,28,27,.08)}
.familles .loupe{background-image:none}
.familles .loupe svg{width:17px;height:17px;vertical-align:middle}
.familles input{flex:1;min-width:0;border:0;outline:0;border-radius:10px;background:rgba(118,118,128,.12);padding:6px 10px;font:400 14px Jost,sans-serif}
.grilleC{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:44px;gap:2px 0;overflow-y:auto;padding:0 6px 6px;scrollbar-width:none;align-content:start}.grilleC::-webkit-scrollbar{display:none}
.grilleC button{border:0;background:transparent center/80% no-repeat;padding:0;border-radius:10px;transition:transform .12s}
.grilleC button:active{transform:scale(.85)}
.grilleC .rien{grid-column:1/-1;font:300 13px Jost,sans-serif;color:var(--muted);padding:14px 0;text-align:center}
.fin{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(30,28,27,.35);opacity:0;pointer-events:none;transition:opacity .35s}
.fin.on{opacity:1;pointer-events:auto}
.fin>div{background:#fff;border-radius:26px 26px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom) + 18px);text-align:center}
.fin h3{margin:0;font:400 28px/1.1 Jost,sans-serif}
.fin p{margin:10px 0 18px;font:300 14.5px/1.5 Jost,sans-serif;color:var(--muted)}
.fin small{display:block;margin-top:10px;font:300 12px Jost,sans-serif;color:var(--muted)}
.fin .noir{width:100%;border:0;border-radius:999px;background:var(--noir);color:var(--fond);padding:16px;font:500 12.5px Jost,sans-serif;letter-spacing:.2em}
.fin .lien{border:0;background:none;padding:12px;font:300 14px Jost,sans-serif;color:var(--muted)}
.maquette{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:10px;z-index:8;font:400 9px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;background:var(--noir);color:#fff;padding:3px 7px;border-radius:999px;opacity:.45}
</style></head><body>
<div id="tel">
  <div id="ambiance"></div>
  <span class="maquette">Maquette</span>
  <div class="haut" id="haut"><b id="hautT">Personnalisez · 1 sur 5</b><div class="barre" id="barre"><i></i><i></i><i></i><i></i><i></i></div><h2 id="titre"></h2><p id="aide"></p></div>
  <div id="mini"><iframe id="site" title="Votre site" src="loginail-creer/pret.html?nouveau&exemple=dilerna&style=1&couleur=rose&mode=jour&police=bonbon&paillettes=nacre&photos=cerise-5&photoune=haut&photosalon=1&portrait=cerise"></iframe></div>
  <button class="fl verre" id="avant" type="button" aria-label="En-tête précédent">‹</button><button class="fl verre" id="apres" type="button" aria-label="En-tête suivant">›</button>
  <button class="fl verre" id="oeil" type="button" aria-label="Voir mon site en grand"><svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="verre" id="fermerPlein" type="button" hidden>‹ Personnaliser</button>
  <div class="bas" id="bas"><div class="choix" id="contenu"></div>
    <div class="pied"><button class="retour verre" id="retour" type="button" aria-label="Retour">‹</button><button class="suivant verre" id="suivant" type="button">SUIVANT</button></div></div>
  <div class="fin" id="fin"><div><h3>Votre site est prêt à briller.</h3><p>Personnalisé par vous, jusqu’au moindre charm.<br>Le premier mois est offert.</p>
    <button class="noir" type="button">ACTIVER MON SITE</button><small>Sans engagement · (maquette : rien n’est payé)</small>
    <button class="lien" id="finRetour" type="button">Continuer à personnaliser</button></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const F = $("site");
{ const q = new URLSearchParams(location.search).get("src"); if (q && /^loginail-creer\/pret\.html\?/.test(q)) F.src = q; }   // le coup de cœur choisi
let W = null, D = null, etape = 0, forme = 1, plein = false, sousCouleur = "nom", vifChoisi = "";
const ETAPES = [
  { t: "Votre en-tête", a: "" }, { t: "Votre fond", a: "" }, { t: "Vos couleurs", a: "" }, { t: "Votre écriture", a: "" }, { t: "Vos charms", a: "" }];
const NB_FORMES = 6, NOMS_FORMES = ["Amande", "Stiletto", "Carré", "Ovale", "Coffin", "Carré arrondi"];
const ENCRES = [["", "Comme le site", "conic-gradient(#E8C4B0,#C6B4E6,#B9D7EE,#A9B59C,#E8C4B0)"], ["#1E1C1B", "Noir"], ["#FFFFFF", "Blanc"], ["#B8B8C0", "Argent"], ["#C9A45C", "Doré"], ["#5B3A2E", "Chocolat"], ["#C8102E", "Rouge"], ["#6E0F31", "Bordeaux"], ["#B4587A", "Vieux rose"], ["#E5197E", "Fuchsia"], ["#7B62A8", "Lilas"], ["#2E4A8A", "Bleu"], ["#3E6A4A", "Vert"]];
let encre = "";
const FAM = [["Populaires", null, ""], ["Cœurs", /coeur/, "coeurchrome"], ["Fruits", /fraise|cerise|citron|peche|orange|ananas|pomme|framboise|kiwi|banane|myrtille|pasteque|raisin|poire|fruit/, "fraisegelee"],
  ["Fleurs", /fleur|rose|hibiscus|marguerite|tulipe|lys|pivoine|lotus|tournesol/, "hibiscus"], ["Étoiles", /etoile|lune|planete|soleil|ciel|comete|astro/, "planete"],
  ["Animaux", /chat|ours|papillon|lapin|chien|canard|poisson|cygne|abeille|serpent|grenouille|dauphin|licorne|coccinelle|tortue|cheval|panda|renard|biche/, "papillondore"],
  ["Gourmand", /gateau|glace|bonbon|chocolat|cookie|donut|cafe|sushi|macaron|cupcake|sucette|boba|bubble|croissant|pizza|cocktail/, "chocolat"],
  ["Bijoux", /perle|strass|diamant|cristal|couronne|noeud|bague|bijou|minaudiere|sac|parfum|levre/, "perle"]];
const POP = ["fraisegelee", "oeilbleu", "fleursixties", "couronnestrass", "consoleviolette", "perle", "canard", "levresgrillz", "boule8", "etoiledemerperles", "cristal", "chocolat", "hibiscus", "minaudiere", "cerisesor", "bouledisco", "ceriseruban", "fraiseperle", "noeudgelee", "coeurchrome", "martien", "planete", "papillondore", "soleil"];
let famille = "Populaires", recherche = "", enRecherche = false;

const clique = sel => { const b = D && D.querySelector(sel); if (b) b.click(); return b; };
const defile = () => D.querySelector(".defile") || D.scrollingElement;
const enHaut = () => { try { defile().scrollTop = 0; W.scrollTo(0, 0); } catch (e) {} };
const ouvreOnglet = n => clique(`.pc-onglets [data-tab="${n}"]`);
/* chaque changement en fondu : le site disparaît, change, puis revient (jamais de carré blanc) */
let tFondu = 0;
function enFondu(fn) { clearTimeout(tFondu); F.classList.add("fondu");
  tFondu = setTimeout(() => { fn(); tFondu = setTimeout(() => { poseEncre(); enHaut(); ambiance(); F.classList.remove("fondu"); }, 260); }, 180); }
/* les couleurs rangées : d'abord les neutres (du clair au foncé), puis l'arc-en-ciel */
function rgb(s) { const m = (s || "").match(/\d+/g); if (m && m.length >= 3) return m.slice(0, 3).map(Number); const h = (s.match(/#([0-9a-f]{6})/i) || [])[1]; return h ? [0, 2, 4].map(k => parseInt(h.substr(k, 2), 16)) : [0, 0, 0]; }
function teinte(s) { const [r, g, b] = rgb(s).map(x => x / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1)); let h = 0; if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360;
  return sat < .18 ? -1 + (1 - l) * .9 : ((h + 345) % 360) + l * .5; }
const range = l => l.slice().sort((a, b) => teinte(a.style.background) - teinte(b.style.background));
/* le téléphone : TOUJOURS la même taille */
function taille() {
  const T = $("tel"), basH = $("bas").offsetHeight, hautH = $("haut").offsetTop + 74;
  if (plein) { const k = T.clientWidth / 390; F.style.transform = `scale(${k})`; F.style.height = (T.clientHeight / k) + "px"; Object.assign($("mini").style, { top: "0px", width: T.clientWidth + "px", height: T.clientHeight + "px" }); return; }
  const h = Math.max(220, T.clientHeight - basH - hautH - 10), k = (h - 12) / 844, w = 390 * k + 12;
  F.style.transform = `scale(${k})`; F.style.height = "844px";
  Object.assign($("mini").style, { top: hautH + "px", width: w + "px", height: h + "px" });
  const cx = T.clientWidth / 2, cy = hautH + h / 2;
  Object.assign($("avant").style, { left: Math.max(26, cx - w / 2 - 30) + "px", top: cy + "px" }); Object.assign($("apres").style, { left: Math.min(T.clientWidth - 26, cx + w / 2 + 30) + "px", top: cy + "px" });
  Object.assign($("oeil").style, { left: (cx + w / 2) + "px", top: (hautH + h - 30) + "px" });
  $("avant").hidden = $("apres").hidden = etape !== 0;
}
/* son fond derrière le téléphone, en transparence (s'il bouge, il bouge aussi) */
function ambiance() {
  try { const a = $("ambiance"), t = D.querySelector(".ecran .tuile");
    if (!t || !W.__pzEtat?.().fond) { a.innerHTML = ""; return; }
    const h = t.outerHTML.replace(/url\((['"]?)\.\.\/loginail-site\//g, "url($1loginail-site/"); if (a._h !== h) { a._h = h; a.innerHTML = `<div class="f100 fond-site" style="position:absolute;inset:0">${h}</div>`; } } catch (e) {}
}
function rend() {
  $("hautT").textContent = `Personnalisez · ${etape + 1} sur 5`;
  [...$("barre").children].forEach((i, k) => i.classList.toggle("on", k <= etape));
  $("titre").textContent = ETAPES[etape].t; $("aide").textContent = ETAPES[etape].a;
  $("retour").style.visibility = etape ? "visible" : "hidden";
  $("suivant").textContent = etape === 4 ? "C’EST PARFAIT" : "SUIVANT";
  const c = $("contenu");
  if (etape === 0) {
    c.innerHTML = `<div class="ligneH" id="formes">${NOMS_FORMES.map((n, k) => `<button class="puce verre ${k + 1 === forme ? "on" : ""}" data-forme="${k + 1}">${n}</button>`).join("")}</div>`;
    requestAnimationFrame(() => $("formes")?.querySelector(".on")?.scrollIntoView({ inline: "center", block: "nearest" }));
  } else if (etape === 1) {
    const cats = [...D.querySelectorAll("#pzCats [data-c]")];
    c.innerHTML = `<div class="ligneH"><button class="puce verre" id="de" type="button">🎲 Surprenez-moi</button>${cats.map(b => `<button class="puce verre ${b.classList.contains("on") ? "on" : ""}" data-cat="${b.dataset.c}">${b.textContent}</button>`).join("")}</div>
      <div class="grilleF" id="grilleF">${vignettes()}</div>`;
    ajusteFonds();
  } else if (etape === 2) {
    const SC = [["nom", "Le nom"], ["boutons", "Les boutons"], ["site", "Le site"]];
    let l = "";
    if (sousCouleur === "nom") l = ENCRES.map(x => `<button class="pastille ${x[0] === encre ? "on" : ""}" data-encre="${x[0]}" title="${x[1]}" style="background:${x[2] || x[0]}"></button>`).join("");
    if (sousCouleur === "boutons") l = range([...D.querySelectorAll(".pf-vifs [data-vif]")]).map(b => `<button class="pastille ${b.dataset.vif === vifChoisi ? "on" : ""}" data-vif="${b.dataset.vif}" title="${b.title}" style="background:${b.style.background}"></button>`).join("");
    if (sousCouleur === "site") l = range([...D.querySelectorAll(".pf-dots [data-co]")]).map(b => `<button class="pastille ${b.classList.contains("on") ? "on" : ""}" data-co="${b.dataset.co}" title="${b.title}" style="background:${b.style.background}"></button>`).join("");
    c.innerHTML = `<div class="ligneH" style="justify-content:center">${SC.map(x => `<button class="puce verre ${x[0] === sousCouleur ? "on" : ""}" data-sc="${x[0]}">${x[1]}</button>`).join("")}</div><div class="ligneH" id="teintes">${l}</div>`;
  } else if (etape === 3) {
    const pols = [...D.querySelectorAll("#pzPol [data-p]")];
    c.innerHTML = `<div class="ligneH">${pols.map(b => `<button class="pol verre ${b.classList.contains("on") ? "on" : ""}" data-p="${b.dataset.p}" style="${b.getAttribute("style")}">${b.textContent}</button>`).join("")}</div>`;
  } else {
    const LOUPE = `<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    c.innerHTML = `<div class="tiroir"><div class="familles" id="familles">${enRecherche
        ? `<button class="loupe on" data-loupe aria-label="Fermer la recherche">${LOUPE}</button><input id="cherche" placeholder="Fraise, cœur, étoile…" value="${recherche}">`
        : `<button class="loupe" data-loupe aria-label="Chercher">${LOUPE}</button>` + FAM.map(f => `<button class="${f[0] === famille ? "on" : ""}" data-fam="${f[0]}" title="${f[0]}" style="${f[2] ? `background-image:url(loginail-site/charms-mini/${f[2]}.webp)` : ""}">${f[2] ? "" : "★"}</button>`).join("")}</div>
      <div class="grilleC" id="grilleC"></div></div>`;
    remplitCharms(); if (enRecherche) { const i = $("cherche"); i.oninput = e => { recherche = e.target.value; remplitCharms(); }; i.focus(); }
  }
  requestAnimationFrame(taille);
}
/* les vignettes : le vrai fond (celui du site), en petit format téléphone */
function vignettes() {
  return [...D.querySelectorAll("#pzFonds [data-f]")].map(b => { const t = b.querySelector(".f100"); let h = "";
    if (t) { const c = t.cloneNode(true); c.removeAttribute("style"); const tu = c.querySelector(".tuile"); if (tu) ["width", "height", "border-radius"].forEach(k => tu.style.removeProperty(k)); h = c.outerHTML.replace(/url\((['"]?)\.\.\/loginail-site\//g, "url($1loginail-site/"); }
    return b.dataset.f ? `<button class="vg" data-f="${b.dataset.f.replace(/"/g, "&quot;")}" title="${b.title || ""}">${h}</button>` : `<button class="vg sans" data-f="">Aucun</button>`; }).join("");
}
