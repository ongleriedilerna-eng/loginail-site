/* 08/11 (Marie) : MAQUETTE « Personnalisez votre site ».

   Derrière : son fond en transparence (il bouge aussi s'il bouge). Boutons en « verre » (pilules blanches transparentes), « Suivant » au milieu.
   Ordre : 1 En-tête (flèches) → 2 Fond → 3 Couleurs (le nom, puis les boutons, puis le site ; rangées par teinte) → 4 Écriture → 5 Charms.
