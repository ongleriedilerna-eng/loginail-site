<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tes 7 baddies</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#C2456F;--noir:#1E1C1B;--gris:#7A6F6B}
*{box-sizing:border-box}
body{margin:0;background:#F6EFEA;font-family:Jost,sans-serif;color:var(--noir);padding:18px 16px 110px}
h1{font-family:'Abril Fatface',serif;font-weight:400;font-size:27px;line-height:1.15;margin:4px 0 6px}
p.s{margin:0 0 16px;color:var(--gris);font-size:15px;line-height:1.4}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 26px;background:#fff;border-radius:18px;padding:12px}
.cmp b{display:block;text-align:center;font-size:13px;font-weight:500;margin-bottom:6px;letter-spacing:.04em}
.cmp b.n{color:var(--rose)}
.tel{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:600/1298;background:#ddd center/cover no-repeat;border:3px solid var(--noir);box-shadow:0 10px 22px -10px rgba(60,30,40,.35)}
h2{font-family:'Abril Fatface',serif;font-weight:400;font-size:21px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.g .tel{border-radius:12px;border-width:2px}
.g .num{width:34px;height:34px;font-size:19px;left:5px;top:5px;box-shadow:0 0 0 2px #fff}
.g .ok{width:24px;height:24px;font-size:14px;right:5px;top:5px}
.c span.nm{font-size:12px!important;margin-top:4px!important}
.c{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.c .tel{transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.c:active .tel{transform:scale(.97)}
.c.on .tel{border-color:var(--rose);box-shadow:0 0 0 4px #F7C9D8,0 10px 22px -10px rgba(194,69,111,.6)}
.num{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--noir);color:#fff;display:grid;place-items:center;font-weight:500;font-size:15px;z-index:2}
.c.on .num{background:var(--rose)}
.ok{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;display:none;place-items:center;font-size:17px;z-index:2}
.c.on .ok{display:grid}
.c span.nm{display:block;margin-top:7px;font-weight:500;font-size:15px}
.barre{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -6px 20px rgba(60,30,40,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.barre .cpt{font-family:'Abril Fatface',serif;font-size:24px;color:var(--rose);min-width:48px}
.barre .liste{flex:1;font-size:14px;color:var(--gris);line-height:1.3}
.secoue{animation:sec .35s ease}
@keyframes sec{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style></head><body>
<h1>Classe ou baddie ?<br>Tes 7 baddies</h1>
<p class="s">Dans « Classe ou baddie ? », côté <b>Baddie</b>, on met 7 de tes looks, et ils <b>bougent</b> (paillettes, fonds, charms). Touche les <b>7</b> que tu veux.</p>

<div class="g" id="g"></div>

<div class="barre"><div class="cpt" id="cpt">0/7</div><div class="liste" id="liste">Touche un look pour le choisir</div></div>

<script>
const NOMS=["Cyber Nails","Nuage Nails","L’Atelier Argent","Jelly Nails","Studio Nacre","Rio Nails","Cherry Disco","Pink Léo","Holo Bar","Les Ongles de Cerise","La Sirène Noire"];
const g=document.getElementById('g'), choix=[];
NOMS.forEach((n,i)=>{const b=document.createElement('button');b.className='c';b.dataset.i=i+1;
  b.innerHTML=`<div class="tel" style="background-image:url(../loginail-site/apercus-univers/look-roue-anim-${i+1}.webp)"><span class="num">${i+1}</span><span class="ok">✓</span></div><span class="nm">${n}</span>`;
  b.onclick=()=>{const k=choix.indexOf(i+1);
    if(k>=0){choix.splice(k,1);b.classList.remove('on')}
    else if(choix.length<7){choix.push(i+1);b.classList.add('on')}
    else{const c=document.getElementById('cpt');c.classList.remove('secoue');void c.offsetWidth;c.classList.add('secoue');return}
    maj()};
  g.append(b)});
function maj(){document.getElementById('cpt').textContent=choix.length+'/7';
  document.getElementById('liste').textContent=choix.length?('Tes choix : '+choix.join(', ')+(choix.length===7?' — dis-les-moi !':'')):'Touche un look pour le choisir';
  document.title='CHOIX:'+choix.join(',')}
</script>
</body></html>
