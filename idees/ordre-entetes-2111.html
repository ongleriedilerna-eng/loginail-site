<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordre des en-têtes</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f1ee;color:#2a2224}
header{position:sticky;top:0;z-index:5;background:#fff;padding:12px 16px;box-shadow:0 2px 10px #0001}
h1{font-size:18px;margin:0 0 4px}
p{margin:0;font-size:14px;color:#6b5b60}
.barre{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:0;border-radius:99px;padding:8px 14px;background:#2a2224;color:#fff;cursor:pointer}
button.doux{background:#eee;color:#2a2224}
#compte{font-weight:600;font-size:14px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px}
.c{position:relative;cursor:pointer;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 6px #0002;transition:transform .12s}
.c:active{transform:scale(.97)}
.ec{position:relative;width:100%;aspect-ratio:390/844;overflow:hidden;background:#eee}
.ec img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.ec iframe{position:absolute;top:0;left:0;width:390px;height:844px;border:0;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .25s}
.ec iframe.vu{opacity:1}
.num{position:absolute;top:6px;left:6px;background:#fff;color:#2a2224;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 1px 4px #0003}
.nom{font-size:13px;padding:6px 8px 8px;line-height:1.2}
.choix{position:absolute;inset:0;border:4px solid #d6336c;border-radius:14px;display:none}
.c.pris .choix{display:block}
.rang{position:absolute;top:6px;right:6px;background:#d6336c;color:#fff;border-radius:99px;min-width:30px;height:30px;display:none;place-items:center;font-weight:800;font-size:15px}
.c.pris .rang{display:grid}
</style></head><body>
<header>
  <h1>Ordre des en-têtes — 85 en-têtes</h1>
  <p>Le petit chiffre blanc = la place d'aujourd'hui dans Personnaliser. Touchez les en-têtes dans l'ordre que vous voulez (la plus jolie en premier). Retouchez pour enlever.</p>
  <div class="barre"><span id="compte">0 choisie</span><button class="doux" id="annule">Enlever la dernière</button><button class="doux" id="vide">Tout effacer</button></div>
</header>
<div class="grille" id="g"></div>
<script>
let ordre = [];
try { ordre = JSON.parse(localStorage.getItem("ordreEntetes2111") || "[]"); } catch (e) {}
fetch("ordre-entetes-2111/liste.json").then(r => r.json()).then(L => {
  window.LISTE = L;
  const g = document.getElementById("g");
  L.forEach(([k, nom], i) => {
    const c = document.createElement("div"); c.className = "c"; c.dataset.k = k;
    c.innerHTML = `<div class="ec"><img loading="lazy" src="ordre-entetes-2111/${k}.webp" alt=""></div><span class="num">${i + 1}</span><span class="rang"></span><div class="choix"></div><div class="nom">${nom}</div>`;
    c.onclick = () => { const j = ordre.indexOf(k); if (j >= 0) ordre.splice(j, 1); else ordre.push(k); maj(); };
    g.appendChild(c);
  });
  maj();
  /* les en-têtes BOUGENT : le vrai site tourne dans chaque vignette visible (et s'arrête quand on s'éloigne) */
  const SRC = k => `../loginail-creer/pret.html?v=1511m&nouveau&exemple=dilerna&style=1&couleur=noir&mode=jour&police=affiche&paillettes=nacre&photos=moka-4&photosalon=1&portrait=moka&entete=${k}`;
  const echelle = () => document.querySelectorAll(".ec").forEach(e => { const f = e.querySelector("iframe"); if (f) f.style.transform = `scale(${e.clientWidth / 390})`; });
  addEventListener("resize", echelle);
  const io = new IntersectionObserver(es => es.forEach(x => { const ec = x.target, k = ec.parentElement.dataset.k; let f = ec.querySelector("iframe");
    if (x.isIntersecting && !f) { f = document.createElement("iframe"); f.setAttribute("scrolling", "no"); f.src = SRC(k);
      f.onload = () => { try { const d = f.contentDocument, st = d.createElement("style"); st.textContent = ".pret,.langues,.indiceD{display:none!important}html{scrollbar-width:none}::-webkit-scrollbar{display:none}"; d.head.appendChild(st); } catch (e) {} setTimeout(() => f.classList.add("vu"), 900); };
      ec.appendChild(f); echelle(); }
    else if (!x.isIntersecting && f) f.remove(); }), { rootMargin: "300px 0px" });
  document.querySelectorAll(".ec").forEach(e => io.observe(e));
});
function maj() {
  try { localStorage.setItem("ordreEntetes2111", JSON.stringify(ordre)); } catch (e) {}
  document.querySelectorAll(".c").forEach(c => { const j = ordre.indexOf(c.dataset.k); c.classList.toggle("pris", j >= 0); c.querySelector(".rang").textContent = j >= 0 ? j + 1 : ""; });
  document.getElementById("compte").textContent = ordre.length + (ordre.length > 1 ? " choisies" : " choisie");
  window.ORDRE = ordre.slice();
}
document.getElementById("annule").onclick = () => { ordre.pop(); maj(); };
document.getElementById("vide").onclick = () => { if (confirm("Tout effacer ?")) { ordre = []; maj(); } };
</script>
</body></html>
