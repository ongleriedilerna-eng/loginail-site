<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordre des téléphones</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#C2456F;--noir:#1E1C1B;--gris:#7A6F6B}
*{box-sizing:border-box}
body{margin:0;background:#F6EFEA;font-family:Jost,sans-serif;color:var(--noir);padding:18px 16px 40px}
h1{font-family:'Abril Fatface',serif;font-weight:400;font-size:26px;line-height:1.15;margin:4px 0 6px}
h2{font-family:'Abril Fatface',serif;font-weight:400;font-size:21px;margin:30px 0 4px}
p.s{margin:0 0 12px;color:var(--gris);font-size:15px;line-height:1.4}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.c{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tel{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:600/1298;background:#ddd center/cover no-repeat;border:2px solid var(--noir);transition:transform .15s ease,opacity .2s ease,border-color .15s}
.c:active .tel{transform:scale(.95)}
.c.on .tel{border-color:var(--rose)}
.c.off .tel{opacity:.35}
.rg{position:absolute;inset:0;display:none;place-items:center;background:rgba(194,69,111,.35)}
.rg b{width:40px;height:40px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 3px #fff}
.c.on .rg{display:grid}
.c small{display:block;font-size:11px;margin-top:3px;line-height:1.2}
.res{margin:12px 0 0;background:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.res .t{flex:1;font-size:14px;line-height:1.35}
.res .t b{color:var(--rose)}
.res button{border:0;background:#F3E6EA;color:var(--rose);border-radius:99px;padding:9px 14px;font:500 14px Jost,sans-serif;cursor:pointer}
.apercu{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.apercu .tel{flex:0 0 64px}
</style></head><body>
<h1>L’ordre des téléphones</h1>
<p class="s">Touche les looks <b>dans l’ordre</b> où tu veux les voir : le 1er touché sera le 1er à l’écran.</p>

<h2>La roue du haut</h2>
<p class="s">Les 11 looks, sous « Créer mon site gratuitement ».</p>
<div class="g" id="g1"></div>
<div class="res"><div class="t" id="t1"></div><button onclick="raz(0)">Recommencer</button></div>
<div class="apercu" id="a1"></div>

<h2>Classe ou baddie : côté Baddie</h2>
<p class="s">7 looks. Aujourd’hui : 3, 7, 11, 4, 1, 5, 10.</p>
<div class="g" id="g2"></div>
<div class="res"><div class="t" id="t2"></div><button onclick="raz(1)">Recommencer</button></div>
<div class="apercu" id="a2"></div>

<script>
const NOMS=["Cyber Nails","Nuage Nails","L’Atelier Argent","Jelly Nails","Studio Nacre","Rio Nails","Cherry Disco","Pink Léo","Holo Bar","Les Ongles de Cerise","La Sirène Noire"];
const IMG=i=>`../loginail-site/apercus-univers/look-roue-anim-${i}.webp`;
const BL=[{max:11,ordre:[],g:'g1',t:'t1',a:'a1'},{max:7,ordre:[],g:'g2',t:'t2',a:'a2'}];
BL.forEach((bl,k)=>{const g=document.getElementById(bl.g);
  NOMS.forEach((n,i)=>{const b=document.createElement('button');b.className='c';
    b.innerHTML=`<div class="tel" style="background-image:url(${IMG(i+1)})"><span class="rg"><b></b></span></div><small>${i+1} · ${n}</small>`;
    b.onclick=()=>{const p=bl.ordre.indexOf(i+1);if(p>=0)bl.ordre.splice(p,1);else if(bl.ordre.length<bl.max)bl.ordre.push(i+1);maj()};g.append(b)})});
function raz(k){BL[k].ordre=[];maj()}
function maj(){BL.forEach(bl=>{const bs=document.getElementById(bl.g).children;
  [...bs].forEach((b,i)=>{const p=bl.ordre.indexOf(i+1);b.classList.toggle('on',p>=0);b.classList.toggle('off',p<0&&bl.ordre.length>=bl.max);b.querySelector('.rg b').textContent=p+1});
  const fini=bl.ordre.length===bl.max;
  document.getElementById(bl.t).innerHTML=bl.ordre.length?`${fini?'<b>C’est bon !</b> ':''}Ordre : <b>${bl.ordre.join(', ')}</b>${fini?'':` <span style="color:#7A6F6B">(${bl.ordre.length}/${bl.max})</span>`}`:'Touche le 1er look…';
  document.getElementById(bl.a).innerHTML=bl.ordre.map(i=>`<div class="tel" style="background-image:url(${IMG(i)})"></div>`).join('')});
  document.title='ORDRE roue='+BL[0].ordre.join(',')+' baddie='+BL[1].ordre.join(',')}
maj();
</script>
</body></html>
