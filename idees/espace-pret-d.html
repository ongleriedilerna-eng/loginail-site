<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idée D · Votre espace est prêt</title>
<link href="../loginail-creer/polices.css" rel="stylesheet">
<style>
/* Idée D (21/11) : même esprit que la page 1 « Un lien suffit. » (D26) : logo en haut à gauche, grand titre Cormorant
   avec le mot en rose italique + ✦ qui scintille, « tu », pastilles blanches qui se cochent une à une, bouton noir
   juste en dessous (pas tout en bas), carte rose « 1er mois offert » penchée, étoiles ✦ roses dans le décor. */
:root{--fond:#F6F3EF;--noir:#1E1C1B;--muted:#5F5751;--doux:#8A817A;--rose:#B5475E;--rosé:#F7E9EA;--vert:#2A6F44;
  --pop:cubic-bezier(.3,1.5,.5,1);--doux-out:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fond);color:var(--noir);font-family:Jost,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#tel{max-width:480px;height:100dvh;margin:0 auto;position:relative;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 16px)}
.logo{width:104px;flex:none}
.centre{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:6vh}
.etape{margin:0 0 14px;font:400 13px Jost;color:var(--doux);animation:monte .5s both}
@font-face{font-family:'Abril Fatface';src:url(../loginail-site/polices/AbrilFatface-400-latin.woff2) format('woff2')}
/* titre comme la page 1 et l'accueil (D38, D46) : Abril Fatface, le mot mis en avant en rose, sans italique */
h1{margin:0;font:400 clamp(40px,11vw,48px)/1.02 'Abril Fatface',serif;letter-spacing:-.01em;animation:monte .5s .08s both}
h1 em{font-style:normal;color:#B03562;position:relative}
h1 .st{position:absolute;right:-.42em;top:-.08em;font-size:.36em;font-style:normal;color:#E99AB6;animation:scint 2.6s ease-in-out infinite}
.sous{margin:14px auto 0;max-width:30ch;font:400 16px/1.5 Jost;color:var(--muted);animation:monte .5s .16s both}
.pastilles{margin-top:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pastille{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 10px;border-radius:999px;background:#fff;border:1px solid rgba(30,28,27,.1);font:400 15px Jost;
  opacity:0;transform:scale(.85);animation:pose .45s var(--pop) forwards}
.pastille i{width:22px;height:22px;border-radius:50%;background:var(--rosé);display:grid;place-items:center;flex:none}
.pastille i svg{width:12px;height:12px;stroke:var(--rose);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:coche .3s ease-out forwards;animation-delay:inherit}
.go{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:999px;background:var(--noir);color:var(--fond);font:500 17px Jost;text-decoration:none;animation:monte .5s 1s both}
.go svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none}
.cadeau{margin-top:22px;display:inline-flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;background:#fff;border-radius:18px;transform:rotate(-3deg);box-shadow:0 14px 30px -16px rgba(30,28,27,.35);text-align:left;animation:monte .5s 1.1s both}
.cadeau i{width:42px;height:42px;border-radius:12px;background:var(--rosé);display:grid;place-items:center;color:var(--rose);font-style:normal}
.cadeau b{display:block;font:600 15px Jost}.cadeau span{font:400 12px Jost;color:var(--doux)}
.etoile{position:absolute;color:#E99AB6;pointer-events:none;animation:scint 3s ease-in-out infinite}
@keyframes monte{from{opacity:0;transform:translateY(12px)}}
@keyframes pose{to{opacity:1;transform:none}}
@keyframes coche{to{stroke-dashoffset:0}}
@keyframes scint{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
</style>
</head>
<body>
<div id="tel">
  <svg class="logo" viewBox="0 -2 330 72" aria-label="Loginail"><g transform="scale(.5)"><rect x="0" y="5" width="225" height="120" rx="60" fill="#1E1C1B"/><path d="M172 21H215C254 21 282 42 282 65C282 88 254 109 215 109H172A44 44 0 0 1 172 21Z" fill="#1E1C1B"/><path d="M172 28H213C247 28 274 47 274 65C274 83 247 102 213 102H172A37 37 0 0 1 172 28Z" fill="#F3EEE8"/></g><text x="160" y="42" font-family="Jost,sans-serif" font-weight="300" font-size="22" letter-spacing="9" fill="#1E1C1B">LOGINAIL</text></svg>
  <span class="etoile" style="left:12%;top:18%;font-size:14px">✦</span>
  <span class="etoile" style="right:10%;top:26%;font-size:10px;animation-delay:-1s">✦</span>
  <span class="etoile" style="left:8%;bottom:22%;font-size:11px;animation-delay:-2s">✦</span>
  <span class="etoile" style="right:14%;bottom:14%;font-size:15px;animation-delay:-.5s">✦</span>
  <div class="centre">
    <div class="etape">Ton espace Loginail</div>
    <h1 id="titre">Tout est <em>prêt<span class="st">✦</span></em>.</h1>
    <div class="sous" id="sous">Bienvenue Marie : tout ce que tu as rempli y est déjà.</div>
    <div class="pastilles" id="pastilles"></div>
    <a class="go">Ouvrir mon espace <svg viewBox="0 0 16 16"><path d="M2 8h12M9 3l5 5-5 5"/></svg></a>
    <div class="cadeau"><i>🎁</i><div><b>1er mois offert</b><span>sans engagement</span></div></div>
  </div>
</div>
<script>
let b = null; try { b = JSON.parse(localStorage.getItem("loginail-brouillon")); } catch (e) {}
const $ = id => document.getElementById(id);
if (b?.prenom) $("sous").textContent = `Bienvenue ${b.prenom} : tout ce que tu as rempli y est déjà.`;
const n = b?.prestations?.length ?? 3, j = (b?.horaires || [1,1,1,1,1]).filter(Boolean).length;
const coche = '<i><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></i>';
[b?.nom || "Nails by Drimf", n && `${n} prestation${n > 1 ? "s" : ""}`, j && `${j} jour${j > 1 ? "s" : ""} d’ouverture`, "Ton site"]
  .filter(Boolean).forEach((t, i) => {
    const p = document.createElement("span"); p.className = "pastille"; p.innerHTML = coche;
    p.append(t); p.style.animationDelay = (.35 + i * .14) + "s"; $("pastilles").append(p);
  });
</script>
</body>
</html>
