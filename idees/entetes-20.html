<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 nouvelles en-têtes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Jost:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--rose:#B5475E;--brun:#2A1B1E;--creme:#FFF8F6}
*{box-sizing:border-box;margin:0}
body{background:#FBF1EF;font-family:Jost,sans-serif;color:var(--brun);padding:28px 16px 60px}
header.p{max-width:1240px;margin:0 auto 26px;text-align:center}
.t{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:38px}
header.p p{color:#7a5f64;margin-top:6px;font-size:15px}
.grille{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:26px 14px;justify-items:center}
.case{text-align:center;cursor:pointer;transition:opacity .25s;position:relative}
.case.non{opacity:.3}
.case.non::after{content:"Pas gardée";position:absolute;top:14px;left:50%;translate:-50% 0;background:var(--brun);color:#fff;font-size:12px;padding:4px 10px;border-radius:20px;z-index:30}
.lab{margin-top:10px;display:flex;align-items:center;gap:10px;justify-content:center;font-weight:500;font-size:17px}
.num{width:32px;height:32px;border-radius:50%;background:var(--brun);color:#fff;display:grid;place-items:center;font-size:15px}
/* le téléphone */
.tel{width:270px;height:560px;border-radius:38px;border:8px solid #1d1416;overflow:hidden;position:relative;background:url(../loginail-site/fonds-img/cerises-vichy.webp) center/210px;box-shadow:0 14px 34px rgba(60,20,30,.18)}
.ecr{position:absolute;inset:0;display:flex;flex-direction:column}
.hd{position:relative;flex:none}
.id{text-align:center;padding:10px 14px 14px;position:relative;z-index:5}
.id h1{font-family:'Playfair Display';font-weight:600;font-style:italic;font-size:27px;line-height:1.05;color:var(--brun)}
.id .s{font-size:12px;color:#6d5358;margin-top:4px;letter-spacing:.02em}
.btn{display:inline-block;margin-top:10px;background:var(--brun);color:#fff;font-size:14px;font-weight:500;padding:10px 26px;border-radius:30px;text-decoration:none}
.ecr>.id{background:rgba(255,248,246,.94);border-radius:18px;margin:8px 14px 0;padding:10px 12px 14px}
.card{background:rgba(255,248,246,.93);border-radius:18px;margin:0 14px;padding:10px 12px 14px}
.bas{flex:1;background:var(--creme);border-radius:22px 22px 0 0;margin-top:auto;padding:14px 18px;position:relative;z-index:4;min-height:96px}
.bas h3{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:20px;margin-bottom:6px}
.bas div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #f0dfdc}
.ch{position:absolute;width:44px;z-index:6;animation:fl 3.2s ease-in-out infinite;pointer-events:none}
.etoile{position:absolute;color:#e58aa0;font-size:14px;z-index:6;animation:bril 2s ease-in-out infinite}
@keyframes fl{50%{translate:0 -5px}}
@keyframes bril{50%{opacity:.25;scale:.7}}
.blanc h1{color:#fff}.blanc .s{color:#fff;opacity:.9}.blanc .btn{background:#fff;color:var(--brun)}
img.ph{object-fit:cover;display:block}

/* 1 Polaroïd */
.pola{width:170px;margin:34px auto 0;background:#fff;padding:9px 9px 30px;box-shadow:0 8px 20px rgba(0,0,0,.18);transform-origin:50% -10px;animation:bal 3.4s ease-in-out infinite;position:relative}
.pola img{width:100%;height:150px}
.pola span{position:absolute;bottom:6px;left:0;right:0;font-family:'Cormorant Garamond';font-style:italic;font-size:17px;color:var(--rose)}
.pola::before{content:"";position:absolute;top:-12px;left:50%;width:62px;height:20px;translate:-50% 0;background:rgba(240,190,200,.85);rotate:-3deg}
@keyframes bal{0%,100%{rotate:-4deg}50%{rotate:3deg}}
/* 2 Arche */
.arche{width:180px;height:220px;margin:26px auto 0;border-radius:90px 90px 14px 14px;overflow:hidden;border:4px solid var(--creme);box-shadow:0 8px 22px rgba(0,0,0,.15)}
.arche img{width:100%;height:100%;animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{to{scale:1.15}}
/* 3 Carrousel */
.carr{height:200px;margin-top:30px;overflow:hidden}
.carr .pis{display:flex;gap:10px;width:max-content;animation:defil 14s linear infinite}
.carr img{width:130px;height:200px;border-radius:16px}
@keyframes defil{to{transform:translateX(-700px)}}
/* 4 Cœur */
.coeur{width:200px;height:180px;margin:36px auto 0;clip-path:path("M100 178 C40 132 0 98 0 56 C0 21 25 0 56 0 C78 0 92 12 100 28 C108 12 122 0 144 0 C175 0 200 21 200 56 C200 98 160 132 100 178 Z");animation:pulse 1.8s ease-in-out infinite}
.coeur img{width:100%;height:100%}
@keyframes pulse{0%,100%{scale:1}15%{scale:1.06}30%{scale:1}45%{scale:1.04}}
/* 5 Néon */
.neon .hd{height:330px;background:#1a0b11}
.neon .hd img{width:100%;height:100%;opacity:.35}
.neon .id{position:absolute;inset:auto 0 18px}
.neon h1{color:#fff;text-shadow:0 0 6px #ff7fa8,0 0 16px #ff4f8b,0 0 30px #ff4f8b;animation:flick 4s infinite}
.neon .s{color:#ffc4d6}.neon .btn{background:#ff4f8b}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.45}}
/* 6 Flacon */
.flacon{margin:22px auto 0;width:170px;position:relative}
.flacon .bouch{width:56px;height:64px;margin:0 auto;background:linear-gradient(90deg,#2a1b1e,#5a3a40 40%,#2a1b1e);border-radius:10px 10px 4px 4px}
.flacon .col{width:84px;height:12px;margin:0 auto;background:#d9b9bf}
.flacon .corps{height:170px;border-radius:34px;overflow:hidden;position:relative;border:3px solid rgba(255,255,255,.8)}
.flacon .corps img{width:100%;height:100%}
.reflet::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);background-size:250% 100%;animation:ref 3.5s ease-in-out infinite}
@keyframes ref{from{background-position:150% 0}to{background-position:-60% 0}}
/* 7 Pellicule */
.pell{margin-top:34px;background:#1b1214;padding:16px 0;position:relative;overflow:hidden;rotate:-4deg;width:300px;margin-left:-15px}
.pell::before,.pell::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 18px);opacity:.9}
.pell::before{top:4px}.pell::after{bottom:4px}
.pell .pis{display:flex;gap:8px;width:max-content;animation:defil 12s linear infinite}
.pell img{width:110px;height:140px}
/* 8 Mosaïque */
.mos{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:250px;padding:14px 14px 0}
.mos div{border-radius:14px;overflow:hidden;position:relative}
.mos div:first-child{grid-row:span 2}
.mos img{width:100%;height:100%;position:absolute;inset:0}
.mos img.b{animation:fondu 6s ease-in-out infinite}
@keyframes fondu{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.ecr>.mosid{margin-top:-30px;position:relative}
.pail .ecr>.id{background:none}
/* 9 Cadre doré */
.dore{width:190px;height:230px;margin:26px auto 0;padding:9px;background:linear-gradient(135deg,#b88a3e,#f7e3a8 30%,#a8772e 50%,#f3d98f 70%,#9c6c28);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.2),inset 0 0 0 2px rgba(255,255,255,.4);position:relative}
.dore img{width:100%;height:100%;border:3px solid #fff3d6}
.dore.reflet::after{border-radius:8px}
/* 10 Étiquette */
.etiq .hd{height:330px}
.etiq .hd>img{width:100%;height:100%}
.tag{position:absolute;top:0;left:50%;width:200px;margin-left:-100px;transform-origin:50% 0;animation:bal 3.6s ease-in-out infinite}
.tag .fil{width:2px;height:60px;margin:0 auto;background:#f3d2d8}
.tag .lab2{background:var(--creme);border-radius:14px;padding:16px 12px 14px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.tag .lab2::before{content:"";position:absolute;top:6px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#e9cfd3}
.etiq .id{padding:0}
/* 11 Ruban */
.ruban .hd{height:300px}
.ruban .hd>img{width:100%;height:100%}
.rub{position:absolute;left:-10px;right:-10px;bottom:30px;background:linear-gradient(180deg,#d26a82,#b5475e);padding:12px 30px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);text-align:center;overflow:hidden}
.rub h1{color:#fff;font-family:'Playfair Display';font-style:italic;font-size:24px;font-weight:600}
/* 12 Carte postale */
.post{width:200px;height:200px;margin:30px auto 0;padding:12px;background:radial-gradient(circle at 7px 7px,#f3c9d2 4px,#fff 4.5px) 0 0/14px 14px;rotate:-3deg;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.18);animation:bal2 4s ease-in-out infinite}
.post img{width:100%;height:100%}
.tampon{position:absolute;top:22px;right:22px;width:78px;height:78px;border:2px dashed var(--rose);border-radius:50%;display:grid;place-items:center;font-size:10px;letter-spacing:.12em;color:var(--rose);font-weight:500;rotate:14deg;background:rgba(255,248,246,.85);z-index:7;line-height:1.3}
@keyframes bal2{50%{rotate:1deg}}
/* 13 Défilé */
.defi .hd{height:320px}
.defi .hd>img{width:100%;height:100%}
.band{position:absolute;left:0;right:0;bottom:22px;background:var(--brun);padding:9px 0;overflow:hidden;rotate:-5deg;width:300px;margin-left:-15px}
.band span{display:inline-block;white-space:nowrap;color:#fff;font-family:'Playfair Display';font-style:italic;font-size:18px;animation:defil2 9s linear infinite}
@keyframes defil2{to{transform:translateX(-50%)}}
/* 14 Éventail */
.event{height:250px;position:relative;margin-top:22px}
.event img{position:absolute;left:50%;top:20px;width:130px;height:180px;margin-left:-65px;border-radius:14px;border:4px solid #fff;transform-origin:50% 120%;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.event img:nth-child(1){animation:evg 3.6s ease-in-out infinite}
.event img:nth-child(2){animation:evd 3.6s ease-in-out infinite}
.event img:nth-child(3){z-index:2}
@keyframes evg{0%,100%{rotate:-8deg}50%{rotate:-20deg}}
@keyframes evd{0%,100%{rotate:8deg}50%{rotate:20deg}}
/* 15 Miroir */
.miroir{width:176px;height:230px;margin:26px auto 0;border-radius:50%;padding:7px;background:linear-gradient(135deg,#f6d9df,#fff 40%,#e7b5c0);box-shadow:0 8px 22px rgba(0,0,0,.15);position:relative;overflow:hidden}
.miroir img{width:100%;height:100%;border-radius:50%}
.miroir.reflet::after{border-radius:50%}
/* 16 Paillettes */
.pail .hd{height:560px;position:absolute;inset:0}
.pail .hd>img{width:100%;height:100%}
.pail .hd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(42,27,30,.75))}
.pail .id{position:absolute;left:0;right:0;bottom:110px}
.pail .bas{position:absolute;left:0;right:0;bottom:0;height:100px}
.gl{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:radial-gradient(#fff,#ffc6d4);z-index:3;animation:tombe linear infinite;box-shadow:0 0 6px #fff}
@keyframes tombe{to{transform:translateY(580px) rotate(360deg)}}
/* 17 Moitié */
.moit .hd{height:330px;display:flex}
.moit .hd>img{width:52%;height:100%}
.moit .droite{flex:1;background:rgba(255,248,246,.95);display:flex;align-items:center}
.moit .id{padding:8px}
.moit h1{font-size:23px}
.moit .btn{padding:9px 16px;font-size:13px}
/* 18 Tampon tournant */
.rond{width:220px;height:220px;margin:24px auto 0;position:relative;background:rgba(255,248,246,.94);border-radius:50%}
.rond svg{position:absolute;inset:0;animation:tourne 16s linear infinite}
.rond img{position:absolute;inset:34px;width:152px;height:152px;border-radius:50%;border:4px solid #fff}
@keyframes tourne{to{rotate:360deg}}
/* 19 Story */
.story .hd{height:340px}
.story .hd img{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:st 9s infinite}
.story .hd img:nth-child(2){animation-delay:3s}.story .hd img:nth-child(3){animation-delay:6s}
@keyframes st{0%{opacity:1}30%{opacity:1}36%,100%{opacity:0}}
.barres{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.barres i{flex:1;height:3px;background:rgba(255,255,255,.4);border-radius:3px;overflow:hidden;position:relative}
.barres i::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;scale:0 1;animation:prog 9s linear infinite}
.barres i:nth-child(2)::after{animation-name:prog2}.barres i:nth-child(3)::after{animation-name:prog3}
@keyframes prog{0%{scale:0 1}33%,100%{scale:1 1}}
@keyframes prog2{0%,33%{scale:0 1}66%,100%{scale:1 1}}
@keyframes prog3{0%,66%{scale:0 1}100%{scale:1 1}}
.story .av{position:absolute;bottom:-34px;left:50%;margin-left:-38px;width:76px;height:76px;border-radius:50%;padding:3px;background:conic-gradient(#ff8fb1,#b5475e,#ffc36b,#ff8fb1);z-index:9}
.story .hd{z-index:8}
.story .av img{position:static;opacity:1;animation:none;border-radius:50%;border:3px solid #fff}
.story .ecr>.id{margin-top:40px}
/* 20 Bulles */
.bul{height:250px;position:relative;margin-top:16px}
.bul img{position:absolute;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.15);animation:flb 4s ease-in-out infinite}
@keyframes flb{50%{translate:0 -12px}}
</style></head><body>
<header class="p"><h1 class="t">20 nouvelles en-têtes</h1><p>Toutes bougent en boucle. Dites-moi les numéros que vous ne gardez pas. (Touchez un téléphone pour le griser, c'est juste pour vous aider.)</p></header>
<div class="grille" id="g"></div>
<script>
var P=function(n){return '../loginail-site/univers-photos/cerise/'+n+'.webp'};
var C=function(f,css){return '<img class="ch" src="../loginail-site/charms/'+f+'" style="'+css+'" alt="">'};
var ID='<h1>les Ongles<br>de Cerise</h1><div class="s">Prothésiste ongulaire · Lyon 3e</div><a class="btn">Réserver</a>';
var BAS='<div class="bas"><h3>Prestations</h3><div><span>Semi-permanent</span><b>35 €</b></div><div><span>Gel couleur</span><b>50 €</b></div><div><span>Nail art</span><b>dès 5 €</b></div></div>';
var ET='<span class="etoile" style="top:18px;left:22px">✦</span><span class="etoile" style="top:60px;right:20px;animation-delay:-1s">✦</span>';
var IDC='<div class="id"><div class="card">'+ID+'</div></div>';
var imgs=function(k){var s='';for(var i=0;i<k;i++)s+='<img class="ph" src="'+P(i%5+1)+'">';return s};
var T=[
["Polaroïd",'',ET+C("cerises.png","top:14px;right:16px")+'<div class="hd"><div class="pola"><img class="ph" src="'+P(1)+'"><span>Cerise ♡</span></div></div><div class="id">'+ID+'</div>'+BAS],
["Arche",'',ET+C("ceriseruban.png","top:30px;left:12px")+C("cerisecoeur.png","top:200px;right:12px;animation-delay:-1.6s")+'<div class="hd"><div class="arche"><img class="ph" src="'+P(2)+'"></div></div><div class="id">'+ID+'</div>'+BAS],
["Carrousel",'',ET+C("cerisecoeur.png","top:6px;left:12px")+'<div class="hd carr"><div class="pis">'+imgs(10)+'</div></div><div class="id">'+ID+'</div>'+BAS],
["Cœur",'',ET+C("ceriseruban.png","top:26px;left:12px")+C("cerises.png","top:170px;right:14px;animation-delay:-1.4s")+'<div class="hd"><div class="coeur"><img class="ph" src="'+P(3)+'"></div></div><div class="id">'+ID+'</div>'+BAS],
["Néon","neon",C("cerisedisco.png","top:16px;right:14px")+'<div class="hd"><img class="ph" src="'+P(1)+'"><div class="id">'+ID+'</div></div>'+BAS],
["Flacon",'',ET+C("cerises.png","top:30px;left:14px")+C("biscuitcoeurnoeud.png","top:190px;right:12px;animation-delay:-1.2s")+'<div class="hd"><div class="flacon"><div class="bouch"></div><div class="col"></div><div class="corps reflet"><img class="ph" src="'+P(4)+'"></div></div></div><div class="id">'+ID+'</div>'+BAS],
["Pellicule",'',ET+C("ceriseruban.png","top:10px;right:14px")+'<div class="hd pell"><div class="pis">'+imgs(10)+'</div></div><div class="id">'+ID+'</div>'+BAS],
["Mosaïque",'',C("cerisecoeur.png","top:6px;right:6px")+'<div class="hd mos"><div><img class="ph" src="'+P(1)+'"><img class="ph b" src="'+P(5)+'"></div><div><img class="ph" src="'+P(2)+'"></div><div><img class="ph" src="'+P(3)+'"><img class="ph b" style="animation-delay:-3s" src="'+P(4)+'"></div></div><div class="id mosid">'+ID+'</div>'+BAS],
["Cadre doré",'',ET+C("cerises.png","top:20px;right:10px")+'<div class="hd"><div class="dore reflet"><img class="ph" src="'+P(2)+'"></div></div><div class="id">'+ID+'</div>'+BAS],
["Étiquette","etiq",'<div class="hd"><img class="ph" src="'+P(3)+'"><div class="tag"><div class="fil"></div><div class="lab2"><div class="id">'+ID+'</div></div></div></div>'+C("cerisecoeur.png","top:280px;left:14px")+BAS],
["Ruban","ruban",C("ceriseruban.png","top:16px;right:14px")+'<div class="hd"><img class="ph" src="'+P(1)+'"><div class="rub reflet"><h1>les Ongles de Cerise</h1></div></div><div class="id" style="padding-top:12px"><div class="s">Prothésiste ongulaire · Lyon 3e</div><a class="btn">Réserver</a></div>'+BAS],
["Carte postale",'',ET+C("cerises.png","top:200px;left:14px")+'<div class="hd"><div class="post"><img class="ph" src="'+P(5)+'"></div><div class="tampon">LYON<br>♡<br>CERISE</div></div><div class="id">'+ID+'</div>'+BAS],
["Défilé","defi",'<div class="hd"><img class="ph" src="'+P(4)+'"><div class="band"><span>'+Array(9).join("les Ongles de Cerise ✦ ")+'</span></div></div>'+C("cerisecoeur.png","top:14px;right:14px")+'<div class="id">'+ID+'</div>'+BAS],
["Éventail",'',ET+C("biscuitcoeurnoeud.png","top:10px;left:12px")+'<div class="hd event"><img class="ph" src="'+P(2)+'"><img class="ph" src="'+P(3)+'"><img class="ph" src="'+P(1)+'"></div><div class="id" style="margin-top:-20px">'+ID+'</div>'+BAS],
["Miroir",'',ET+C("ceriseruban.png","top:30px;right:12px")+C("cerises.png","top:200px;left:12px;animation-delay:-1.5s")+'<div class="hd"><div class="miroir reflet"><img class="ph" src="'+P(1)+'"></div></div><div class="id">'+ID+'</div>'+BAS],
["Paillettes","pail blanc",'<div class="hd"><img class="ph" src="'+P(2)+'">'+(function(){var s='';for(var i=0;i<22;i++)s+='<i class="gl" style="left:'+(Math.random()*100)+'%;animation-duration:'+(4+Math.random()*5)+'s;animation-delay:-'+(Math.random()*8)+'s;scale:'+(.5+Math.random())+'"></i>';return s})()+'</div>'+C("cerisedisco.png","top:16px;right:14px")+'<div class="id">'+ID+'</div>'+BAS],
["Moitié","moit",'<div class="hd"><img class="ph" src="'+P(5)+'"><div class="droite"><div class="id">'+ID+'</div></div></div>'+C("cerises.png","top:6px;right:8px")+ET.replace("left:22px","left:150px")+BAS],
