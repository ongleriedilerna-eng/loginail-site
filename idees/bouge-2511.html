<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les carrés qui bougent · 2 versions</title>
<style>
body{margin:0;background:#F6F3EF;font:400 14px Jost,system-ui,sans-serif;color:#1E1C1B}
h1{font:500 17px Jost,system-ui,sans-serif;text-align:center;margin:14px 0 2px}
p.s{text-align:center;margin:0 0 12px;color:#8A817A;font-size:13px}
.duo{display:flex;gap:22px;justify-content:center;align-items:flex-start;padding:0 10px 20px}
.tel{display:flex;flex-direction:column;align-items:center;gap:8px}
.tel b{font-weight:500;font-size:14px}.tel b i{font-style:normal;color:#B5475E}
.cadre{width:375px;height:740px;border-radius:38px;overflow:hidden;box-shadow:0 0 0 9px #1E1C1B,0 18px 40px -14px rgba(0,0,0,.5);background:#fff;transform-origin:top center}
iframe{width:375px;height:740px;border:0;display:block}
.boutons{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.boutons button{border:0;border-radius:999px;padding:9px 16px;font:500 13px Jost,system-ui,sans-serif;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.1);cursor:pointer}
.boutons button.on{background:#1E1C1B;color:#fff}
</style></head><body>
<h1>Les petits carrés : est-ce qu'ils bougent ?</h1>
<p class="s">Touche des carrés dans chaque téléphone et fais défiler.</p>
<div class="boutons"><button data-o="entete" class="on">En-têtes</button><button data-o="fond">Fonds</button></div>
<div class="duo">
  <div class="tel"><b>Aujourd'hui</b><div class="cadre"><iframe id="a" src="../loginail-creer/personnaliser.html?bouge=tous"></iframe></div></div>
  <div class="tel"><b><i>✦</i> Seul le carré touché bouge</b><div class="cadre"><iframe id="b" src="../loginail-creer/personnaliser.html"></iframe></div></div>
</div>
<script>
/* les deux téléphones tiennent dans la largeur */
const ajuste = () => { const w = Math.min(1, (innerWidth - 50) / 2 / 393), h = Math.min(1, (innerHeight - 140) / 758), s = Math.min(w, h);
  document.querySelectorAll(".cadre").forEach(c => { c.style.transform = `scale(${s})`; c.style.marginBottom = `${-740 * (1 - s)}px`; c.parentElement.style.width = 375 * s + "px"; }); };
addEventListener("resize", ajuste); ajuste();
/* les deux s'ouvrent sur le même onglet */
let ong = "entete";
const ouvre = f => { let n = 0; const t = setInterval(() => { n++; try { const b = f.contentDocument.querySelector('#reglages [data-o="' + ong + '"]');
  if (b && b.getAttribute("aria-selected") === "true" && n > 8) return clearInterval(t); if (b && n > 6) b.click(); } catch (e) {} if (n > 60) clearInterval(t); }, 400); };
document.querySelectorAll("iframe").forEach(f => f.addEventListener("load", () => ouvre(f)));
document.querySelector(".boutons").onclick = e => { const b = e.target.closest("button"); if (!b) return; ong = b.dataset.o;
  document.querySelectorAll(".boutons button").forEach(x => x.classList.toggle("on", x === b)); document.querySelectorAll("iframe").forEach(f => { try { f.contentDocument.querySelector('#reglages [data-o="' + ong + '"]').click(); } catch (er) {} }); };
</script>
</body></html>
