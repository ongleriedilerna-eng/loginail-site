<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idée B · Votre espace est prêt</title>
<link href="../loginail-creer/polices.css" rel="stylesheet">
<style>
/* Idée B « Bienvenue » : une coche qui se dessine, puis 4 petites cartes qui arrivent une à une. */
:root{--fond:#F6F3EF;--noir:#1E1C1B;--muted:#6B625C;--surface:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fond);font-family:Jost,sans-serif;color:var(--noir);-webkit-font-smoothing:antialiased;overflow:hidden}
#tel{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 26px) 24px calc(env(safe-area-inset-bottom) + 22px)}
.logo{font:300 11px Jost;letter-spacing:.5em;text-align:center;color:var(--muted)}
.centre{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.coche{width:76px;height:76px;margin:0 auto 26px}
.coche circle{fill:none;stroke:var(--noir);stroke-width:1.4;stroke-dasharray:220;stroke-dashoffset:220;animation:trace .6s ease-out forwards}
.coche path{fill:none;stroke:var(--noir);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:trace .35s .5s ease-out forwards}
@keyframes trace{to{stroke-dashoffset:0}}
.petit{font:400 11px Jost;letter-spacing:.3em;color:var(--muted);animation:monte .5s .6s both}
h1{margin:8px 0 0;font:400 46px/1.05 Italiana,serif;animation:monte .5s .7s both}
.cartes{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.carte{background:var(--surface);border-radius:18px;padding:16px 16px 14px;box-shadow:0 1px 0 rgba(30,28,27,.04),0 10px 24px -18px rgba(30,28,27,.35);animation:monte .5s both}
.carte b{display:block;font:300 24px/1.1 Jost;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carte span{display:block;margin-top:4px;font:300 12px Jost;color:var(--muted)}
.carte:nth-child(1){animation-delay:.85s}.carte:nth-child(2){animation-delay:.95s}.carte:nth-child(3){animation-delay:1.05s}.carte:nth-child(4){animation-delay:1.15s}
.go{display:block;width:100%;border:0;border-radius:999px;padding:18px;background:var(--noir);color:var(--fond);font:500 13px Jost;letter-spacing:.2em;text-align:center;text-decoration:none;animation:monte .5s 1.3s both}
@keyframes monte{from{opacity:0;transform:translateY(12px)}}
</style>
</head>
<body>
<div id="tel">
  <div class="logo">LOGINAIL</div>
  <div class="centre">
    <svg class="coche" viewBox="0 0 76 76"><circle cx="38" cy="38" r="34"/><path d="M25 39l9 9 17-19"/></svg>
    <div class="petit">VOTRE ESPACE EST PRÊT</div>
    <h1 id="titre">Bienvenue, Marie</h1>
    <div class="cartes">
      <div class="carte"><b id="nom">Dilerna</b><span>votre salon</span></div>
      <div class="carte"><b id="presta">3</b><span>prestations avec prix</span></div>
      <div class="carte"><b id="jours">5 jours</b><span>d’ouverture</span></div>
      <div class="carte"><b>Votre site</b><span>à votre image</span></div>
    </div>
  </div>
  <a class="go">OUVRIR MON ESPACE</a>
</div>
<script>
let b = null; try { b = JSON.parse(localStorage.getItem("loginail-brouillon")); } catch (e) {}
const $ = id => document.getElementById(id);
if (b?.prenom) $("titre").textContent = `Bienvenue, ${b.prenom}`;
if (b?.nom) $("nom").textContent = b.nom;
if (b?.prestations?.length) $("presta").textContent = b.prestations.length;
const j = (b?.horaires || []).filter(Boolean).length; if (j) $("jours").textContent = `${j} jour${j > 1 ? "s" : ""}`;
</script>
</body>
</html>
