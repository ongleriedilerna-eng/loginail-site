<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bocaux · version</title>
<!-- Page d'essai Design (19/11 nuit, Marie : « sur une ligne, et plus bocal ») : LOGINAIL sur UNE ligne, chaque lettre est un vrai bocal.
     ?v=1 « Verre épais » : paroi épaisse, reflets, ombre au sol
     ?v=2 « Couvercles dorés » : + un couvercle doré vissé sur chaque lettre
     ?v=3 « Verre rosé » : verre teinté rose, couvercles roses, ombre au sol
     Toucher = secouer · secouer le téléphone = secouer · pencher = les charms glissent. Rien ne sort jamais des lettres. -->
<style>
  @font-face{font-family:Bagel;src:url(../loginail-site/polices/BagelFatOne-400-latin.woff2) format("woff2")}
  @font-face{font-family:Jost;font-weight:400;src:url(../loginail-site/polices/Jost-400-latin.woff2) format("woff2")}
  @font-face{font-family:Jost;font-weight:500;src:url(../loginail-site/polices/Jost-500-latin.woff2) format("woff2")}
  html,body{margin:0;min-height:100%;background:#F4E1EA;font-family:Jost,system-ui,sans-serif;color:#1E1C1B;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px 10px;box-sizing:border-box;overscroll-behavior:none}
  .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B03562;font-weight:500;margin-bottom:18px;text-align:center;line-height:1.6}
  canvas{display:block;touch-action:none;cursor:pointer}
  .aide{margin-top:18px;font-size:14px;color:#5b524d;text-align:center;min-height:20px}
  .aide b{color:#B03562;font-weight:500}
  .nom{position:fixed;left:0;right:0;top:10px;text-align:center;font-size:12px;color:#8a7f79}
  .bt{margin-top:12px;display:none;height:44px;padding:0 20px;border-radius:99px;border:0;background:#1E1C1B;color:#fff;font:500 14px Jost,sans-serif}
  .bt.on{display:inline-block}
</style>
</head>
<body>
  <div class="nom" id="nom"></div>
  <div class="k">Pensé par une prothésiste, pour les prothésistes</div>
  <canvas id="c" aria-label="Les lettres de Loginail en bocaux remplis de charms"></canvas>
  <div class="aide" id="aide">Touche les bocaux, puis <b>secoue ton téléphone</b> ✦</div>
  <button class="bt" id="bt" type="button">Activer le secouage</button>
<script>
(async function(){
  const V=+(new URLSearchParams(location.search).get('v')||2);
  const NOMV={1:'Version 1 · verre épais',2:'Version 2 · couvercles dorés',3:'Version 3 · verre rosé'};
  document.title='Bocaux · '+NOMV[V];document.getElementById('nom').textContent=NOMV[V];
  const NOMS=['cerisedisco','ceriseruban','cerisecoeur','cerisesrouges','cerisesor','ceriseslanternes','cerisesverre','noeudcerise','perle','bouledisco','boulefacettes','boule8','boule8or','boulecristallune',
    'coeurchrome','coeurajoure','coeurrubis','coeurperles','coeurroseclair','coeurcristal','coeurcousurose','coeurpixel','coeurleopard','coeurchoco','etoilecristal','etoilebleuciel','etoile4','etoilelumineuse',
    'etoilecerise','diamant','cristal','sucettecoeur','bonbon','bonbonvert','bagueastres','saturne','papilloncyber','arcenciel','arcencielperles','chatlune','fleurivoire','coquillagefrangipanier','baguettemagique'];
  const cv=document.getElementById('c'),ctx=cv.getContext('2d'),DPR=Math.min(2,window.devicePixelRatio||1);
  await document.fonts.load('100px Bagel');
  // ---- LOGINAIL sur UNE ligne, lettres séparées par un petit espace
  const T='LOGINAIL',W=Math.min(innerWidth-20,760),GAP=Math.max(3,W*.012);
  const mes=fs=>{ctx.font=fs+'px Bagel';return [...T].reduce((s,ch)=>s+ctx.measureText(ch).width,0)+GAP*(T.length-1)};
  let FS=260;while(mes(FS)>W-4&&FS>30)FS-=1;
  const SY=1.32;ctx.font=FS+'px Bagel';const asc=ctx.measureText('L').actualBoundingBoxAscent*SY;
  const COUV=V>=2?FS*.17:0,BASE=Math.round(COUV+asc+FS*.06),H=Math.round(BASE+FS*.24);
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  const lettres=[];{let x=(W-mes(FS))/2;for(const ch of T){const m=ctx.measureText(ch);lettres.push({ch,x,y:BASE,w:m.width,top:BASE-m.actualBoundingBoxAscent*SY});x+=m.width+GAP}}
  const calque=()=>{const c=document.createElement('canvas');c.width=W*DPR;c.height=H*DPR;const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.font=FS+'px Bagel';return [c,g]};
  const lettresEn=(g,how)=>lettres.forEach(l=>{g.save();g.translate(l.x,l.y);g.scale(1,SY);g.lineWidth=g.lineWidth/Math.sqrt(SY);g[how](l.ch,0,0);g.restore()});
  // ---- le masque : l'intérieur du verre (paroi épaisse) = là où les charms ont le droit d'être
  const PAROI=Math.max(4,FS*.075),PM=Math.max(2,FS*.034);
  const M=document.createElement('canvas');M.width=W;M.height=H;const m=M.getContext('2d');m.font=FS+'px Bagel';m.fillStyle='#000';lettresEn(m,'fillText');
  m.globalCompositeOperation='destination-out';m.lineWidth=PM*2;m.lineJoin='round';m.strokeStyle='#000';lettresEn(m,'strokeText');
  const A=m.getImageData(0,0,W,H).data;const dedans=(x,y)=>{x|=0;y|=0;return x>=0&&y>=0&&x<W&&y<H&&A[(y*W+x)*4+3]>128};
  const libre=(x,y,r)=>{if(!dedans(x,y))return false;for(let k=0;k<8;k++){const a=k*Math.PI/4;if(!dedans(x+Math.cos(a)*r,y+Math.sin(a)*r))return false}return true};
  // ---- calque du FOND (derrière les charms) : ombre au sol + verre teinté
  const [FOND,f]=calque();
  if(V!==2||true){f.save();lettres.forEach(l=>{const cx=l.x+l.w/2,gr=f.createRadialGradient(cx,BASE+FS*.08,1,cx,BASE+FS*.08,l.w*.62);gr.addColorStop(0,'rgba(120,40,70,.22)');gr.addColorStop(1,'rgba(120,40,70,0)');
    f.fillStyle=gr;f.beginPath();f.ellipse(cx,BASE+FS*.08,l.w*.62,FS*.07,0,0,Math.PI*2);f.fill()});f.restore()}
  const teinte=V===3?['rgba(255,214,230,.75)','rgba(244,170,200,.55)']:['rgba(255,255,255,.62)','rgba(255,240,246,.4)'];
  {const gr=f.createLinearGradient(0,BASE-asc,0,BASE);gr.addColorStop(0,teinte[0]);gr.addColorStop(1,teinte[1]);f.fillStyle=gr;lettresEn(f,'fillText');}
  // ---- calque du DESSUS (devant les charms) : paroi épaisse, reflets, fond du bocal, couvercles
  const [HAUT,h]=calque();
  // paroi : un verre épais = bord blanc large et semi-transparent, puis un fil plus net
  h.lineJoin='round';h.lineWidth=PAROI*1.6;h.strokeStyle=V===3?'rgba(255,236,244,.7)':'rgba(255,255,255,.62)';lettresEn(h,'strokeText');
  h.lineWidth=1.6;h.strokeStyle='rgba(255,255,255,.98)';lettresEn(h,'strokeText');
  h.lineWidth=1;h.strokeStyle=V===3?'rgba(176,53,98,.45)':'rgba(150,90,110,.35)';lettresEn(h,'strokeText');
  // reflets : une grande traînée claire à gauche de chaque lettre + un petit point brillant, gardés DANS la lettre
  {const [R,r]=calque();lettres.forEach(l=>{const top=l.top;r.save();r.translate(l.x+l.w*.24,top+FS*.18);r.rotate(-.12);
      const gr=r.createLinearGradient(-6,0,8,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');
      r.fillStyle=gr;r.beginPath();r.roundRect(-FS*.035,0,FS*.07,(BASE-top)*.55,FS*.035);r.fill();r.restore();
      r.fillStyle='rgba(255,255,255,.95)';r.beginPath();r.arc(l.x+l.w*.72,top+FS*.14,FS*.025,0,Math.PI*2);r.fill();
      // fond du bocal : une ombre douce en bas de la lettre
      const gb=r.createLinearGradient(0,BASE-FS*.16,0,BASE);gb.addColorStop(0,'rgba(120,40,70,0)');gb.addColorStop(1,'rgba(120,40,70,.18)');r.fillStyle=gb;r.fillRect(l.x,BASE-FS*.16,l.w,FS*.16)});
    r.setTransform(1,0,0,1,0,0);r.globalCompositeOperation='destination-in';r.drawImage(M,0,0,W*DPR,H*DPR);h.drawImage(R,0,0,W,H)}
  // couvercles vissés sur le haut de chaque lettre (versions 2 et 3)
  if(V>=2){lettres.forEach(l=>{const lw=Math.min(l.w*.62,FS*.5),x=l.x+(l.w-lw)/2,y=l.top-COUV*.62,hh=COUV*.78,gr=h.createLinearGradient(0,y,0,y+hh);
      if(V===2){gr.addColorStop(0,'#F6DFA4');gr.addColorStop(.45,'#D9A94F');gr.addColorStop(1,'#A9772C')}else{gr.addColorStop(0,'#F9C9DA');gr.addColorStop(.5,'#E58BAE');gr.addColorStop(1,'#B9577E')}
      h.fillStyle=gr;h.beginPath();h.roundRect(x,y,lw,hh,hh*.35);h.fill();
      h.strokeStyle='rgba(255,255,255,.45)';h.lineWidth=1;for(let k=1;k<6;k++){const xx=x+lw*k/6;h.beginPath();h.moveTo(xx,y+2);h.lineTo(xx,y+hh-2);h.stroke()} // les stries du couvercle
      h.fillStyle='rgba(255,255,255,.55)';h.beginPath();h.roundRect(x+3,y+2,lw-6,hh*.25,hh*.12);h.fill()})}
  // ---- les charms
  const imgs={};await Promise.all(NOMS.map(n=>new Promise(ok=>{const i=new Image();i.onload=i.onerror=ok;i.src='../loginail-site/charms-mini/'+n+'.webp';imgs[n]=i})));
  const R0=Math.max(3.8,FS*.058),B=[];let essais=0;
  while(B.length<120&&essais<90000){essais++;const x=Math.random()*W,y=Math.random()*H,r=R0*(.78+Math.random()*.5);
    if(!libre(x,y,r))continue;if(B.some(b=>Math.hypot(b.x-x,b.y-y)<(b.r+r)*.95))continue;
    B.push({x,y,r,vx:0,vy:0,a:Math.random()*6.28,va:0,im:imgs[NOMS[B.length%NOMS.length]]})}
  // ---- le mouvement (le même que la 1re version : rien ne sort jamais)
  let gx=0,gy=.3,secousse=0;
  function pas(){
    for(const b of B){b.vx+=gx;b.vy+=gy;if(secousse>0){b.vx+=(Math.random()-.5)*secousse;b.vy+=(Math.random()-.5)*secousse-secousse*.25}
      b.vx*=.985;b.vy*=.985;
      const nx=b.x+b.vx;if(libre(nx,b.y,b.r))b.x=nx;else{b.vx*=-.35;b.va+=b.vy*.02}
      const ny=b.y+b.vy;if(libre(b.x,ny,b.r))b.y=ny;else{b.vy*=-.35;b.vx*=.9;b.va=b.vx/b.r}
      b.a+=b.va;b.va*=.96}
    for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const p=B[i],q=B[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,mn=(p.r+q.r)*.92;
      if(d<mn){const k=(mn-d)/d/2,ux=dx*k,uy=dy*k;if(libre(p.x-ux,p.y-uy,p.r)){p.x-=ux;p.y-=uy}if(libre(q.x+ux,q.y+uy,q.r)){q.x+=ux;q.y+=uy}
        const rv=(q.vx-p.vx)*dx/d+(q.vy-p.vy)*dy/d;if(rv<0){const im=-rv*.5;p.vx-=im*dx/d;p.vy-=im*dy/d;q.vx+=im*dx/d;q.vy+=im*dy/d}}}
    secousse*=.85;if(secousse<.05)secousse=0;dessine();requestAnimationFrame(pas)}
  function dessine(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(FOND,0,0);ctx.setTransform(DPR,0,0,DPR,0,0);
    for(const b of B){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);const s=b.r*2.5;if(b.im.naturalWidth)ctx.drawImage(b.im,-s/2,-s/2,s,s);ctx.restore()}
    ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(HAUT,0,0)}
  // ---- toucher / secouer / pencher
  const aide=document.getElementById('aide'),bt=document.getElementById('bt');let capteurs=false;
  function ecoute(){if(capteurs)return;capteurs=true;
    addEventListener('devicemotion',e=>{const a=e.acceleration||{};const fo=Math.hypot(a.x||0,a.y||0,a.z||0);if(fo>9)secousse=Math.min(9,fo*.45)});
    addEventListener('deviceorientation',e=>{if(e.gamma==null)return;const gm=Math.max(-60,Math.min(60,e.gamma)),be=Math.max(-10,Math.min(80,e.beta||45));
      gx=Math.sin(gm*Math.PI/180)*.42;gy=Math.max(.08,Math.sin(be*Math.PI/180))*.42});aide.innerHTML='Secoue ou penche ton téléphone ✦'}
  async function demande(){try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission().catch(()=>{});
      if(r==='granted'){ecoute();bt.classList.remove('on')}else aide.innerHTML='Touche les bocaux pour les secouer ✦'}else ecoute()}catch(e){aide.innerHTML='Touche les bocaux pour les secouer ✦'}}
  cv.addEventListener('pointerdown',()=>{secousse=7;if(!capteurs)demande()});bt.addEventListener('click',demande);
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'&&/iPhone|iPad|iPod/.test(navigator.userAgent))bt.classList.add('on');
  window._bocal={B,libre,dedans,secoue:v=>{secousse=v},FS};
  pas();
})();
</script>
</body>
</html>
