<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Fonds qui bougent · série 3</title>
<style>
:root{--encre:#1E1C1B;--doux:#6E6762;--fond:#F7F3EF}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 6px;max-width:1240px;margin:auto}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--doux)}
main{padding:16px 16px 60px;max-width:1240px;margin:auto}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.carte{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start}
.carte span{display:block;font-size:13px;font-weight:600;margin-top:6px}
.carte small{display:block;font-size:12px;color:var(--doux)}
.carte:focus-visible .tuile{outline:3px solid #C2506E;outline-offset:2px}
.carte .gard{display:inline-block;background:#1E1C1B;color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}

.tuile{position:relative;overflow:hidden;aspect-ratio:170/220;border-radius:14px;container-type:size;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06)}
.tuile .img{position:absolute;inset:0;background-size:cover;background-position:center}
.tuile .pa{position:absolute;display:block;pointer-events:none;will-change:transform,opacity;background-size:contain;background-repeat:no-repeat;background-position:center}
.tuile .pa b{display:block;width:100%;height:100%;background:inherit}

/* monte : de bas en haut, en se balançant */
@keyframes monte{0%{transform:translate(0,0) rotate(-12deg);opacity:0}8%{opacity:1}30%{transform:translate(var(--dx),-38cqh) rotate(10deg)}60%{transform:translate(calc(var(--dx)*-1),-78cqh) rotate(-10deg)}92%{opacity:1}100%{transform:translate(0,-128cqh) rotate(8deg);opacity:0}}
/* tombe : de haut en bas, en tournant */
@keyframes tombe{0%{transform:translate(0,0) rotate(0);opacity:0}6%{opacity:1}35%{transform:translate(var(--dx),45cqh) rotate(var(--r1))}70%{transform:translate(calc(var(--dx)*-1),88cqh) rotate(var(--r2))}94%{opacity:1}100%{transform:translate(0,130cqh) rotate(var(--r3));opacity:0}}
/* vent : en biais, du haut gauche vers le bas droit */
@keyframes vent{0%{transform:translate(0,0) rotate(0);opacity:0}6%{opacity:1}50%{transform:translate(55cqw,45cqh) rotate(200deg)}94%{opacity:1}100%{transform:translate(120cqw,95cqh) rotate(400deg);opacity:0}}
/* vole : papillon qui traverse en ondulant */
@keyframes vole{0%{transform:translate(0,0) rotate(8deg)}25%{transform:translate(35cqw,-14cqh) rotate(-6deg)}50%{transform:translate(70cqw,4cqh) rotate(10deg)}75%{transform:translate(100cqw,-12cqh) rotate(-4deg)}100%{transform:translate(140cqw,0) rotate(8deg)}}
@keyframes ailes{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
/* méduse : monte par à-coups en pulsant */
@keyframes meduse{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),-140cqh)}}
@keyframes pulse{0%,100%{transform:scale(1,1)}40%{transform:scale(1.18,.8)}70%{transform:scale(.92,1.1)}}
/* boule disco : se balance et tourne ses reflets */
@keyframes balance{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes spot{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}80%{opacity:.9}100%{transform:translate(var(--dx),40cqh);opacity:0}}

.apercu{position:fixed;inset:0;z-index:9;display:none}
.apercu.ouvert{display:block}
.apercu .tuile{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;box-shadow:none}
.apercu .site{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));
  background:rgba(255,255,255,.88);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.apercu .site b{display:block;font-size:26px;letter-spacing:-.01em}
.apercu .site p{margin:6px 0 16px;color:var(--doux)}
.apercu .site a{display:inline-block;background:#1E1C1B;color:#fff;text-decoration:none;padding:12px 26px;border-radius:999px;font-weight:600}
.apercu .nom{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.apercu .nom span{background:rgba(255,255,255,.9);padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px}
.apercu .nom button{all:unset;cursor:pointer;background:#fff;width:40px;height:40px;border-radius:50%;text-align:center;line-height:40px;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.apercu .fleches{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:14px}
.apercu .fleches button{all:unset;cursor:pointer;background:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.tuile *{animation:none!important}}
.tuile .img{background-size:cover}
.seul header,.seul main{display:none}.seul .apercu .nom,.seul .apercu .fleches,.seul .apercu .site{display:none}
</style>
</head>
