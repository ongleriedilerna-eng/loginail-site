<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retouches téléphone · avant / après</title>
<style>
@font-face{font-family:'Abril Fatface';src:url(../loginail-site/polices/AbrilFatface-400-latin.woff2) format('woff2')}
:root{--rose:#B03562;--noir:#1E1C1B;--gris:#6d6663}
*{box-sizing:border-box}body{margin:0;background:#F6F1EE;font-family:Jost,system-ui,sans-serif;color:var(--noir)}
header{text-align:center;padding:18px 16px 4px}h1{font:400 30px/1.1 'Abril Fatface';margin:0}h1 em{font-style:normal;color:var(--rose)}
.onglets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.onglets button{font:500 14px Jost,sans-serif;border:1px solid #ddd;background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer}
.onglets button.on{background:var(--noir);color:#fff;border-color:var(--noir)}
.duo{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;padding:6px 16px 30px}
.col{text-align:center}.col b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin-bottom:8px}.col.apres b{color:var(--rose)}
.cadre{width:414px;height:min(820px,calc(100vh - 170px));border-radius:46px;background:#111;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
iframe{width:390px;height:100%;border:0;border-radius:36px;background:#fff;display:block}
@media (max-width:900px){.cadre{width:100%;max-width:414px}iframe{width:100%}}
</style></head><body>
<header><h1>Avant / <em>après</em></h1>
<div class="onglets">
 <button class="on" data-a="../index.html" data-b="accueil-retouches.html?v=A">Accueil</button>
 <button data-a="../loginail-creer/index.html" data-b="creer-1-tu.html">Page « Un lien suffit »</button>
</div></header>
<div class="duo">
 <div class="col"><b>Avant (en ligne)</b><div class="cadre"><iframe id="a" src="../index.html"></iframe></div></div>
 <div class="col apres"><b>Après (retouché)</b><div class="cadre"><iframe id="b" src="accueil-retouches.html?v=A"></iframe></div></div>
</div>
<script>
const A=document.getElementById('a'),B=document.getElementById('b');
/* les deux téléphones défilent ensemble */
let lock=false;function lie(x,y){x.addEventListener('load',()=>{try{x.contentWindow.addEventListener('scroll',()=>{if(lock)return;lock=true;const k=x.contentWindow.scrollY/(x.contentDocument.documentElement.scrollHeight-x.contentWindow.innerHeight||1);try{y.contentDocument.documentElement.style.scrollBehavior='auto';y.contentWindow.scrollTo(0,k*(y.contentDocument.documentElement.scrollHeight-y.contentWindow.innerHeight))}catch(e){}requestAnimationFrame(()=>lock=false)})}catch(e){}})}
lie(A,B);lie(B,A);
document.querySelectorAll('.onglets button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.onglets button').forEach(x=>x.classList.remove('on'));b.classList.add('on');A.src=b.dataset.a;B.src=b.dataset.b});
</script>
</body></html>
