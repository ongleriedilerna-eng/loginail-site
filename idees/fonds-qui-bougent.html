<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 nouveaux fonds qui bougent</title>
<style>
:root{--encre:#1E1C1B;--doux:#6E6762;--fond:#F7F3EF;--ligne:#E6DED6}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 6px;max-width:1240px;margin:auto}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--doux)}
h2{font-size:16px;margin:26px 0 10px;max-width:1240px}
main{padding:0 16px 60px;max-width:1240px;margin:auto}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.carte{all:unset;cursor:pointer;display:block}
.carte span{display:block;font-size:13px;font-weight:600;margin-top:6px}
.carte small{display:block;font-size:12px;color:var(--doux)}
.carte:focus-visible .tuile{outline:3px solid #C2506E;outline-offset:2px}
.carte:hover .tuile{transform:translateY(-2px)}

/* ===== La tuile (le fond) ===== */
.tuile{position:relative;overflow:hidden;aspect-ratio:170/220;border-radius:14px;container-type:size;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);transition:transform .2s}
.tuile .img{position:absolute;inset:0;background-size:cover;background-position:center}
.tuile .pa{position:absolute;display:block;pointer-events:none;will-change:transform,opacity}
.tuile .calque{position:absolute;pointer-events:none}

/* gestes de base */
@keyframes monte{0%{transform:translate(0,0) rotate(-8deg);opacity:0}12%{opacity:var(--o,.9)}50%{transform:translate(var(--dx,10px),-60cqh) rotate(8deg)}88%{opacity:var(--o,.9)}100%{transform:translate(0,-125cqh) rotate(-8deg);opacity:0}}
@keyframes tombe{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:var(--o,.95)}50%{transform:translate(var(--dx,-14px),62cqh) rotate(170deg)}92%{opacity:var(--o,.95)}100%{transform:translate(6px,125cqh) rotate(330deg);opacity:0}}
@keyframes scintille{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes reflet{0%,15%{transform:translateX(-120cqw) skewX(-18deg)}70%,100%{transform:translateX(140cqw) skewX(-18deg)}}
@keyframes derive{from{transform:translateX(0)}to{transform:translateX(-18%)}}
@keyframes respire{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.85;transform:scale(1.1)}}
@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes braise{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,8px),-70cqh) scale(.2);opacity:0}}
@keyframes filante{0%,80%{transform:rotate(-30deg) translateX(0);opacity:0}82%{opacity:1}92%,100%{transform:rotate(-30deg) translateX(-140cqw);opacity:0}}
@keyframes pluie{from{transform:translateY(-20cqh)}to{transform:translateY(130cqh)}}
@keyframes glisse-goutte{0%,40%{transform:translateY(0)}100%{transform:translateY(40cqh)}}
@keyframes flotte-blob{0%{transform:translate(0,0) scale(1)}33%{transform:translate(18cqw,-14cqh) scale(1.15)}66%{transform:translate(-12cqw,10cqh) scale(.9)}100%{transform:translate(0,0) scale(1)}}
@keyframes lave{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-58cqh) scale(.85,1.15)}}
@keyframes aurore{0%,100%{transform:translateX(-10%) skewX(-8deg) scaleY(1)}50%{transform:translateX(10%) skewX(8deg) scaleY(1.2)}}
@keyframes bulle-savon{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(var(--dx,12px),-60cqh)}90%{opacity:1}100%{transform:translate(0,-125cqh);opacity:0}}
@keyframes lumiere{0%,100%{opacity:.25}50%{opacity:.6}}

/* effets particuliers */
.ef-reflet .calque.band{top:-20%;bottom:-20%;left:0;width:45cqw;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55) 50%,transparent);mix-blend-mode:soft-light;animation:reflet 5.5s ease-in-out infinite}
.ef-reflet.fort .calque.band{background:linear-gradient(90deg,transparent,rgba(255,255,255,.75) 50%,transparent);mix-blend-mode:screen;opacity:.55}
.ef-irise .calque.ir{inset:-60%;background:conic-gradient(from 0deg,#ffb3d9,#b3e5ff,#c8ffd4,#fff0a8,#e0b3ff,#ffb3d9);
  mix-blend-mode:soft-light;opacity:.75;animation:tourne 14s linear infinite}
.ef-nuages .img{inset:0 -20% 0 0;animation:derive 38s ease-in-out infinite alternate}
.ef-glow .calque.halo{width:90cqw;height:90cqw;left:5cqw;top:20cqh;border-radius:50%;
  background:radial-gradient(circle,rgba(190,150,255,.55),transparent 65%);mix-blend-mode:screen;animation:respire 5s ease-in-out infinite}
.ef-rayons .calque.ray{inset:-10% -30%;background:repeating-linear-gradient(100deg,transparent 0 9cqw,rgba(200,235,255,.22) 9cqw 13cqw,transparent 13cqw 22cqw);
  mix-blend-mode:screen;animation:lumiere 4.5s ease-in-out infinite}

/* ===== Aperçu en grand ===== */
.apercu{position:fixed;inset:0;z-index:9;display:none;background:rgba(20,18,17,.55)}
.apercu.ouvert{display:block}
.apercu .tuile{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;box-shadow:none}
.apercu .site{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));
  background:rgba(255,255,255,.88);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.apercu .site b{display:block;font-size:26px;letter-spacing:-.01em}
.apercu .site p{margin:6px 0 16px;color:var(--doux)}
.apercu .site a{display:inline-block;background:#1E1C1B;color:#fff;text-decoration:none;padding:12px 26px;border-radius:999px;font-weight:600}
.apercu .nom{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.apercu .nom span{background:rgba(255,255,255,.9);padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px}
.apercu .nom button{all:unset;cursor:pointer;background:#fff;width:40px;height:40px;border-radius:50%;text-align:center;line-height:40px;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.apercu .fleches{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:14px}
.apercu .fleches button{all:unset;cursor:pointer;background:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}

@media (prefers-reduced-motion:reduce){.tuile *{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>20 nouveaux fonds qui bougent</h1>
  <p>Touche un fond pour le voir en grand, derrière un faux site.</p>
</header>
<main>
  <h2>À partir de tes images (14)</h2>
  <div class="grille" id="g-marie"></div>
  <h2>Nouveaux effets (6)</h2>
  <div class="grille" id="g-neufs"></div>
</main>

<div class="apercu" id="apercu" role="dialog" aria-modal="true" aria-label="Aperçu du fond">
  <div id="ap-tuile"></div>
  <div class="site"><b>Les Ongles de Léa</b><p>Prothésiste ongulaire · Lyon 6e</p><a href="#" onclick="return false">Réserver</a></div>
  <div class="nom"><span id="ap-nom"></span><button id="ap-x" aria-label="Fermer">×</button></div>
  <div class="fleches"><button id="ap-prec">← Avant</button><button id="ap-suiv">Après →</button></div>
</div>

<script>
var IMG="../loginail-site/fonds-img/";
function svg(s,vb){return "url(\"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+(vb||"0 0 20 20")+'">'+s+'</svg>')+"\")"}
var F={
  eclat:function(c){return svg('<path d="M10 0Q11 9 20 10Q11 11 10 20Q9 11 0 10Q9 9 10 0Z" fill="'+c+'"/>')},
  petale:svg('<path d="M10 1C15 5 17 12 10 19C3 12 5 5 10 1Z" fill="#F7C6D3"/><path d="M10 4L10 15" stroke="#EBA3B7" stroke-width=".8"/>'),
  coeur:function(c,o){return svg('<path d="M10 18C3 12 0 9 0 5.5A5 5 0 0 1 10 4A5 5 0 0 1 20 5.5C20 9 17 12 10 18Z" fill="'+c+'" fill-opacity="'+(o||1)+'"/><path d="M4 5Q5 3 7 3" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/>')},
  levres:svg('<path d="M1 10C4 5 8 5 10 7C12 5 16 5 19 10C15 15 5 15 1 10Z" fill="#C8243A"/><path d="M2 10C7 11 13 11 18 10" stroke="#8E1426" stroke-width="1"/>'),
  note:svg('<path d="M7 15.5A3 2.4 0 1 1 7 15.4V3L17 1V13.5A3 2.4 0 1 1 17 13.4V5L9 6.6V15.5Z" fill="#1E1C1B"/>',"0 0 20 20"),
  bulle:svg('<circle cx="10" cy="10" r="9" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.75)" stroke-width="1"/><circle cx="7" cy="6.5" r="2" fill="#fff" opacity=".85"/>'),
  braise:function(c){return "radial-gradient(circle,"+c+" 0 30%,transparent 70%)"}
};
// hasard toujours pareil (la même page à chaque fois)
function hasard(g){return function(){g=(g*9301+49297)%233280;return g/233280}}
function particules(t,n,o){var r=hasard(o.graine||7);for(var i=0;i<n;i++){var e=document.createElement("i");e.className="pa";var s=o.taille[0]+r()*(o.taille[1]-o.taille[0]);
  e.style.cssText="width:"+s+"px;height:"+(s*(o.ratio||1))+"px;left:"+(r()*96)+"%;"+(o.haut!=null?"top:"+o.haut+"%;":"top:"+(r()*92)+"%;")+
  "background:"+(typeof o.image=="function"?o.image(r):o.image)+";background-size:contain;background-repeat:no-repeat;"+
  "animation:"+o.geste+" "+(o.duree[0]+r()*(o.duree[1]-o.duree[0])).toFixed(1)+"s "+(o.courbe||"linear")+" -"+(r()*14).toFixed(1)+"s infinite;"+
  "--dx:"+((r()-.5)*30).toFixed(0)+"px;"+(o.style||"");t.appendChild(e)}}
function calque(t,cls){var c=document.createElement("div");c.className="calque "+cls;t.appendChild(c);return c}

var MARIE=[
 {n:"Méduses qui brillent",d:"lumière qui respire + bulles",img:"meduses",fx:function(t){t.classList.add("ef-glow");calque(t,"halo");particules(t,9,{graine:3,image:F.bulle,taille:[6,14],geste:"monte",duree:[7,12],haut:100,style:"--o:.8"})}},
 {n:"Chrome liquide",d:"un reflet qui passe",img:"chrome-liquide",fx:function(t){t.classList.add("ef-reflet","fort");calque(t,"band")}},
 {n:"Nacre irisée",d:"les couleurs tournent",img:"nacre-irisee",fx:function(t){t.classList.add("ef-irise");calque(t,"ir")}},
 {n:"Étoiles holo",d:"éclats qui scintillent",img:"etoiles-holo",fx:function(t){particules(t,14,{graine:11,image:function(r){return F.eclat(["#fff","#FFD6F5","#C9F2FF","#FFF3B0"][Math.floor(r()*4)])},taille:[8,16],geste:"scintille",duree:[2.2,4],courbe:"ease-in-out"})}},
 {n:"Flammes roses",d:"des braises qui montent",img:"flammes-roses",fx:function(t){particules(t,16,{graine:5,image:F.braise("#FF4FA3"),taille:[4,9],geste:"braise",duree:[3,6],haut:95,style:"filter:drop-shadow(0 0 4px #FF4FA3)"})}},
 {n:"Nuages qui avancent",d:"le ciel glisse doucement",img:"nuages-lilas",fx:function(t){t.classList.add("ef-nuages");particules(t,6,{graine:2,image:F.eclat("#FFF1B8"),taille:[6,10],geste:"scintille",duree:[3,5],courbe:"ease-in-out"})}},
 {n:"Nuit et lunes",d:"étoiles + étoile filante",img:"lunes-nuit",fx:function(t){particules(t,10,{graine:9,image:F.eclat("#FFF6D8"),taille:[6,11],geste:"scintille",duree:[2.5,4.5],courbe:"ease-in-out"});
   var f=document.createElement("i");f.className="pa";f.style.cssText="left:85%;top:12%;width:80px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,#FFF6D8,transparent);transform-origin:left center;animation:filante 7s ease-out infinite";t.appendChild(f)}},
 {n:"Cœurs de verre",d:"des cœurs qui s'envolent",img:"coeurs-verre",fx:function(t){particules(t,8,{graine:4,image:function(r){return F.coeur(r()>.5?"#FF8FC0":"#FFFFFF",.75)},taille:[12,22],geste:"monte",duree:[8,13],haut:100,style:"filter:drop-shadow(0 2px 3px rgba(255,80,150,.25))"})}},
 {n:"Satin bordeaux",d:"la lumière glisse sur le tissu",img:"satin-bordeaux",fx:function(t){t.classList.add("ef-reflet");calque(t,"band")}},
 {n:"Fuji en fleurs",d:"pétales de cerisier qui tombent",img:"fuji-sakura",fx:function(t){particules(t,12,{graine:8,image:F.petale,taille:[7,12],geste:"tombe",duree:[8,13],haut:-6})}},
 {n:"Bisous qui s'envolent",d:"des bisous qui montent",img:"bisous",fx:function(t){particules(t,7,{graine:6,image:F.levres,taille:[16,24],ratio:.75,geste:"monte",duree:[9,14],haut:100,style:"--o:.85"})}},
 {n:"Notes qui flottent",d:"musique qui monte",img:"notes-musique",fx:function(t){particules(t,7,{graine:12,image:F.note,taille:[12,18],geste:"monte",duree:[9,13],haut:100,style:"--o:.7"})}},
 {n:"Récif",d:"bulles + rayons de soleil",img:"recif",fx:function(t){t.classList.add("ef-rayons");calque(t,"ray");particules(t,10,{graine:13,image:F.bulle,taille:[5,12],geste:"monte",duree:[6,10],haut:100})}},
 {n:"Diamants qui brillent",d:"chaque diamant scintille",img:"diamants-violet",fx:function(t){particules(t,12,{graine:15,image:F.eclat("#FFFFFF"),taille:[8,14],geste:"scintille",duree:[2,3.6],courbe:"ease-in-out",style:"filter:drop-shadow(0 0 3px #E4C8FF)"})}}
];
function blob(t,c,x,y,s,dur,del,geste,blur){var b=document.createElement("i");b.className="pa";b.style.cssText="left:"+x+"%;top:"+y+"%;width:"+s+"cqw;height:"+s+"cqw;border-radius:50%;background:"+c+";filter:blur("+(blur||14)+"px);animation:"+(geste||"flotte-blob")+" "+dur+"s ease-in-out -"+del+"s infinite";t.appendChild(b)}
var NEUFS=[
 {n:"Pluie sur la vitre",d:"gouttes et pluie fine",fond:"linear-gradient(180deg,#B9A7B4,#8F8496 60%,#6F6778)",fx:function(t){
   particules(t,22,{graine:21,image:"linear-gradient(transparent,rgba(255,255,255,.6))",taille:[1,1.6],ratio:16,geste:"pluie",duree:[.9,1.6],haut:0,style:"--o:1"});
   particules(t,9,{graine:22,image:"radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 45%,rgba(255,255,255,.35) 70%,transparent 72%)",taille:[6,12],ratio:1.2,geste:"glisse-goutte",duree:[6,11],courbe:"ease-in"})}},
 {n:"Holographique",d:"les couleurs changent",fond:"#E8E4F3",fx:function(t){var c=calque(t,"");c.style.cssText="inset:-60%;background:conic-gradient(from 0deg,#FFC4E6,#C4E8FF,#D4FFE0,#FFF4C4,#E2C9FF,#FFC4E6);filter:blur(18px);animation:tourne 12s linear infinite";
   var c2=calque(t,"band");t.classList.add("ef-reflet");}},
 {n:"Lampe à bulles",d:"la cire monte et redescend",fond:"linear-gradient(180deg,#FFD9C2,#FF9E9E 55%,#F2708E)",fx:function(t){
   function cire(c1,c2,x,y,s,dur,del){var b=document.createElement("i");b.className="pa";b.style.cssText="left:"+x+"%;top:"+y+"%;width:"+s+"cqw;height:"+(s*1.25)+"cqw;border-radius:46% 54% 50% 50%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 30%,"+c1+","+c2+" 70%);box-shadow:inset -4px -6px 12px rgba(120,0,40,.25),0 0 18px "+c1+";filter:blur(.6px);animation:lave "+dur+"s ease-in-out -"+del+"s infinite";t.appendChild(b)}
   cire("#FF8FB0","#E8336B",12,78,30,13,0);cire("#FFA07A","#F05A3C",58,84,24,16,7);cire("#FFD08A","#FF8A3D",36,92,16,10,3);cire("#FF7FA6","#D92A60",70,96,14,12,10);cire("#FFB38A","#F06A4A",20,98,11,9,5);
   var v=calque(t,"");v.style.cssText="inset:0;background:linear-gradient(90deg,rgba(255,255,255,.28),transparent 18%,transparent 82%,rgba(255,255,255,.18))"}},
 {n:"Bulles de savon",d:"irisées, elles montent",fond:"linear-gradient(180deg,#DDEEF6,#F3E4F1)",fx:function(t){
   particules(t,9,{graine:31,image:"radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 9%),radial-gradient(circle,rgba(255,255,255,.12) 0 55%,rgba(255,150,210,.75) 63%,rgba(140,210,255,.8) 69%,rgba(190,255,190,.65) 74%,rgba(255,255,255,.9) 77%,transparent 79%)",taille:[18,42],geste:"bulle-savon",duree:[9,15],haut:100})}},
 {n:"Aurore boréale",d:"rideaux de lumière la nuit",fond:"linear-gradient(180deg,#0F1430,#1A1440 60%,#2A1A44)",fx:function(t){
   [["rgba(80,255,190,.55)",-10,10,9],["rgba(170,110,255,.5)",10,22,12],["rgba(255,120,200,.35)",0,34,15]].forEach(function(a,i){var c=calque(t,"");c.style.cssText="left:-20%;right:-20%;top:"+a[2]+"%;height:38%;background:linear-gradient(180deg,transparent,"+a[0]+",transparent);filter:blur(10px);border-radius:50%;animation:aurore "+a[3]+"s ease-in-out -"+(i*3)+"s infinite"});
   particules(t,10,{graine:41,image:F.eclat("#FFFFFF"),taille:[4,7],geste:"scintille",duree:[2.5,4.5],courbe:"ease-in-out"})}},
 {n:"Gel qui ondule",d:"douceur pastel qui bouge",fond:"#F6EAF0",fx:function(t){
   blob(t,"#FFC2D6",-10,-5,75,16,0);blob(t,"#C9D8FF",40,30,70,19,5);blob(t,"#FFE6B8",0,60,65,22,9);blob(t,"#E2CCFF",50,70,55,17,3)}}
];
function fabrique(f){var t=document.createElement("div");t.className="tuile";var im=document.createElement("div");im.className="img";
  im.style.background=f.img?"url("+IMG+f.img+".webp) center/cover":f.fond;t.appendChild(im);f.fx(t);return t}
var TOUS=MARIE.concat(NEUFS);
function grille(id,liste){var g=document.getElementById(id);liste.forEach(function(f){var b=document.createElement("button");b.className="carte";
  b.appendChild(fabrique(f));b.insertAdjacentHTML("beforeend","<span>"+f.n+"</span><small>"+f.d+"</small>");b.onclick=function(){ouvre(TOUS.indexOf(f))};g.appendChild(b)})}
grille("g-marie",MARIE);grille("g-neufs",NEUFS);
var ap=document.getElementById("apercu"),cur=0;
function ouvre(i){cur=(i+TOUS.length)%TOUS.length;var z=document.getElementById("ap-tuile");z.innerHTML="";z.appendChild(fabrique(TOUS[cur]));
  document.getElementById("ap-nom").textContent=(cur+1)+" / "+TOUS.length+" · "+TOUS[cur].n;ap.classList.add("ouvert")}
document.getElementById("ap-x").onclick=function(){ap.classList.remove("ouvert");document.getElementById("ap-tuile").innerHTML=""};
document.getElementById("ap-prec").onclick=function(){ouvre(cur-1)};document.getElementById("ap-suiv").onclick=function(){ouvre(cur+1)};
addEventListener("keydown",function(e){if(!ap.classList.contains("ouvert"))return;if(e.key=="Escape")document.getElementById("ap-x").click();if(e.key=="ArrowRight")ouvre(cur+1);if(e.key=="ArrowLeft")ouvre(cur-1)});
</script>
</body>
</html>
