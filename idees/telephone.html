<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>loginail.fr sur téléphone</title>
<!-- Maquette Design (19/11) : l'accueil loginail.fr tel que les prothésistes le voient sur leur téléphone
     (iPhone 390 × 844, Safari : barre d'état en haut, barre d'adresse en bas → le site a 390 × 719 px).
     ?p=chemin pour une autre page (ex. ?p=../loginail-creer/index.html). Seulement la version TÉLÉPHONE. -->
<style>
  html,body{margin:0;height:100%;background:#EFE6DF;font-family:Jost,system-ui,sans-serif;color:#1E1C1B;overflow:hidden}
  .scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .boite{position:relative}
  .tel{position:absolute;left:0;top:0;width:416px;height:870px;border-radius:62px;background:#141414;padding:13px;box-sizing:border-box;
       transform-origin:0 0;box-shadow:0 0 0 2px #2c2c2c inset,0 40px 80px -30px rgba(70,25,40,.45)}
  .tel::before{content:"";position:absolute;left:-3px;top:190px;width:3px;height:64px;border-radius:2px 0 0 2px;background:#262626;box-shadow:0 84px 0 #262626}
  .tel::after{content:"";position:absolute;right:-3px;top:230px;width:3px;height:96px;border-radius:0 2px 2px 0;background:#262626}
  .ecran{width:390px;height:844px;border-radius:49px;overflow:hidden;background:#F7F0EA;display:flex;flex-direction:column}
  .etat{height:47px;flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 38px;font:600 16px -apple-system,system-ui,sans-serif;background:#F7F0EA}
  .ile{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000}
  .icones{display:flex;gap:6px;align-items:center}
  .ecran iframe{flex:1;width:390px;border:0;display:block;background:#fff}
  .safari{height:78px;flex:none;background:rgba(246,244,242,.96);border-top:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;padding-top:9px;box-sizing:border-box}
  .adresse{width:358px;height:44px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px;font:500 16px -apple-system,system-ui,sans-serif;color:#1E1C1B}
  .barre{width:134px;height:5px;border-radius:3px;background:#111;margin-top:13px}
  .legende{font-size:14px;color:#5F5751;text-align:center}
  .legende b{color:#1E1C1B;font-weight:500}
</style>
</head>
<body>
<div class="scene">
  <div class="boite" id="boite">
    <div class="tel" id="tel"><div class="ecran">
      <div class="etat"><span>9:41</span><div class="ile"></div>
        <span class="icones">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A6.9 6.9 0 0 0 8 3.9a6.9 6.9 0 0 0-4.7 1.9l1.1 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c-.6 0-1.1.2-1.5.6L8 11.1l1.5-1.6c-.4-.4-.9-.6-1.5-.6Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
        </span></div>
      <iframe id="f" title="loginail.fr sur téléphone"></iframe>
      <div class="safari"><div class="adresse"><svg width="11" height="14" viewBox="0 0 11 14"><path d="M2 6V4.5a3.5 3.5 0 0 1 7 0V6h.5c.8 0 1.5.7 1.5 1.5v5c0 .8-.7 1.5-1.5 1.5h-8C.7 14 0 13.3 0 12.5v-5C0 6.7.7 6 1.5 6H2Zm1.5 0h4V4.5a2 2 0 0 0-4 0V6Z" fill="#555"/></svg>loginail.fr</div><div class="barre"></div></div>
    </div></div>
  </div>
  <div class="legende"><b>loginail.fr</b> sur un iPhone (Safari) · fais défiler dans le téléphone</div>
</div>
<script src="haut-tel.js"></script>
<script src="appli-tel.js"></script>
<script>
  const p =new URLSearchParams(location.search).get('p') || '../index.html';
  const f = document.getElementById('f');
  f.src = p;
  // sur iPhone la barre de défilement ne prend pas de place : on la cache pour que le site ait ses vrais 390 px
  f.addEventListener('load', () => { try {
    const s = f.contentDocument.createElement('style');
    s.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0}';
    f.contentDocument.head.appendChild(s);
    // ?v=A / ?v=B : une version de maquette (idees/haut-tel.js)
    const v = new URLSearchParams(location.search).get('v'), V = window.HAUT_TEL && window.HAUT_TEL[v];
    if (V) {
      const s2 = f.contentDocument.createElement('style'); s2.textContent = V.css; f.contentDocument.head.appendChild(s2);
      setTimeout(() => V.js && V.js(f.contentDocument, f.contentWindow), 400);
      document.querySelector('.legende').innerHTML = '<b>Version ' + V.nom + '</b> · fais défiler dans le téléphone';
      document.title = 'Téléphone · ' + V.nom;
    }
    f.contentWindow.dispatchEvent(new Event('resize'));
  } catch (e) { console.error(e) } });
  // le téléphone garde sa vraie taille (390 px de site) et se réduit seulement pour tenir dans la fenêtre
  function ajuste(){
    const k = Math.min(1, (innerHeight - 70) / 870, (innerWidth - 32) / 416);
    document.getElementById('tel').style.transform = 'scale(' + k + ')';
    const b = document.getElementById('boite'); b.style.width = 416 * k + 'px'; b.style.height = 870 * k + 'px';
  }
  ajuste(); addEventListener('resize', ajuste);
</script>
</body>
</html>
