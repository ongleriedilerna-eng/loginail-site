<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personnaliser · version A « L'atelier »</title>
<link href="../polices.css" rel="stylesheet">
<script src="../charms-cat.js?v=1"></script>
<script src="charms-noms.js?v=1711"></script>
<script src="looks-marie.js?v=1711b"></script>
<style>
/* 16/11 · Pôle Design · Personnaliser, version A « L'atelier ».
   Les 5 choses à régler sont TOUJOURS visibles (En-tête · Fond · Écriture · Couleurs · Charms) : on va où on veut,
   et le bouton noir dit ce qui vient ensuite (« Ensuite : le fond → »). Son VRAI site au-dessus (téléphone) ou à gauche (ordinateur).
   Écritures : son NOM écrit dans chaque écriture. Couleurs : 16 d'abord, le reste derrière « Plus de couleurs ». */
:root{--fond:#F6F3EF;--noir:#1E1C1B;--muted:#5F5751;--doux:#8A817A;--ligne:rgba(30,28,27,.12);--rose:#B5475E;--rosé:#F7E9EA;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--ressort:cubic-bezier(.2,.9,.25,1);--pop:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--fond);color:var(--noir);font-family:Jost,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--noir);outline-offset:2px}
.app{position:relative;height:100dvh;display:flex;flex-direction:column;isolation:isolate}
/* son fond en transparence derrière tout */
#ambiance{position:absolute;inset:0;z-index:-1;opacity:.2;overflow:hidden;pointer-events:none;transition:opacity .4s}
#ambiance .tuile{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important}
#ambiance:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,243,239,0) 40%,var(--fond) 78%)}

/* ---------- haut ---------- */
.haut{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 14px 4px;height:calc(var(--sat) + 52px)}
.rond{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 4px 14px -8px rgba(0,0,0,.35);transition:transform .15s}
.rond:active{transform:scale(.94)}
.rond svg{width:18px;height:18px}
.logo{width:92px}
.logo svg{display:block;width:100%;height:auto}
.etapes{display:none}

/* ---------- son site ---------- */
.scene{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 0 10px}
.tel{position:relative;border-radius:34px;background:#1E1C1B;padding:5px;box-shadow:0 26px 50px -28px rgba(0,0,0,.55);transition:transform .35s var(--ressort)}
.tel>.ecr{position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:#fff}
#site{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:0 0;background:#fff}
.grand{position:absolute;right:calc(50% - var(--tw)/2 - 52px);bottom:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font:400 11px Jost,sans-serif;color:var(--muted)}
.attente{position:absolute;inset:0;display:grid;place-items:center;font:400 13px Jost,sans-serif;color:var(--doux);background:#fff;transition:opacity .4s}
.attente.part{opacity:0;pointer-events:none}

/* ---------- les 5 onglets ---------- */
.reglages{flex:none;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -10px 30px -22px rgba(0,0,0,.35);padding:6px 0 calc(var(--sab) + 12px)}
.onglets{display:flex;justify-content:space-between;padding:6px 14px 0;border-bottom:1px solid var(--ligne)}
.onglets button{position:relative;flex:1;height:42px;font:400 14px Jost,sans-serif;color:var(--muted);white-space:nowrap;transition:color .2s}
.onglets button[aria-selected=true]{color:var(--noir);font-weight:500}
.onglets button:after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;border-radius:2px;background:var(--noir);transform:scaleX(0);transition:transform .3s var(--ressort)}
.onglets button[aria-selected=true]:after{transform:none}
.onglets button i{display:none}
.titreP{display:none}
.aide{margin:10px 18px 0;font:400 13px/1.35 Jost,sans-serif;color:var(--muted);min-height:18px}
.choix{height:172px;position:relative}
.panneau{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;opacity:0;visibility:hidden;transform:translateX(16px);transition:opacity .25s,transform .35s var(--ressort),visibility 0s .35s}
.panneau.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s .05s,transform .35s var(--ressort)}
.ligne{display:flex;gap:10px;overflow-x:auto;padding:5px 18px 6px;scroll-padding:0 18px;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain}
.ligne::-webkit-scrollbar{display:none}
.ligne>*{flex:none;scroll-snap-align:start}
.puces{display:flex;gap:6px;overflow-x:auto;padding:0 18px;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--ligne);background:#fff;font:400 13px Jost,sans-serif;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.puce.on{background:var(--noir);border-color:var(--noir);color:#fff}
.puce.assort{border-color:rgba(181,71,94,.35);color:var(--rose)}
.puce.assort b{font-weight:400}

/* en-têtes : son site en tout petit */
.ent{display:flex;flex-direction:column;align-items:center;gap:5px;font:400 12px Jost,sans-serif;color:var(--muted)}
.ent .mi{width:76px;height:118px;border-radius:12px;overflow:hidden;background:#EEE9E3;box-shadow:inset 0 0 0 1px var(--ligne);transition:box-shadow .2s,transform .2s}
.ent.on{color:var(--noir);font-weight:500}
.ent.on .mi{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--noir)}
.ent:active .mi{transform:scale(.96)}
/* fonds */
.vg{width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;background:#EEE9E3;box-shadow:inset 0 0 0 1px var(--ligne);transition:transform .15s}
.vg .f100,.vg .tuile{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important}
.vg.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--noir)}
.vg:active{transform:scale(.95)}
.vg.sans{display:grid;place-items:center;background:#fff;font:400 11px/1.2 Jost,sans-serif;color:var(--muted);text-align:center}
/* écritures : SON nom */
.grille2{display:grid;grid-template-rows:repeat(2,58px);grid-auto-flow:column;grid-auto-columns:max-content;gap:8px;overflow-x:auto;padding:4px 18px 6px;scrollbar-width:none}
.grille2::-webkit-scrollbar{display:none}
.ecr-c{min-width:120px;max-width:230px;height:58px;padding:0 16px;border-radius:14px;background:var(--fond);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;transition:background .2s,box-shadow .2s}
.ecr-c span{font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--noir)}
.ecr-c small{font:400 10.5px Jost,sans-serif;color:var(--doux)}
.ecr-c.on{background:#fff;box-shadow:0 0 0 2px var(--noir)}
/* couleurs */
.rangC{display:flex;align-items:center;gap:10px;padding:0 18px}
.rangC>b{flex:none;width:74px;font:400 12.5px Jost,sans-serif;color:var(--muted)}
.rangC .ligne{padding:4px 2px 6px;flex:1;min-width:0}
.dot{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .15s}
.dot.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--noir)}
.dot:active{transform:scale(.9)}
.dot.plus{display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--ligne);font:300 20px/1 Jost,sans-serif;color:var(--muted)}
.basC{display:flex;gap:8px;padding:2px 18px 0}
/* charms */
.ch{position:relative;width:62px;height:62px;border-radius:14px;background:var(--fond);display:grid;place-items:center;transition:transform .15s,background .2s}
.ch img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.ch:active{transform:scale(.93)}
.ch.on{background:var(--rosé)}
.ch.on:after{content:"✓";position:absolute;top:3px;right:5px;font:500 11px Jost,sans-serif;color:var(--rose)}

/* ---------- le bouton ---------- */
.pied{display:flex;align-items:center;gap:10px;padding:8px 18px 0}
.noir{flex:1;height:54px;border-radius:999px;background:var(--noir);color:#fff;font:500 13px Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px -14px rgba(0,0,0,.6);transition:transform .15s,background .2s}
.noir:active{transform:scale(.98)}
.noir .fl{font-size:17px;letter-spacing:0;transition:transform .3s var(--ressort)}
.noir:hover .fl{transform:translateX(4px)}
.noir.fin{background:var(--rose)}
.retourT{display:none}

/* ---------- voir en grand ---------- */
.app.agrandi .reglages{transform:translateY(105%)}
.reglages{transition:transform .4s var(--ressort)}
#revenir{position:absolute;left:50%;bottom:calc(var(--sab) + 18px);transform:translate(-50%,40px);opacity:0;pointer-events:none;height:46px;padding:0 20px;border-radius:999px;background:var(--noir);color:#fff;font:500 12px Jost,sans-serif;letter-spacing:.14em;transition:.35s var(--ressort);z-index:5}
.app.agrandi #revenir{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.bulle{position:absolute;left:50%;top:calc(var(--sat) + 60px);transform:translate(-50%,-8px);opacity:0;background:var(--noir);color:#fff;font:400 13px Jost,sans-serif;padding:9px 16px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:.3s var(--ressort);z-index:9}
.bulle.on{opacity:1;transform:translate(-50%,0)}
.maquette{position:fixed;right:10px;bottom:calc(var(--sab) + 4px);font:500 9px Jost,sans-serif;letter-spacing:.14em;color:var(--doux);opacity:.6;z-index:20;pointer-events:none}

/* =================== ORDINATEUR : toute la page =================== */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(520px,46%);grid-template-rows:auto minmax(0,1fr)}
  .haut{grid-column:1/-1;height:auto;padding:26px 48px 0}
  .haut #retour{display:none}
  .logo{width:128px}
  .etapes{display:flex;gap:26px;list-style:none;margin:0;padding:0}
  .etapes li{display:flex;align-items:center;gap:9px;font:400 14px Jost,sans-serif;color:var(--muted)}
  .etapes li i{width:26px;height:26px;border-radius:50%;border:1px solid var(--doux);display:grid;place-items:center;font:400 12px Jost,sans-serif;font-style:normal}
  .etapes li.ok i{background:var(--noir);border-color:var(--noir);color:#fff;font-size:11px}
  .etapes li.on{color:var(--noir);font-weight:500}
  .etapes li.on i{background:var(--noir);border-color:var(--noir);color:#fff}
  #oeilH{display:none}
  .scene{padding:18px 0 34px}
  #ambiance{opacity:.24}
  #ambiance:after{background:linear-gradient(90deg,rgba(246,243,239,0) 30%,var(--fond) 62%)}
  .grand{display:flex}
  .reglages{background:transparent;box-shadow:none;border-radius:0;padding:18px 48px 40px 8px;display:flex;flex-direction:column;min-height:0}
  .onglets{justify-content:flex-start;gap:6px;padding:0;border:0}
  .onglets button{flex:none;height:40px;padding:0 18px;border-radius:999px;font-size:15px;background:transparent}
  .onglets button:hover{color:var(--noir)}
  .onglets button[aria-selected=true]{background:#fff;box-shadow:0 6px 16px -10px rgba(0,0,0,.3)}
  .onglets button:after{display:none}
  .onglets button i{top:8px;right:9px}
  .titreP{display:block;margin:26px 0 0;font:500 40px/1.05 "Cormorant Garamond",serif;letter-spacing:-.01em}
  .titreP em{font-style:italic}
  .aide{margin:8px 0 0;font-size:15px}
  .choix{flex:1;min-height:0;height:auto;margin-top:18px}
  .panneau{justify-content:flex-start;gap:14px;overflow-y:auto;scrollbar-width:thin;padding-bottom:10px}
  .ligne,.puces,.grille2,.rangC,.basC{padding-left:0;padding-right:0}
  .panneau>.ligne{flex-wrap:wrap;overflow:visible}
  .ent .mi{width:112px;height:176px}
  .ent{font-size:13px}
  .vg{width:76px;height:76px}
  .grille2{grid-template-rows:none;grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));overflow:visible}
  .ecr-c{max-width:none;height:64px}
  .ecr-c span{font-size:24px}
  .ecr-c:hover:not(.on){background:#EFE9E2}
  .rangC{flex-direction:column;align-items:flex-start;gap:6px}
  .rangC>b{width:auto;font-size:14px;color:var(--noir);font-weight:500}
  .rangC .ligne{flex-wrap:wrap;overflow:visible;padding:4px}
  .dot{width:36px;height:36px}
  .ch{width:76px;height:76px}.ch img{width:58px;height:58px}
  .ch:hover{background:#EFE9E2}
  .pied{padding:16px 0 0;justify-content:flex-end}
  .retourT{display:block;margin-right:auto;font:400 14px Jost,sans-serif;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
  .noir{flex:none;width:auto;min-width:300px;padding:0 30px;height:58px}
  .noir:hover{background:#000}
  .bulle{top:120px;left:calc((100% - var(--colR, 50%)) / 2)}
  .maquette{bottom:8px}
}
@media (min-width:900px) and (max-height:760px){
  .titreP{font-size:32px;margin-top:16px}.choix{margin-top:12px}.ent .mi{width:96px;height:150px}.scene{padding-bottom:20px}
}
@media (max-width:899px) and (max-height:700px){
  .choix{height:150px}.ent .mi{width:64px;height:98px}.grille2{grid-template-rows:repeat(2,52px)}.ecr-c{height:52px}.ecr-c span{font-size:19px}
  .aide{margin-top:8px;font-size:12.5px}.noir{height:50px}
}

/* 17/11 · où va la photo : ?photo=entete (rangée dans l'onglet En-tête) ou ?photo=onglet (6e onglet « Photo », en premier) */
.sousT{display:flex;align-items:center;gap:10px;padding:0 18px}
.sousT>b{flex:none;width:52px;font:400 12.5px Jost,sans-serif;color:var(--muted)}
.sousT .ligne{padding:4px 2px 6px;flex:1;min-width:0}
.ph{position:relative;width:48px;height:48px;border-radius:12px;overflow:hidden;background:#EEE9E3 center/cover;box-shadow:inset 0 0 0 1px var(--ligne);transition:transform .15s}
.ph.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--noir)}
.ph:active{transform:scale(.94)}
.ph.ajout{display:grid;place-items:center;background:#fff;font:300 22px/1 Jost,sans-serif;color:var(--muted);cursor:pointer}
.ph.ajout small{display:none}
body.m-entete .choix{height:190px}
body.m-entete .panneau[data-p=entete]{gap:4px}
body.m-entete .ent .mi{width:64px;height:100px}
.grandP .ph{width:92px;height:122px;border-radius:14px}
.grandP .ph.ajout{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:26px}
.grandP .ph.ajout small{display:block;font:400 12px/1.2 Jost,sans-serif;text-align:center}
body.m-onglet .onglets button{font-size:13.5px}
@media (min-width:900px){
  .sousT{flex-direction:column;align-items:flex-start;gap:6px;padding:0}
  .sousT>b{width:auto;font-size:14px;color:var(--noir);font-weight:500}
  .sousT .ligne{flex-wrap:wrap;overflow:visible;padding:4px}
  .ph{width:72px;height:72px}
  body.m-entete .choix{height:auto}
  body.m-entete .ent .mi{width:104px;height:164px}
  .grandP .ph{width:150px;height:200px}
  body.m-onglet .onglets button{font-size:15px}
}
@media (max-width:899px) and (max-height:700px){body.m-entete .choix{height:170px}body.m-entete .ent .mi{width:56px;height:84px}.ph{width:44px;height:44px}.grandP .ph{width:80px;height:106px}}

/* 17/11 : croix pour retirer une photo (Marie a préféré garder les photos qui passent à la ligne) */
.phBox{position:relative;flex:1;min-width:0}
.phBox .ligne{padding-top:9px}
.phw{position:relative;flex:none;transition:opacity .25s,transform .25s}
.phw.part{opacity:0;transform:scale(.6)}
.sup{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--noir);font:500 10px/22px Jost,sans-serif;text-align:center;box-shadow:0 2px 8px -2px rgba(0,0,0,.35),0 0 0 1px var(--ligne);z-index:2}
.sup:after{content:"";position:absolute;inset:-10px}
.flecheP{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 4px 12px -4px rgba(0,0,0,.35);font:300 22px/1 Jost,sans-serif;padding-bottom:3px;z-index:3;display:none}
.annuleP{position:absolute;left:50%;top:calc(var(--sat) + 62px);transform:translate(-50%,12px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;background:var(--noir);color:#fff;font:400 14px Jost,sans-serif;padding:8px 8px 8px 18px;border-radius:999px;white-space:nowrap;transition:.3s var(--ressort);z-index:9}
.annuleP.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.annuleP button{height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font:500 13px Jost,sans-serif}
@media (hover:hover){.sup{opacity:0;transition:opacity .2s}.phw:hover .sup,.sup:focus-visible{opacity:1}}
@media (min-width:900px){.annuleP{left:auto;top:auto;right:48px;transform:translateY(12px);bottom:120px}.annuleP.on{transform:none}.sousT>.phBox{width:100%}}
/* 17/11 soir · point 1 « plus épuré » : plus AUCUN trait gris. ?epure=1 « Le point » · ?epure=2 « La capsule » */
body.ep1 .onglets,body.ep2 .onglets{border-bottom:0}
body.ep1 .onglets button:after{left:50%;right:auto;width:5px;height:5px;margin-left:-2.5px;bottom:2px;border-radius:50%;transform:scale(0)}
body.ep1 .onglets button[aria-selected=true]:after{transform:scale(1)}
body.ep2 .onglets{margin:4px 14px 0;padding:4px;background:var(--fond);border-radius:999px}
body.ep2 .onglets button{height:36px;border-radius:999px;transition:color .2s,background .25s,box-shadow .25s}
body.ep2 .onglets button[aria-selected=true]{background:#fff;box-shadow:0 4px 12px -8px rgba(0,0,0,.35)}
body.ep2 .onglets button:after{display:none}
.encoreF{display:none}
@media (min-width:900px){
  body.ep1 .panneau,body.ep2 .panneau{scrollbar-width:none}
  body.ep1 .panneau::-webkit-scrollbar,body.ep2 .panneau::-webkit-scrollbar{display:none}
  body.ep2 .onglets{margin:0;align-self:flex-start;padding:4px;background:rgba(255,255,255,.55)}
  /* 1 : un fondu doux en bas, seulement quand il y a encore des choix plus bas */
  body.ep1 .choix:after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;pointer-events:none;background:linear-gradient(180deg,rgba(246,243,239,0),var(--fond) 90%);opacity:0;transition:opacity .3s}
  body.ep1 .choix.encore:after{opacity:1}
  /* 2 : un petit rond blanc « ↓ » qui descend tout seul, puis s'en va */
  body.ep2 .encoreF{display:grid;place-items:center;position:absolute;left:50%;bottom:6px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#fff;box-shadow:0 8px 20px -10px rgba(0,0,0,.45);font:300 20px/1 Jost,sans-serif;color:var(--noir);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .3s var(--ressort);z-index:4;animation:respire 2.4s ease-in-out infinite}
  body.ep2 .choix.encore .encoreF{opacity:1;transform:none;pointer-events:auto}
  body.ep2 .encoreF:hover{background:var(--noir);color:#fff}
}
/* 17/11 · téléphone « grand carré de choix » : l'aperçu rétrécit, les choix passent en grille avec de grosses vignettes */
@media (max-width:899px){
  body.grandC .choix,body.grandC.m-entete .choix{height:clamp(250px,42dvh,400px)}
  body.grandC .panneau{justify-content:flex-start;overflow-y:auto;scrollbar-width:none;padding:2px 0 26px;gap:12px}
  body.grandC .panneau::-webkit-scrollbar{display:none}
  body.grandC .panneau>.ligne,body.grandC .sousT .ligne,body.grandC .rangC .ligne{flex-wrap:wrap;overflow:visible;row-gap:12px}
  body.grandC .sousT,body.grandC .rangC{flex-direction:column;align-items:stretch;gap:4px}
  body.grandC .sousT>b,body.grandC .rangC>b{width:auto;font-size:13px;color:var(--noir);font-weight:500}
  body.grandC .sousT .ligne,body.grandC .rangC .ligne{padding:4px 2px 2px}
  body.grandC .phBox .ligne{padding-top:9px}

<script>
const $ = id => document.getElementById(id), P = Pilote;
const ORDRE = ["entete", "fond", "ecriture", "couleurs", "charms"];
const TXT = {
  entete: ["Votre <em>en-tête</em>", "Le haut de votre site, la 1re chose que vos clientes voient."],
  fond: ["Votre <em>fond</em>", "Plus de 500 fonds. Vos couleurs s’accordent toutes seules."],
  ecriture: ["Votre <em>écriture</em>", "Votre nom, dans 39 écritures. Touchez celle qui vous ressemble."],
  couleurs: ["Vos <em>couleurs</em>", "La couleur de votre site, de votre nom et de vos boutons."],
  charms: ["Vos <em>charms</em>", "Touchez un charm : il se pose sur votre site. Glissez-le, agrandissez-le, penchez-le."] };
const SUITE = { entete: "Ensuite : le fond", fond: "Ensuite : l’écriture", ecriture: "Ensuite : les couleurs", couleurs: "Ensuite : les charms", charms: "C’est parfait ✦" };
let onglet = "entete", catFond = "Tous", catCharm = "Populaires", toutesCouleurs = false;
const vus = new Set(["entete"]);
const bulle = t => { const b = $("bulle"); b.textContent = t; b.classList.add("on"); clearTimeout(bulle.t); bulle.t = setTimeout(() => b.classList.remove("on"), 2200); };

/* ---------- taille du téléphone ---------- */
function taille() { const s = $("scene"), T = $("tel"), cs = getComputedStyle(s), dispo = s.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), h = Math.max(200, innerWidth >= 900 ? Math.min(dispo - 6, (Math.min(s.clientWidth * .55, s.clientWidth - 150) - 10) * 844 / 390 + 10) : s.clientHeight - 14), k = (h - 10) / 844, w = 390 * k + 10;
  T.style.width = w + "px"; T.style.height = h + "px"; $("site").style.transform = `scale(${k})`; s.style.setProperty("--tw", w + "px"); }
addEventListener("resize", taille);

/* ---------- les onglets ---------- */
function ouvre(o) { onglet = o; vus.add(o);
  document.querySelectorAll("#onglets button").forEach(b => { b.setAttribute("aria-selected", b.dataset.o === o); b.classList.toggle("vu", vus.has(b.dataset.o) && b.dataset.o !== o); });
  document.querySelectorAll(".panneau").forEach(p => p.classList.toggle("on", p.dataset.p === o));
  $("titreP").innerHTML = TXT[o][0]; $("aide").textContent = TXT[o][1];
  $("suivantT").textContent = SUITE[o]; $("suivant").classList.toggle("fin", o === "charms");
  $("etapes").querySelector("[data-s='3']").className = o === "charms" ? "ok" : "on"; $("etapes").querySelector("[data-s='3'] i").textContent = o === "charms" ? "✓" : "3";
  $("etapes").querySelector("[data-s='4']").className = o === "charms" ? "on" : "";
  rend(o); P.enHaut(); }
$("onglets").onclick = e => { const b = e.target.closest("button"); if (b) ouvre(b.dataset.o); };
$("suivant").onclick = () => { const i = ORDRE.indexOf(onglet); if (i < ORDRE.length - 1) ouvre(ORDRE[i + 1]); else bulle("Ensuite : mettre votre site en ligne (page suivante)"); };
$("retour").onclick = $("retourT").onclick = () => bulle("Retour au choix du style (Chic / Fun)");
$("oeilH").onclick = () => { $("app").classList.add("agrandi"); setTimeout(taille, 420); };
$("revenir").onclick = () => { $("app").classList.remove("agrandi"); setTimeout(taille, 50); };

/* ---------- ce qu'on montre dans chaque onglet ---------- */
function rend(o) {
  if (!P.pret) return;
  if (o === "entete") { const l = $("lEnt"); if (!l.children.length) l.innerHTML = P.ENT.map(([k, n]) => `<button class="ent" data-k="${k}"><span class="mi"></span>${n}</button>`).join("");
    const larg = l.querySelector(".mi").clientWidth || 76; l.querySelectorAll(".ent").forEach(b => { b.classList.toggle("on", b.dataset.k === P.etat.entete); P.miniEntete(b.querySelector(".mi"), b.dataset.k, larg); }); }
  if (o === "fond") { const cats = ["Tous", ...P.categories()]; $("catF").innerHTML = cats.map(c => `<button class="puce${c === catFond ? " on" : ""}" data-c="${c}">${c}</button>`).join("");
    const F = P.fonds(); $("lFond").innerHTML = `<button class="vg sans${P.etat.fond ? "" : " on"}" data-f="">Sans<br>fond</button>` + F.map((x, i) => (catFond === "Tous" ? !(x[3] || []).includes("Phrases") : (x[3] || []).includes(catFond)) ? `<button class="vg${x[0] === P.etat.fond ? " on" : ""}" data-f="${x[0].replace(/"/g, "&quot;")}" title="${x[0].replace(/"/g, "&quot;")}">${P.vignetteFond(i)}</button>` : "").join(""); }
  if (o === "ecriture") { P.policesCss(); const l = $("lPol"); if (!l.children.length) l.innerHTML = P.polices().map(([k, n]) => `<button class="ecr-c" data-k="${k}"><span style="font-family:${P.famille(k).replace(/"/g, "'")}">${P.nomSalon()}</span><small>${n}</small></button>`).join("");
    l.querySelectorAll(".ecr-c").forEach(b => b.classList.toggle("on", b.dataset.k === P.etat.police)); }
  if (o === "couleurs") { const cs = P.couleurs(), vs = P.vifs();
    const c = toutesCouleurs ? cs : cs.filter(x => P.COUL_VUES.includes(x[0])).sort((a, b) => P.COUL_VUES.indexOf(a[0]) - P.COUL_VUES.indexOf(b[0]));
    $("lCoul").innerHTML = c.map(([k, bg]) => `<button class="dot${k === P.etat.couleur ? " on" : ""}" data-co="${k}" style="background:${bg}" aria-label="${P.NOMS[k] || k}" title="${P.NOMS[k] || k}"></button>`).join("") + (toutesCouleurs ? "" : `<button class="dot plus" id="plusC" aria-label="Plus de couleurs" title="Plus de couleurs">+</button>`);
    const v = vs.filter(x => P.VIFS_VUS.includes(x[0])).sort((a, b) => P.VIFS_VUS.indexOf(a[0]) - P.VIFS_VUS.indexOf(b[0]));
    $("lVif").innerHTML = v.map(([k, bg]) => `<button class="dot${k === P.etat.vif ? " on" : ""}" data-vif="${k}" style="background:${bg}" aria-label="${P.NOMS[k] || k}" title="${P.NOMS[k] || k}"></button>`).join("");
    $("lNom").innerHTML = Object.entries(P.NOMC).map(([k, bg]) => `<button class="dot${k === P.etat.nomc ? " on" : ""}" data-nc="${k}" style="background:${bg}" aria-label="${k}" title="${k}"></button>`).join("");
    $("blocsC").querySelectorAll("[data-bl]").forEach(b => b.classList.toggle("on", b.dataset.bl === P.etat.blocs));
    $("assortir").hidden = !P.etat.fond; }
  if (o === "charms") { const fams = [...(FAV.length ? ["Favoris"] : []), "Populaires", ...P.familles().filter(f => f !== "Populaires")];
    if (catCharm === "Favoris" && !FAV.length) catCharm = "Populaires";
    /* 17/11 (Marie) : la barre des catégories, chacune avec son petit charm (comme l'ancienne page) */
    $("catC").innerHTML = fams.map(f => { const ic = f === "Favoris" ? `<i class="cfav">♥</i>` : `<img src="${P.imgCharm(P.charmsDe(f)[0] || "cerisedisco")}" alt="" loading="lazy">`;
      return `<button class="catI${f === catCharm ? " on" : ""}" data-c="${f}">${ic}<span>${f}</span></button>`; }).join("");
    const poses = P.poses(), q = sansAcc($("chercheC").value);
    const liste = q ? P.charmsTous().filter(n => n.includes(q.replace(/[^a-z0-9]/g, "")) || sansAcc(P.nomCharm(n)).includes(q)) : catCharm === "Favoris" ? FAV.filter(n => P.charmsTous().includes(n)) : P.charmsDe(catCharm);
    $("catBox").style.display = q ? "none" : "";
    $("lCh").innerHTML = liste.length ? liste.slice(0, 120).map(n => `<button class="ch${poses.includes(n) ? " on" : ""}${FAV.includes(n) ? " fav" : ""}" data-n="${n}" aria-label="${P.nomCharm(n)}" title="${P.nomCharm(n)}"><img src="${P.imgCharm(n)}" alt="" loading="lazy"></button>`).join("") : `<p class="rienC">Aucun charm « ${$("chercheC").value} ». Essayez « cœur », « fleur », « étoile »…</p>`;
    majCompte(); }
}
const marque = (l, sel, v, attr) => l.querySelectorAll(sel).forEach(b => b.classList.toggle("on", b.dataset[attr] === v));
$("lEnt").onclick = e => { const b = e.target.closest(".ent"); if (!b) return; P.entete(b.dataset.k); marque($("lEnt"), ".ent", b.dataset.k, "k"); };
$("catF").onclick = e => { const b = e.target.closest(".puce"); if (!b) return; catFond = b.dataset.c; rend("fond"); $("lFond").scrollLeft = 0; };
$("lFond").onclick = e => { const b = e.target.closest(".vg"); if (!b) return; P.fond(b.dataset.f); marque($("lFond"), ".vg", b.dataset.f, "f"); if (b.dataset.f) setTimeout(() => P.assortir(), 250); setTimeout(ambiance, 300); };
$("lPol").onclick = e => { const b = e.target.closest(".ecr-c"); if (!b) return; P.police(b.dataset.k); marque($("lPol"), ".ecr-c", b.dataset.k, "k"); };
$("lCoul").onclick = e => { const b = e.target.closest(".dot"); if (!b) return; if (b.id === "plusC") { toutesCouleurs = true; rend("couleurs"); return; } P.couleur(b.dataset.co); marque($("lCoul"), ".dot", b.dataset.co, "co"); };
$("lNom").onclick = e => { const b = e.target.closest(".dot"); if (!b) return; P.nomc(b.dataset.nc); marque($("lNom"), ".dot", b.dataset.nc, "nc"); };
$("blocsC").onclick = e => { const b = e.target.closest("[data-bl]"); if (!b) return; memo(); P.blocs(b.dataset.bl); marque($("blocsC"), "[data-bl]", b.dataset.bl, "bl"); };
$("assortirF").onclick = () => { if (!P.etat.fond) return bulle("Choisissez d’abord un fond"); memo(); if (P.assortir()) bulle("Couleurs assorties à votre fond ✦"); };
$("lVif").onclick = e => { const b = e.target.closest(".dot"); if (!b) return; P.vif(b.dataset.vif); marque($("lVif"), ".dot", b.dataset.vif, "vif"); };
$("assortir").onclick = () => { if (P.assortir()) { rend("couleurs"); bulle("Couleurs assorties à votre fond ✦"); } };
$("catC").onclick = e => { const b = e.target.closest(".catI,.puce"); if (!b) return; catCharm = b.dataset.c; rend("charms"); $("lCh").scrollLeft = 0; };
const sansAcc = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
function majCompte() { const n = P.pret ? P.poses().length : 0, e = P.pret ? P.nbEtoiles() : 0; $("compteC").textContent = n + " / " + P.MAX + " charms"; $("compteC").classList.toggle("plein", n >= P.MAX); $("etoX").hidden = true; majEtoN(); }
$("chercheC").oninput = () => { rend("charms"); $("lCh").scrollTop = 0; };
/* 17/11 (Marie) : les étoiles en 3 pastilles (Sans · Un peu · Beaucoup) : on voit ce qui est choisi, recliquer ne rajoute rien */
const majEtoN = () => { const n = P.pret ? P.nbEtoiles() / 3 : 0, k = n === 0 ? "0" : n <= 1 ? "1" : "3"; $("etoN").querySelectorAll("[data-n]").forEach(b => b.classList.toggle("on", b.dataset.n === k)); };
$("etoN").onclick = e => { const b = e.target.closest("[data-n]"); if (!b) return; const n = +b.dataset.n; if (P.nbEtoiles() / 3 === n) return; memo();
  while (P.nbEtoiles()) P.enleveEtoiles(); for (let i = 0; i < n; i++) P.etoiles(); majEtoN(); if (n) bulle("Glissez les étoiles où vous voulez ✦"); };
P.change(q => { if (q === "charms") { majCompte(); if (onglet === "charms") $("lCh").querySelectorAll(".ch").forEach(b => b.classList.toggle("on", P.poses().includes(b.dataset.n))); } });
/* 17/11 (Marie) : appui long sur un charm = favori (♥), une catégorie « Favoris » apparaît en premier */
const FAV = (() => { try { return JSON.parse(localStorage.getItem("charmsFavoris") || "[]"); } catch (e) { return []; } })();
let longC = false;
$("lCh").addEventListener("pointerdown", e => { const b = e.target.closest(".ch"); if (!b) return; longC = false; clearTimeout(b._tf);
  b._tf = setTimeout(() => { longC = true; const n = b.dataset.n, i = FAV.indexOf(n); if (i < 0) FAV.unshift(n); else FAV.splice(i, 1);
    try { localStorage.setItem("charmsFavoris", JSON.stringify(FAV)); } catch (x) {} b.classList.toggle("fav", i < 0); navigator.vibrate?.(15);
    bulle(i < 0 ? "♥ Ajouté à vos favoris" : "Retiré de vos favoris"); const sc = $("catC").scrollLeft; rendCatsSeules(); $("catC").scrollLeft = sc; }, 480); });
["pointerup", "pointerleave", "pointercancel"].forEach(ty => $("lCh").addEventListener(ty, e => { const b = e.target.closest?.(".ch"); if (b) clearTimeout(b._tf); }));
$("lCh").addEventListener("contextmenu", e => { if (e.target.closest(".ch")) e.preventDefault(); });
$("lCh").addEventListener("click", e => { if (longC) { e.stopImmediatePropagation(); e.preventDefault(); longC = false; } }, true);
function rendCatsSeules() { rend("charms"); }
/* 17/11 (Marie) : « Voir comme ma cliente » */
let cliente = false;
$("vueCliente").onclick = () => { cliente = !cliente; P.modeCliente(cliente); document.body.classList.toggle("enCliente", cliente);
  $("vueCliente").querySelector("span").textContent = cliente ? "Revenir à mes réglages" : "Voir comme ma cliente";
  if (innerWidth < 900) { $("app").classList.toggle("agrandi", cliente); $("revenir").textContent = "REVENIR AUX RÉGLAGES"; setTimeout(taille, 420); }
  if (cliente) bulle("Voici votre site comme vos clientes le verront ✦"); };
$("revenir").addEventListener("click", () => { if (cliente) { cliente = false; P.modeCliente(false); document.body.classList.remove("enCliente"); $("vueCliente").querySelector("span").textContent = "Voir comme ma cliente"; } });
$("lCh").onclick = e => { const b = e.target.closest(".ch"); if (!b) return; const r = P.charm(b.dataset.n); b.classList.toggle("on", r === true);
  if (r === true && P.poses().length === 1) bulle(matchMedia("(hover:hover)").matches ? "Cliquez dessus : tirez ⤡ pour l’agrandir et le pencher" : "Deux doigts pour l’agrandir et le pencher ✦");
  if (r === false && !b.classList.contains("on") && P.poses().length >= P.MAX) bulle(P.MAX + " charms maximum : enlevez-en un d’abord"); majCompte(); };

/* son fond en transparence derrière */
function ambiance() { try { const t = P.D.querySelector(".ecran .tuile"), a = $("ambiance"); if (!P.etat.fond || !t) { a.innerHTML = ""; return; } a.innerHTML = t.outerHTML.replace(/url\((['"]?)\.\.\/loginail-site\//g, "url($1../loginail-site/"); } catch (e) {} }
P.change(q => { if (q === "entete") setTimeout(() => rend("entete"), 400); if (q === "fond" || q === "police" || q === "couleur") { clearTimeout(window.__tm); window.__tm = setTimeout(() => { const l = $("lEnt"); l.dataset.sale = 1; }, 300); } });
/* les mini en-têtes se refont (avec son écriture et son fond) quand on revient dessus */
const ouvre0 = ouvre;

/* 17/11 · où va la photo (choix de Marie à faire) */
/* 17/11 soir (Marie) : la photo a SON onglet, plus mélangée aux en-têtes (?photo=entete = ancienne façon, ?photo=ensemble pour la garder) */
const MODE = ({ entete: "onglet", ensemble: "entete" })[new URLSearchParams(location.search).get("photo")] || "onglet";
if (MODE) document.body.classList.add("m-" + MODE);
const phHtml = (grand) => `<label class="ph ajout" title="Ajouter ma photo"><input type="file" accept="image/*" hidden class="fichierP">+<small>Ajouter<br>ma photo</small></label>` + P.photos().slice(0, 5).map(u => `<span class="phw"><button class="ph${u === P.photoUne() ? " on" : ""}" data-u="${u}" style="background-image:url('${u}')" aria-label="Choisir cette photo"></button>${P.photos().length > 1 ? `<button class="sup" data-u="${u}" aria-label="Retirer cette photo" title="Retirer cette photo">✕</button>` : ""}</span>`).join("");

const pile = []; let dernier = 0;
const etatMaintenant = () => ({ ...P.etat, ch: P.poses(), ph: P.photoUne() });

  if (s.ph && s.ph !== P.photoUne()) P.choisitPhoto(s.ph);
  if (s.entete !== m.entete) { P.entete(s.entete); await pause(160); }
  if (s.fond !== m.fond) { P.fond(s.fond); await pause(200); }
  if (s.police !== m.police) P.police(s.police);
  P.etat.vif = s.vif; P.couleur(s.couleur, true); P.vif(s.vif);
  if (s.nomc && s.nomc !== m.nomc) P.nomc(s.nomc); if (s.blocs && s.blocs !== m.blocs) P.blocs(s.blocs);
  const now = P.poses(); now.filter(n => !s.ch.includes(n)).forEach(n => P.charm(n)); s.ch.filter(n => !now.includes(n)).forEach(n => P.charm(n));

  l.innerHTML = P.polices().map(([k, n]) => `<button class="ecr-c${k === P.etat.police ? " on" : ""}" data-k="${k}"${bloc ? ` style="background:${bloc}"` : ""}>${fond ? `<span class="fd">${fond}</span>` : ""}<span style="font-family:${P.famille(k).replace(/"/g, "'")};${encre()}">${P.nomSalon()}</span><small>${n}</small><i class="ok">✓</i></button>`).join("");
  if (fond && !(P.etat.fond in fondFonce)) mesureFond(P.etat.fond).then(() => { if (onglet === "ecriture") rend("ecriture"); });
  requestAnimationFrame(() => ajusteNoms(l)); [300, 900, 2000].forEach(ms => setTimeout(() => ajusteNoms(l), ms)); try { document.fonts.ready.then(() => ajusteNoms(l)); } catch (e) {} };

/* catégories : version 1 (une ligne qui glisse) ou 2 (un bouton qui s'ouvre) */
const CATV = new URLSearchParams(location.search).get("cat") || "1"; document.body.classList.add("cat" + CATV);
function majFlechesCat() { const c = $("catC"); $("catG").classList.toggle("cache", c.scrollLeft < 6); $("catD").classList.toggle("cache", c.scrollLeft > c.scrollWidth - c.clientWidth - 6); }
$("catC").addEventListener("scroll", majFlechesCat); addEventListener("resize", majFlechesCat);
$("catG").onclick = () => $("catC").scrollBy({ left: -$("catC").clientWidth * .7 }); $("catD").onclick = () => $("catC").scrollBy({ left: $("catC").clientWidth * .7 });
function majMenuCat() { const b = $("catC").querySelector(".catI.on"); $("catMenuT").innerHTML = b ? b.innerHTML : catCharm; $("catPop").innerHTML = $("catC").innerHTML; setTimeout(majFlechesCat, 30);
  const on = $("catC").querySelector(".catI.on"); if (on && CATV === "1") { const c = $("catC"); if (on.offsetLeft < c.scrollLeft || on.offsetLeft + on.offsetWidth > c.scrollLeft + c.clientWidth) c.scrollLeft = on.offsetLeft - 30; } }
$("catMenu").onclick = () => { const p = $("catPop"); p.hidden = !p.hidden; $("catMenu").classList.toggle("ouvert", !p.hidden); };
$("catPop").onclick = e => { const b = e.target.closest(".catI"); if (!b) return; catCharm = b.dataset.c; $("catPop").hidden = true; $("catMenu").classList.remove("ouvert"); rend("charms"); };
P.change(() => {}); const rendAvantCat = rend; rend = o => { rendAvantCat(o); if (o === "charms" && P.pret) majMenuCat(); };

/* 17/11 tard (Marie) : la poignée à tirer entre le téléphone et les réglages (ordinateur) */
(() => { const g = $("poignee"), app = $("app"); let x0 = null, w0 = 0, raf = 0;
  const mini = 480, maxi = () => innerWidth - 420;   /* 17/11 (Marie : « ça touche le téléphone ») : toujours de l'air autour */
  const pose = w => { w = Math.round(Math.min(maxi(), Math.max(mini, w))); app.style.setProperty("--colR", w + "px"); cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { taille(); majEncore(); }); return w; };
  try { const v = +localStorage.getItem("lgnColR"); if (v) pose(v); } catch (e) {}
  g.addEventListener("pointerdown", e => { e.preventDefault(); g.setPointerCapture(e.pointerId); x0 = e.clientX; w0 = $("reglages").getBoundingClientRect().width; g.classList.add("tire"); document.body.classList.add("tirage"); });
  g.addEventListener("pointermove", e => { if (x0 == null) return; pose(w0 + (x0 - e.clientX)); });
  const fin = () => { if (x0 == null) return; x0 = null; g.classList.remove("tire"); document.body.classList.remove("tirage");
    try { localStorage.setItem("lgnColR", Math.round($("reglages").getBoundingClientRect().width)); } catch (e) {} if (onglet === "entete" || onglet === "ecriture") setTimeout(() => rend(onglet), 60); };
  g.addEventListener("pointerup", fin); g.addEventListener("pointercancel", fin);
  g.addEventListener("dblclick", () => { app.style.removeProperty("--colR"); try { localStorage.removeItem("lgnColR"); } catch (e) {} setTimeout(taille, 30); });
  g.addEventListener("keydown", e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); pose($("reglages").getBoundingClientRect().width + (e.key === "ArrowLeft" ? 40 : -40)); } });
})();

P.branche($("site")).then(() => { { const f0 = new URLSearchParams(location.search).get("fond"); if (f0) { P.fond(f0); setTimeout(() => P.assortir(), 250); } } setTimeout(() => { $("attente").classList.add("part"); rendPhotos(); ouvre(ORDRE.includes(new URLSearchParams(location.search).get("onglet")) ? new URLSearchParams(location.search).get("onglet") : ORDRE[0]); setTimeout(() => { if (onglet === "entete") rend("entete"); }, 1400); }, 700); });
