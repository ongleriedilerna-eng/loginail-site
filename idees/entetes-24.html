<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>24 en-têtes nouvelles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,600;1,900&family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,500&family=Monoton&display=swap" rel="stylesheet">
<style>
:root{--rose:#B5475E;--brun:#2A1B1E;--creme:#FFF8F6}
*{box-sizing:border-box;margin:0}
body{background:#FBF1EF;font-family:Jost,sans-serif;color:var(--brun);padding:28px 16px 60px}
header.p{max-width:1240px;margin:0 auto 10px;text-align:center}
.t{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:40px}
header.p p{color:#7a5f64;margin-top:6px;font-size:15px}
h2.fam{max-width:1240px;margin:40px auto 16px;font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:30px;border-bottom:1px solid #ecd6d3;padding-bottom:6px}
h2.fam small{font-family:Jost;font-style:normal;font-size:14px;color:#8d7277;margin-left:10px}
.grille{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:26px 14px;justify-items:center}
.case{text-align:center;cursor:pointer;transition:opacity .25s;position:relative}
.case.non{opacity:.3}
.case.non::after{content:"Pas gardée";position:absolute;top:14px;left:50%;translate:-50% 0;background:var(--brun);color:#fff;font-size:12px;padding:4px 10px;border-radius:20px;z-index:99}
.lab{margin-top:10px;display:flex;align-items:center;gap:10px;justify-content:center;font-weight:500;font-size:17px}
.num{width:32px;height:32px;border-radius:50%;background:var(--brun);color:#fff;display:grid;place-items:center;font-size:14px}

/* téléphone */
.tel{width:270px;height:560px;border-radius:38px;border:8px solid #1d1416;overflow:hidden;position:relative;background:url(../loginail-site/fonds-img/cerises-vichy.webp) center/210px;box-shadow:0 14px 34px rgba(60,20,30,.18);isolation:isolate}
.ecr{position:absolute;inset:0;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:470px;overflow:hidden}
.hd>img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ombre::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(42,27,30,.78) 88%);z-index:2;pointer-events:none}
.id{position:absolute;left:0;right:0;bottom:104px;text-align:center;padding:0 14px;z-index:20}
.id h1{font-family:'Playfair Display';font-weight:600;font-style:italic;font-size:30px;line-height:1.02;color:#fff}
.id .s{font-size:12px;color:#fff;opacity:.92;margin-top:5px}
.btn{display:inline-block;margin-top:11px;background:#fff;color:var(--brun);font-size:14px;font-weight:500;padding:10px 28px;border-radius:30px}
.fonce .id h1,.fonce .id .s{color:var(--brun)}.fonce .btn{background:var(--brun);color:#fff}
.cartec{background:rgba(255,248,246,.95);border-radius:18px;padding:12px 12px 14px;margin:0 2px}
.cartec h1,.cartec .s{color:var(--brun)!important}.cartec .btn{background:var(--brun);color:#fff}
.bas{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--creme);border-radius:22px 22px 0 0;padding:12px 18px;z-index:25}
.bas h3{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:19px;margin-bottom:4px}
.bas div{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #f0dfdc}
.fx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.fx i,.fx b,.fx img{position:absolute;display:block}
img.ph{object-fit:cover;display:block}

@keyframes tombe{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(560px) rotate(360deg)}}
@keyframes monte{from{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}to{transform:translateY(-480px) translateX(20px);opacity:0}}
@keyframes bal{0%,100%{rotate:-5deg}50%{rotate:5deg}}
@keyframes balp{0%,100%{rotate:-2deg}50%{rotate:2deg}}
@keyframes bril{0%,100%{opacity:0;scale:.2}50%{opacity:1;scale:1}}
@keyframes kb{from{scale:1}to{scale:1.14}}
@keyframes defil{to{transform:translateX(-50%)}}

/* ===== 1 La photo brille ===== */
.cateye .fx{background:linear-gradient(100deg,transparent 30%,rgba(255,190,225,.15) 40%,rgba(255,235,250,.75) 50%,rgba(255,190,225,.15) 60%,transparent 70%);background-size:300% 100%;mix-blend-mode:screen;animation:ce 3.2s ease-in-out infinite alternate}
@keyframes ce{from{background-position:100% 0}to{background-position:0 0}}
.holo .fx{background:linear-gradient(120deg,#ff9ad5,#ffe29a,#9affd0,#9ad0ff,#d39aff,#ff9ad5);background-size:400% 400%;mix-blend-mode:overlay;opacity:.8;animation:holo 6s linear infinite}
.holo .fx::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);background-size:300% 100%;animation:ce 2.6s ease-in-out infinite alternate}
@keyframes holo{to{background-position:400% 400%}}
.chrome .id h1{font-family:'Playfair Display';font-weight:900;font-style:normal;font-size:34px;background:linear-gradient(100deg,#8e8e97 0%,#fff 18%,#a7a7b0 32%,#f4f4f8 50%,#7d7d86 66%,#fff 82%,#9a9aa3 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:chro 3s linear infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
@keyframes chro{to{background-position:-250% 0}}
.aurore .fx b{width:220px;height:220px;border-radius:50%;filter:blur(40px);mix-blend-mode:screen;opacity:.75}
.aurore .fx b:nth-child(1){background:#ff6fae;left:-60px;top:20px;animation:au1 7s ease-in-out infinite alternate}
.aurore .fx b:nth-child(2){background:#a77bff;right:-70px;top:120px;animation:au2 8s ease-in-out infinite alternate}
.aurore .fx b:nth-child(3){background:#ffb27a;left:30px;top:260px;animation:au1 9s ease-in-out infinite alternate-reverse}
@keyframes au1{to{transform:translate(90px,60px) scale(1.3)}}
@keyframes au2{to{transform:translate(-90px,-50px) scale(.8)}}
.nacre .fx{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,230,240,.25) 25%,transparent 45%);background-size:180% 180%;mix-blend-mode:overlay;animation:nac 5s ease-in-out infinite alternate}
.nacre .fx::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,220,235,.35),rgba(220,235,255,.35),rgba(255,245,220,.35));mix-blend-mode:soft-light}
@keyframes nac{from{background-position:0 0}to{background-position:100% 100%}}
.projo .fx{inset:-300px;background:radial-gradient(circle at 50% 50%,transparent 85px,rgba(20,8,12,.82) 140px);animation:pro 6s ease-in-out infinite}
@keyframes pro{0%,100%{transform:translate(-50px,-90px)}25%{transform:translate(60px,-30px)}50%{transform:translate(-20px,60px)}75%{transform:translate(50px,100px)}}
.projo .ombre::after{display:none}
.bokeh .fx i{border-radius:50%;background:radial-gradient(circle,rgba(255,230,240,.9),rgba(255,160,200,.35) 60%,transparent 70%);filter:blur(2px);mix-blend-mode:screen;animation:bok ease-in-out infinite alternate}
@keyframes bok{from{transform:translate(0,0);opacity:.3}to{transform:translate(18px,-30px);opacity:1}}
.scint .fx i{width:34px;height:34px;background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 6px #fff);animation:bril ease-in-out infinite}
.diam .fx i{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px #fff;animation:bril ease-in-out infinite}
.diam .fx i::before,.diam .fx i::after{content:"";position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,#fff,transparent);width:30px;height:1.5px;translate:-50% -50%}
.diam .fx i::after{rotate:90deg}
.flash .fx{background:#fff;opacity:0;animation:fla 3.5s infinite}
@keyframes fla{0%,86%{opacity:0}88%{opacity:1}100%{opacity:0}}
.flash .rec{position:absolute;top:16px;left:16px;z-index:6;color:#fff;font-size:11px;letter-spacing:.15em;display:flex;align-items:center;gap:6px}
.flash .rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff4f6d;animation:bril 1s infinite}
.flash .hd>img.ph{animation:fz 3.5s infinite}
@keyframes fz{0%,86%{scale:1.06}88%,100%{scale:1}}

/* ===== 2 Ça tombe, ça vole ===== */
.fx .chu{width:40px;animation:tombe linear infinite}
.fx .coeurm{width:26px;height:24px;background:#ff5d8f;clip-path:path("M13 23 C5 17 0 12 0 7 C0 3 3 0 7 0 C10 0 12 2 13 4 C14 2 16 0 19 0 C23 0 26 3 26 7 C26 12 21 17 13 23Z");animation:monte ease-out infinite;bottom:110px}
.fx .pet{width:16px;height:20px;background:linear-gradient(135deg,#ffd1dc,#ff9db5);border-radius:80% 0 80% 0;animation:tombe linear infinite,sway 2s ease-in-out infinite alternate}
@keyframes sway{to{margin-left:30px}}
.fx .conf{width:7px;height:12px;animation:tombe linear infinite}
.fx .or{width:10px;height:7px;background:linear-gradient(135deg,#b88a3e,#fff2c4,#c99a45);clip-path:polygon(0 30%,40% 0,100% 20%,80% 100%,20% 80%);animation:tombe linear infinite}
.fx .sav{border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0 8%,transparent 10%),radial-gradient(circle,transparent 60%,rgba(255,170,220,.5) 70%,rgba(170,220,255,.6) 85%,rgba(255,255,255,.8) 100%);animation:monte linear infinite;bottom:60px}
.fx .fil{width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(-30deg);animation:filante linear infinite;filter:drop-shadow(0 0 4px #fff)}
@keyframes filante{0%{translate:0 0;opacity:0}5%{opacity:1}25%{translate:-260px 150px;opacity:0}100%{translate:-260px 150px;opacity:0}}
.fx .ballon{width:44px;height:52px;animation:monte linear infinite;bottom:80px}
.fx .ballon::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,#ffd0de,#ff5d8f 60%,#d93a6c);clip-path:path("M22 50 C8 38 0 28 0 15 C0 6 6 0 13 0 C17 0 20 2 22 6 C24 2 27 0 31 0 C38 0 44 6 44 15 C44 28 36 38 22 50Z")}
.fx .ballon::after{content:"";position:absolute;left:21px;top:50px;width:1px;height:60px;background:rgba(255,255,255,.8)}
.fx .gold{width:7px;height:7px;border-radius:2px;background:linear-gradient(135deg,#fff6cf,#d4a645);box-shadow:0 0 5px #ffe9a0;animation:tombe linear infinite}
.gum .gb{position:absolute;left:50%;bottom:200px;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 7%,transparent 9%),radial-gradient(circle,#ffb3cf 0,#ff7aa8 70%,#f45c92 100%);z-index:4;animation:gum 3.4s ease-in infinite;opacity:.92}
@keyframes gum{0%{scale:0}80%{scale:1.15;opacity:.92}82%{scale:1.3;opacity:0}100%{scale:0;opacity:0}}

/* ===== 3 Suspendu ===== */
.susp{position:absolute;top:0;transform-origin:50% 0;z-index:6;animation:bal ease-in-out infinite}
.susp .fil2{width:1.5px;margin:0 auto;background:linear-gradient(#fff,#f3c6d1)}
.susp img{width:52px;display:block;margin:-2px auto 0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.chaine{position:absolute;top:0;left:-10px;right:-10px;height:70px;z-index:6;border-bottom:3px dotted #f1d48a;border-radius:0 0 50% 50%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.enseigne{position:absolute;top:0;left:50%;width:210px;margin-left:-105px;transform-origin:50% 0;animation:balp 4s ease-in-out infinite;z-index:21}
.enseigne .cordes{height:46px;display:flex;justify-content:space-between;padding:0 30px}
.enseigne .cordes i{width:1.5px;background:#fff}
.enseigne .pl{background:#1c0d13;border-radius:16px;padding:14px 10px 16px;border:2px solid #3a2028;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.enseigne h1{font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:28px;line-height:1;color:#fff;text-shadow:0 0 5px #ff8fb4,0 0 14px #ff4f8b,0 0 28px #ff4f8b;animation:flick 5s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.4}}
.perles .fx i{top:-10px;width:10px;background:radial-gradient(circle,#fff 0 3px,#f4dfe6 4px,rgba(0,0,0,.0) 5px) 0 0/10px 13px repeat-y;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));transform-origin:50% 0;animation:balp ease-in-out infinite}
.tagv{position:absolute;top:0;left:50%;width:206px;margin-left:-103px;transform-origin:50% 0;animation:bal 4s ease-in-out infinite;z-index:21}
.tagv .rb{width:16px;height:70px;margin:0 auto;background:linear-gradient(90deg,#c9506d,#ff8fb1,#c9506d)}
.tagv .lv{background:radial-gradient(circle at 30% 20%,#d86a87,#a3304e);border:3px solid #f1d48a;border-radius:18px 18px 18px 18px;padding:18px 12px 16px;box-shadow:0 10px 22px rgba(0,0,0,.35);position:relative}
.tagv .lv::before{content:"";position:absolute;top:6px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#f1d48a}
.tagv h1{font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:28px;line-height:1;color:#fff6e6}
.tagv .s{color:#ffe7ee;font-size:12px;margin-top:5px}
.pancarte{position:absolute;top:0;left:50%;width:170px;margin-left:-85px;z-index:21;transform-origin:50% 0;animation:balp 3s ease-in-out infinite}
.pancarte .tri{height:40px;position:relative}
.pancarte .tri::before,.pancarte .tri::after{content:"";position:absolute;top:0;width:1.5px;height:48px;background:#fff;transform-origin:top}
.pancarte .tri::before{left:84px;rotate:38deg}.pancarte .tri::after{left:84px;rotate:-38deg}
.pancarte .flip{height:70px;perspective:600px}
.pancarte .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flipo 5s ease-in-out infinite}
.pancarte .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:grid;place-items:center;font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:26px;border:3px solid #fff;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.pancarte .f1{background:#fff8f6;color:var(--rose)}
.pancarte .f2{background:var(--rose);color:#fff;transform:rotateY(180deg)}
@keyframes flipo{0%,40%{transform:rotateY(0)}50%,90%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.mobile .branche{position:absolute;top:30px;left:50%;width:200px;margin-left:-100px;height:3px;background:linear-gradient(90deg,#d8b46a,#fff1c2,#d8b46a);border-radius:3px;z-index:6;animation:balp 5s ease-in-out infinite;transform-origin:50% 0}
.mobile .branche::before{content:"";position:absolute;left:99px;top:-30px;width:1.5px;height:30px;background:#fff}
.mobile .branche .susp{top:2px}
.noeud .gros{position:absolute;top:-10px;left:50%;width:150px;margin-left:-75px;z-index:6;transform-origin:50% 0;animation:balp 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.guir .fil3{position:absolute;top:-10px;left:-20px;right:-20px;height:80px;border-bottom:1.5px solid #2c1b1f;border-radius:0 0 50% 50%;z-index:6}
.guir .fx i{width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#ffe9a8;box-shadow:0 0 10px 4px rgba(255,220,130,.8);animation:ampoule 1.6s ease-in-out infinite alternate}
@keyframes ampoule{from{opacity:.35;box-shadow:0 0 2px 1px rgba(255,220,130,.4)}to{opacity:1}}
.fanions .fx i{width:24px;height:30px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;animation:balp 1.8s ease-in-out infinite}
.fanions .corde{position:absolute;top:-6px;left:-20px;right:-20px;height:50px;border-bottom:1.5px solid #fff;border-radius:0 0 50% 50%;z-index:6}

/* ===== 4 Comme sur le téléphone ===== */
.verrou .heure{position:absolute;top:44px;left:0;right:0;text-align:center;color:#fff;z-index:6;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.verrou .heure small{display:block;font-size:13px;font-weight:500}
.verrou .heure b{font-size:66px;font-weight:600;letter-spacing:-.02em;line-height:1}
.notif{position:absolute;left:12px;right:12px;top:150px;z-index:7;background:rgba(255,248,250,.82);backdrop-filter:blur(12px);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;font-size:12px;color:var(--brun);animation:notif 5s cubic-bezier(.2,.9,.3,1.2) infinite}
.notif img{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none}
.notif b{display:block;font-size:12.5px}
@keyframes notif{0%,8%{transform:translateY(-200px);opacity:0}18%,85%{transform:translateY(0);opacity:1}95%,100%{transform:translateY(-200px);opacity:0}}
.msg .bulle{position:absolute;z-index:7;max-width:180px;padding:9px 13px;border-radius:20px;font-size:13px;opacity:0;animation:bul 9s infinite}
.msg .b1{left:14px;top:40px;background:rgba(235,235,240,.95);color:#111;border-bottom-left-radius:6px}
.msg .b2{right:14px;top:96px;background:#ff5d8f;color:#fff;border-bottom-right-radius:6px;animation-delay:1.4s}
.msg .b3{left:14px;top:152px;background:rgba(235,235,240,.95);color:#111;border-bottom-left-radius:6px;animation-delay:2.8s}
.msg .b4{right:14px;top:208px;background:#ff5d8f;color:#fff;border-bottom-right-radius:6px;animation-delay:4.2s}
@keyframes bul{0%{opacity:0;transform:translateY(10px) scale(.9)}5%,80%{opacity:1;transform:none}90%,100%{opacity:0}}
.like .gc{position:absolute;left:50%;top:170px;width:110px;height:100px;margin-left:-55px;background:#fff;clip-path:path("M55 98 C20 72 0 52 0 30 C0 12 13 0 30 0 C42 0 50 7 55 16 C60 7 68 0 80 0 C97 0 110 12 110 30 C110 52 90 72 55 98Z");z-index:6;animation:lk 3s infinite;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
@keyframes lk{0%,20%{scale:0;opacity:0}28%{scale:1.2;opacity:1}34%{scale:.95}40%,60%{scale:1;opacity:1}70%,100%{scale:0;opacity:0}}
.like .cpt{position:absolute;top:16px;left:16px;z-index:6;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500}
.live .badge{position:absolute;top:16px;left:14px;z-index:7;display:flex;gap:6px}
.live .badge span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;color:#fff}
.live .badge span:first-child{background:linear-gradient(45deg,#ff2d6f,#ff7a3d)}
.live .badge span:last-child{background:rgba(0,0,0,.4)}
.live .coms{position:absolute;left:12px;bottom:250px;z-index:7;width:190px;height:120px;overflow:hidden;mask-image:linear-gradient(transparent,#000 40%)}
.live .coms div{animation:coms 8s linear infinite}
.live .coms p{font-size:12px;color:#fff;margin:5px 0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.live .coms p b{font-weight:600;margin-right:4px}
@keyframes coms{from{transform:translateY(120px)}to{transform:translateY(-180px)}}
.camera .vis{position:absolute;inset:18px 18px 130px;z-index:6;border:0}
.camera .vis i{position:absolute;width:26px;height:26px;border-color:#fff;border-style:solid;border-width:0}
.camera .vis i:nth-child(1){top:0;left:0;border-top-width:2px;border-left-width:2px}
.camera .vis i:nth-child(2){top:0;right:0;border-top-width:2px;border-right-width:2px}
.camera .vis i:nth-child(3){bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}
.camera .vis i:nth-child(4){bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}
.camera .focus{position:absolute;left:90px;top:150px;width:70px;height:70px;border:1.5px solid #ffd76a;z-index:6;animation:foc 3s ease-in-out infinite}
@keyframes foc{0%{scale:1.6;opacity:0}15%{scale:1;opacity:1}30%{opacity:.4}45%{opacity:1}70%,100%{opacity:0}}
.camera .rec{position:absolute;top:28px;left:50%;translate:-50% 0;z-index:7;color:#fff;font-size:11px;letter-spacing:.12em;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.3);padding:3px 10px;border-radius:12px}
.camera .rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff3b5c;animation:bril 1.2s infinite}
.camera .hd>img.ph{animation:kb 6s ease-in-out infinite alternate}
.avis .carteav{position:absolute;left:16px;right:16px;top:60px;z-index:7;background:rgba(255,255,255,.93);border-radius:18px;padding:12px 14px;text-align:left;animation:av 6s infinite;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.avis .et{color:#f5b301;font-size:18px;letter-spacing:2px}
.avis .et span{opacity:0;animation:etl 6s infinite}

/* carte à gratter : on gratte en zigzag, puis ça recommence */
document.querySelectorAll('.gratte canvas').forEach(function(cv){var x=cv.getContext('2d'),t=0;
  function argent(){x.globalCompositeOperation='source-over';var gr=x.createLinearGradient(0,0,254,400);gr.addColorStop(0,'#d9d9de');gr.addColorStop(.5,'#f4f4f7');gr.addColorStop(1,'#bdbdc4');x.fillStyle=gr;x.fillRect(0,0,254,400);
    x.fillStyle='rgba(120,120,130,.5)';x.font='600 15px Jost';x.textAlign='center';for(var j=0;j<6;j++)x.fillText('✦  grattez  ✦',127,60+j*52);}
  argent();
  setInterval(function(){t++;if(t>230){t=0;argent();return}if(t>170)return;
    var y=10+t*1.7,xx=127+Math.sin(t/6)*115;x.globalCompositeOperation='destination-out';x.beginPath();x.arc(xx,y,34,0,7);x.fill();x.beginPath();x.arc(254-xx,y-20,26,0,7);x.fill();},30);
});
/* machine à écrire */
document.querySelectorAll('.ecrire .boite').forEach(function(b){var L=b.dataset.l.split('|'),s=b.querySelector('span'),i=0,j=0,eff=false;
  setInterval(function(){var l=Array.from(L[i]);if(!eff){j++;s.textContent=l.slice(0,j).join('');if(j>=l.length+25)eff=true}else{j-=2;s.textContent=l.slice(0,Math.max(0,j)).join('');if(j<=0){eff=false;j=0;i=(i+1)%L.length}}},60);
});

/* le nom tient TOUJOURS sur une ligne : on réduit la taille jusqu'à ce qu'il rentre */

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(ajuste);ajuste();
