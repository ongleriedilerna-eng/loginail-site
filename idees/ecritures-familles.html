<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écritures par familles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--fond:#f7f0ea;--carte:#f6dfe3;--carte2:#fbeef0;--encre:#3a1f2b;--rose:#9b3157;--doux:#8a6f78;--trait:#ead7da}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fond);color:var(--encre);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- Page de comparaison (2 téléphones) ---------- */
.compare{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
.compare h1{font-family:Georgia,serif;font-weight:400;font-size:30px;text-align:center}
.compare h1 em{color:var(--rose)}
.compare>p{text-align:center;color:var(--doux);margin:8px 0 26px;font-size:15px}
.duo{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
.tel{text-align:center}
.tel b{display:block;font-size:17px;margin-bottom:4px}
.tel span{display:block;color:var(--doux);font-size:13px;margin-bottom:12px}
.tel iframe{width:390px;height:780px;border:10px solid #241820;border-radius:44px;background:var(--fond);max-width:calc(100vw - 32px)}
.tel a{display:inline-block;margin-top:10px;color:var(--rose);font-size:14px}

/* ---------- Onglet Écriture (les 2 versions) ---------- */
.pan{max-width:1200px;margin:0 auto;padding:22px 16px 40px}
.pan h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;letter-spacing:-.3px}
.pan h2 em{color:var(--rose)}
.pan .sous{color:var(--doux);font-size:14px;margin:4px 0 16px}
.carte{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  height:96px;border-radius:18px;background:linear-gradient(135deg,var(--carte),var(--carte2));
  --t:25px;border:2px solid transparent;transition:transform .15s ease,border-color .15s ease;padding:6px 8px;overflow:hidden}
.carte:active{transform:scale(.97)}
.carte .nom{display:block;width:max-content;line-height:1.15;color:var(--rose);white-space:nowrap;transform-origin:center}
.carte .eti{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--doux)}
.carte.on{border-color:var(--rose)}
.carte.on::after{content:"✓";position:absolute;top:7px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--rose);color:#fff;font-size:12px;line-height:20px;text-align:center}
.carte.neuve .eti::before{content:"• ";color:var(--rose)}

/* Version A : rayons (pastilles) */
.pastilles{position:sticky;top:0;z-index:2;background:var(--fond);display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.pastilles::-webkit-scrollbar{display:none}
.pastille{flex:none;padding:9px 15px;border-radius:99px;border:1.5px solid var(--trait);background:#fff;font-size:14px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.pastille.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.slogan{font-family:Georgia,serif;font-style:italic;color:var(--doux);font-size:15px;margin:2px 0 12px}
.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grille.anim{animation:monte .22s ease}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Version B : vitrine (étagères) */
.etagere{margin:6px 0 22px}
.etagere .tete{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.etagere h3{font-family:Georgia,serif;font-weight:400;font-size:22px}
.etagere .tout{color:var(--rose);font-size:14px;white-space:nowrap}
.etagere .slogan{margin:2px 0 10px;font-size:14px}
.rang{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.rang::-webkit-scrollbar{display:none}
.rang .carte{flex:none;width:44%;scroll-snap-align:start}
.etagere.ouverte .rang{display:grid;grid-template-columns:repeat(2,1fr);overflow:visible;margin:0;padding:0}
.etagere.ouverte .rang .carte{width:auto}

@media (min-width:900px){
  .pan{padding:36px 40px 60px}
  .pan h2{font-size:40px}
  .grille,.etagere.ouverte .rang{grid-template-columns:repeat(4,1fr);gap:14px}
  .carte{height:120px}
  .carte{--t:32px}
  .rang .carte{width:23%}
  .pastilles{margin:0;padding-left:0;padding-right:0}
  .rang{margin:0;padding:0 0 6px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>

 // ---- Folles
 ["Rubik Gemstones","Bijou","F","",.88],["Henny Penny","Conte de fées","F","",.88],["Rubik Beastly","Monstre mignon","F","",.88],
 ["Rubik Spray Paint","Bombe de peinture","F","",.88],["Monoton","Y2K","F","",.72],["Bungee Shade","Relief","F","",.7],

 ["Mountains of Christmas","Noël","F","wght@700",.95,1],["Caesar Dressing","César","F","",.9,1],["Griffy","Griffe","F","",.95,1],

 // ---- À la main
 ["Permanent Marker","Feutre","M","",.85],["Kaushan Script","Pinceau","M","",1],["Sedgwick Ave Display","Graffiti","M","",1],
 ["Comforter Brush","Pinceau doux","M","",1.15,1],["Gloria Hallelujah","Alléluia","M","",.85,1],["Reenie Beanie","Gribouille","M","",1.15,1],
 ["Zeyada","Zeyada","M","",1.15,1],["Crafty Girls","Bricolage","M","",.85,1],["Kalam","Kalam","M","wght@700",.95,1],
 ["Covered By Your Grace","Grâce","M","",1.05,1],["Swanky and Moo Moo","Meuh","M","",.95,1]
];
const FAM = [
 ["E","Élégantes","Chic comme une couverture de magazine"],
 ["A","Attachées","Les belles lettres qui se tiennent la main"],
 ["G","Gourmandes","Rondes, sucrées, à croquer"],
 ["V","Vintage","Saloon, pin-up, pirate, gothique, fête foraine"],
 ["F","Folles","Pour celles qui osent tout"],
 ["M","À la main","Comme un petit mot écrit au feutre"]
];
const TEXTE = "Ongles de Léa";

/* chargement des écritures, seulement les lettres du texte (rapide) */
for (let i = 0; i < L.length; i += 15) {
  const q = L.slice(i, i + 15).map(([g,,,a]) => "family=" + g.replace(/ /g,"+") + (a ? ":" + a : "")).join("&");
  const l = document.createElement("link"); l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?" + q + "&text=" + encodeURIComponent(TEXTE) + "&display=swap";
  document.head.appendChild(l);
}
const style = ([g,,,a]) => {
  let s = "font-family:'" + g + "'";
  if (/ital/.test(a)) s += ";font-style:italic";
  const w = (a.match(/wght@(?:1,)?(\d+)/) || [])[1]; if (w) s += ";font-weight:" + w;
  return s;
};
let choisie = "Great Vibes";
const carte = f => `<button class="carte${f[5] ? " neuve" : ""}${f[0] === choisie ? " on" : ""}" data-g="${f[0]}">
  <span class="nom" style="${style(f)};font-size:calc(var(--t,25px) * ${f[4]})">${TEXTE}</span><span class="eti">${f[1]}</span></button>`;
const de = k => L.filter(f => f[2] === k);
const app = document.getElementById("app");
const v = new URLSearchParams(location.search).get("v");
const entete = `<h2>Votre <em>écriture</em></h2><p class="sous">Votre nom, dans le style qui vous ressemble.</p>`;

function versionA() {
  let fam = "E";
  const dessine = anim => {
    const F = FAM.find(x => x[0] === fam);
    app.innerHTML = `<div class="pan">${entete}
      <div class="pastilles">${FAM.map(([k,n]) => `<button class="pastille${k===fam?" on":""}" data-k="${k}">${n}</button>`).join("")}</div>
      <p class="slogan">${F[2]}</p><div class="grille${anim?" anim":""}">${de(fam).map(carte).join("")}</div></div>`;
  };
  dessine(false);
  app.addEventListener("click", e => {
    const p = e.target.closest(".pastille"); if (p) { fam = p.dataset.k; dessine(true); return; }
    const c = e.target.closest(".carte"); if (c) { choisie = c.dataset.g; app.querySelectorAll(".carte").forEach(x => x.classList.toggle("on", x === c)); }
  });
}
function versionB() {
  app.innerHTML = `<div class="pan">${entete}${FAM.map(([k,n,s]) => `<section class="etagere" data-k="${k}">
    <div class="tete"><h3>${n}</h3><button class="tout">Tout voir →</button></div><p class="slogan">${s}</p>
    <div class="rang">${de(k).map(carte).join("")}</div></section>`).join("")}</div>`;
  app.addEventListener("click", e => {
    const t = e.target.closest(".tout");
    if (t) { const s = t.closest(".etagere"); const o = s.classList.toggle("ouverte"); t.textContent = o ? "Replier ↑" : "Tout voir →"; return; }
    const c = e.target.closest(".carte"); if (c) { choisie = c.dataset.g; app.querySelectorAll(".carte").forEach(x => x.classList.toggle("on", x === c)); }
  });
}
/* un nom trop long rapetisse pour tenir dans sa carte (jamais coupé) */
function ajuste() {
  app.querySelectorAll(".nom").forEach(n => {
    const dispo = n.parentElement.clientWidth - 18, r = dispo / n.offsetWidth;
    n.style.transform = r < 1 ? "scale(" + r + ")" : "";
  });
}
new MutationObserver(() => requestAnimationFrame(ajuste)).observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
document.fonts.addEventListener("loadingdone", ajuste); addEventListener("resize", ajuste);
if (v === "a") { document.title = "Version A · Rayons"; versionA(); }
else if (v === "b") { document.title = "Version B · Vitrine"; versionB(); }
else {
  document.title = "Écritures : 2 versions";
  app.innerHTML = `<div class="compare"><h1>Les écritures <em>par familles</em></h1>
   <p>Les 121 écritures (57 en ligne + 64 que tu as gardées, point rose) rangées en 6 familles. Touche pour essayer.</p>
   <div class="duo">
    <div class="tel"><b>Version A · Rayons</b><span>une famille à la fois, on passe de l'une à l'autre en haut</span>
      <iframe src="?v=a" title="Version A"></iframe><br><a href="?v=a" target="_blank">Ouvrir en grand</a></div>
    <div class="tel"><b>Version B · Vitrine</b><span>toutes les familles d'un coup, on glisse chaque rangée</span>
      <iframe src="?v=b" title="Version B"></iframe><br><a href="?v=b" target="_blank">Ouvrir en grand</a></div>
   </div></div>`;
}
</script>
</body>
</html>
