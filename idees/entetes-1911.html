<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 nouvelles en-têtes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
@property --r{syntax:'<length>';inherits:false;initial-value:0px}
:root{--brun:#2A1B1E}
*{box-sizing:border-box;margin:0}
body{background:#FBF1EF;font-family:Jost,sans-serif;color:var(--brun);padding:28px 16px 60px}
header.p{max-width:1240px;margin:0 auto 10px;text-align:center}
.t{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:40px}
header.p p{color:#7a5f64;margin-top:6px;font-size:15px;line-height:1.5}
.grille{max-width:1240px;margin:30px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:26px 14px;justify-items:center}
.case{text-align:center;cursor:pointer;transition:opacity .25s;position:relative}
.case.non{opacity:.3}
.case.non::after{content:"Pas gardée";position:absolute;top:14px;left:50%;translate:-50% 0;background:var(--brun);color:#fff;font-size:12px;padding:4px 10px;border-radius:20px;z-index:99}
.lab{margin-top:10px;display:flex;align-items:center;gap:10px;justify-content:center;font-weight:500;font-size:17px}
.num{width:32px;height:32px;border-radius:50%;background:var(--brun);color:#fff;display:grid;place-items:center;font-size:14px}
.num.c{background:#b5475e}

.tel.off *{animation-play-state:paused!important}
.tel{width:270px;height:560px;border-radius:38px;border:8px solid #1d1416;overflow:hidden;position:relative;background:#f6d9df;box-shadow:0 14px 34px rgba(60,20,30,.18);isolation:isolate}
.ecr{position:absolute;inset:0;overflow:hidden}
.pf{position:absolute;left:0;top:0;width:254px;height:544px;object-fit:cover}
/* LE RECTANGLE : mêmes mots, même forme — seule sa place change */
.carte{position:absolute;left:10px;right:10px;top:296px;z-index:20;background:#fff;border-radius:16px;padding:12px 10px 14px;text-align:center;box-shadow:0 10px 24px -14px rgba(0,0,0,.45);color:#1e1c1b}
.carte .k{font-size:7px;letter-spacing:1.7px;text-transform:uppercase}
.carte .nom{font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:28px;line-height:1.1;margin-top:6px;white-space:nowrap}
.carte .et{font-size:7.5px;letter-spacing:.3px;margin-top:6px}
.carte .res{display:inline-block;margin-top:12px;background:#1e1c1b;color:#f6f3ef;font-size:7.2px;letter-spacing:1.4px;text-transform:uppercase;font-weight:500;height:28px;line-height:28px;padding:0 17px;border-radius:16px}
.hd{position:absolute;left:0;right:0;top:0;height:400px;overflow:hidden;background:#f6d9df}
.hd img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.suite{position:absolute;left:10px;right:10px;top:466px;height:120px;background:#fff;border-radius:16px;z-index:19;padding:14px;text-align:center}
.suite b{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:17px}
.fx{position:absolute;inset:0;pointer-events:none}

/* 1 trame de points (gardée) */
.trame .ph{-webkit-mask:radial-gradient(circle at 50% 50%,#000 var(--r),transparent calc(var(--r) + .6px)) 0 0/16px 16px;mask:radial-gradient(circle at 50% 50%,#000 var(--r),transparent calc(var(--r) + .6px)) 0 0/16px 16px;animation:tr 7s ease-in-out infinite}
@keyframes tr{0%{--r:0px}35%,70%{--r:12px}100%{--r:0px}}

/* charms qui tombent */
.chu{position:absolute;top:-70px;will-change:transform;animation:chute linear infinite}
.chu img{display:block;width:100%;animation:bal2 ease-in-out infinite alternate}
@keyframes chute{from{translate:0 0;rotate:0deg}to{translate:0 680px;rotate:360deg}}
@keyframes bal2{from{translate:-14px 0}to{translate:14px 0}}
/* bulles */
.bul{will-change:transform;position:absolute;bottom:-100px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.2) 38%,rgba(255,150,220,.28));box-shadow:inset 0 0 12px rgba(255,255,255,.7),0 0 10px rgba(255,170,230,.5);display:grid;place-items:center;animation:monte linear infinite}
.bul img{width:58%;height:58%;object-fit:contain}
@keyframes monte{0%{translate:0 0}25%{translate:14px -190px}50%{translate:-12px -380px}75%{translate:14px -570px}100%{translate:0 -760px}}
/* disco */
.rayons{position:absolute;width:820px;height:820px;left:-283px;top:-366px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.32) 0 4deg,transparent 4deg 20deg);will-change:transform;animation:tourne 16s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,#000 55%,transparent 70%);mask:radial-gradient(circle,#000 0,#000 55%,transparent 70%)}
@keyframes tourne{to{rotate:360deg}}
.tint{position:absolute;left:0;top:0;width:762px;height:544px;opacity:.32;background:linear-gradient(90deg,#ff4fa0,#6d6bff,#ffb347,#ff4fa0);will-change:transform;animation:ti 7s linear infinite}
@keyframes ti{to{translate:-508px 0}}
.boule{position:absolute;left:105px;top:26px;width:44px;height:44px;border-radius:50%;z-index:6;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,transparent 1px 7px),radial-gradient(circle at 35% 30%,#fff,#cfd3dc 40%,#7d8196);animation:br 2s linear infinite;box-shadow:0 0 18px 4px rgba(255,255,255,.7)}
@keyframes br{to{background-position:7px 0,7px 0,0 0}}
.fil1{position:absolute;left:126px;top:0;width:1px;height:28px;background:#ddd;z-index:6}
.ts{position:absolute;color:#fff;text-shadow:0 0 8px #fff;animation:tw ease-in-out infinite;z-index:7}
@keyframes tw{0%,100%{opacity:.1;scale:.4}50%{opacity:1;scale:1.1}}
.glisse{animation:gl 8s ease-in-out infinite}
@keyframes gl{0%{translate:130% 0}12%,80%{translate:0 0}92%,100%{translate:-130% 0}}
/* étoiles filantes */
.nuit{background:linear-gradient(180deg,#24104a,#7a2a78 55%,#e0689a)}
.pt{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite}
.fil{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,transparent,#fff);rotate:35deg;opacity:0;box-shadow:0 0 6px #fff;animation:fs 3.4s linear infinite}
@keyframes fs{0%{translate:0 0;opacity:0}6%{opacity:1}28%{translate:190px 133px;opacity:0}100%{translate:190px 133px;opacity:0}}
.zm{animation:kb 10s ease-in-out infinite alternate}
@keyframes kb{from{scale:1;translate:0 0}to{scale:1.18;translate:-3% -2%}}
/* vichy */
.vichy{width:464px;height:754px;background:url(../loginail-site/fonds-img/cerises-vichy.webp) 0 0/210px;will-change:transform;animation:vi 9s linear infinite}
@keyframes vi{to{translate:-210px -210px}}
.flotte{will-change:transform;position:absolute;animation:fo ease-in-out infinite alternate}
@keyframes fo{from{translate:0 0;rotate:-10deg}to{translate:0 -16px;rotate:10deg}}
/* pellicule */
.lane{position:absolute;top:0;bottom:0;width:58px;overflow:hidden;background:rgba(255,255,255,.55)}
.col{will-change:transform;display:flex;flex-direction:column;align-items:center;animation:cv linear infinite}
.col img{width:44px;height:44px;object-fit:contain;margin:6px 0;flex:none}
@keyframes cv{from{translate:0 0}to{translate:0 -400px}}
@keyframes cv2{from{translate:0 -400px}to{translate:0 0}}
/* lave */
.lave{background:#2a0f33}
.goo{position:absolute;left:0;right:0;top:0;height:310px}
.goo b{position:absolute;border-radius:50%;will-change:transform;animation:lv ease-in-out infinite alternate}
@keyframes lv{from{translate:0 0;scale:1}to{translate:var(--dx) var(--dy);scale:1.35}}
.f3d{animation:f3 6s ease-in-out infinite}
@keyframes f3{0%,100%{transform:perspective(500px) rotateX(7deg) rotateY(-11deg) translateY(0)}50%{transform:perspective(500px) rotateX(-5deg) rotateY(11deg) translateY(-8px)}}
/* vagues */
.w{position:absolute;left:0;width:508px;height:80px;background-repeat:repeat-x;background-size:254px 80px;will-change:transform;animation:wv linear infinite}
.w1{top:292px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='254' height='80' viewBox='0 0 254 80'><path d='M0 22 Q63 -4 127 22 T254 22 V80 H0Z' fill='%23d9c2ff'/></svg>");animation-duration:9s}
.w2{top:312px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='254' height='80' viewBox='0 0 254 80'><path d='M0 22 Q63 48 127 22 T254 22 V80 H0Z' fill='%23ffc2d8'/></svg>");animation-duration:6s;animation-direction:reverse}
.w3{top:334px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='254' height='80' viewBox='0 0 254 80'><path d='M0 22 Q63 -2 127 22 T254 22 V80 H0Z' fill='%23f78fb3'/></svg>");animation-duration:4.5s}
@keyframes wv{to{translate:-254px 0}}
.mer{position:absolute;left:0;right:0;top:400px;bottom:0;background:#f78fb3}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0;rotate:-1.6deg}50%{translate:0 -10px;rotate:1.6deg}}
/* seuls les téléphones visibles à l'écran bougent */
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('off',!e.isIntersecting)})},{rootMargin:'60px'});
  document.querySelectorAll('.tel').forEach(function(t){t.classList.add('off');io.observe(t)});
}
/* feu d'artifice */
.fwb{position:absolute;width:4px;height:4px;border-radius:50%;z-index:4}
/* carte qui tombe + confettis */
.tombe{animation:tb 7s infinite}
@keyframes tb{0%{translate:0 -340px;animation-timing-function:cubic-bezier(.55,0,1,.7)}9%{translate:0 0;animation-timing-function:ease-out}13%{translate:0 -34px;animation-timing-function:ease-in}17%{translate:0 0;animation-timing-function:ease-out}20%{translate:0 -12px;animation-timing-function:ease-in}23%,86%{translate:0 0;animation-timing-function:ease-in}100%{translate:0 -340px}}
.cf{position:absolute;top:-20px;width:6px;height:11px;will-change:transform;animation:chute linear infinite}
.cf b{display:block;width:100%;height:100%;animation:bal2 ease-in-out infinite alternate}
/* tunnel */
.tun{will-change:transform,opacity;animation:tn 6s linear infinite}
@keyframes tn{0%{scale:.92;opacity:0}15%{opacity:.9}100%{scale:2.6;opacity:0}}
/* ballons */
.bal{will-change:transform;position:absolute;bottom:-150px;animation:ba linear infinite}
.bal img{display:block;width:56px;height:56px;object-fit:contain;transform-origin:50% 100%;animation:sw 2.4s ease-in-out infinite alternate}
.bal i{display:block;width:1px;height:60px;background:rgba(255,255,255,.85);margin:-3px auto 0}
@keyframes ba{to{translate:var(--dx) -780px}}
@keyframes sw{from{rotate:-9deg}to{rotate:9deg}}
/* rubans */
.belt{position:absolute;left:0;width:254px;height:58px;overflow:hidden;background:rgba(255,255,255,.78);z-index:8}
.belt div{will-change:transform;display:flex;width:max-content;animation:rb 9s linear infinite}
.belt img{width:40px;height:40px;object-fit:contain;margin:9px 20px 9px 0;flex:none}
@keyframes rb{to{translate:-600px 0}}
.belt.r div{animation-direction:reverse}
/* pop */
.gd{width:1016px;background:linear-gradient(90deg,#ffc2d8,#d9c2ff,#c2f0e0,#ffe0b8);will-change:transform;animation:gdn 9s ease-in-out infinite alternate}
@keyframes gdn{to{translate:-762px 0}}
.pop{will-change:transform;position:absolute;animation:po 3.4s infinite}
@keyframes po{0%{scale:0;rotate:-30deg;opacity:0}10%{scale:1.25;opacity:1}16%{scale:1;rotate:0deg}70%{scale:1;opacity:1}82%,100%{scale:0;opacity:0}}
</style></head><body>
<header class="p"><h1 class="t">15 nouvelles en-têtes</h1><p>Ton ancien n° 2 (Trame de points) devient le n° 1. Toutes les autres sont nouvelles : le rectangle change de place, la photo aussi, et les fonds bougent.<br>Dis-moi simplement les numéros que tu gardes. Un clic sur un téléphone = « pas gardée ».</p></header>
<div class="grille" id="g"></div>
<script>
var graine=23;function r(){graine=(graine*9301+49297)%233280;return graine/233280}
function rx(a,b){return a+r()*(b-a)}
function rep(k,f){var s='';for(var i=0;i<k;i++)s+=f(i);return s}
var P=function(n){return '../loginail-site/univers-photos/cerise/'+n+'.webp'};
var CH='../loginail-site/charms/';
var CHS=["cerises","ceriseruban","cerisecoeur","biscuitcoeurnoeud","cerisedisco","coeurchrome","etoilechrome","bonbon","coeurgeleerose","coeurcristal"];
var CC=function(i){return CH+CHS[i%CHS.length]+'.png'};
var NOM='Nails by Drimf';
function CARTE(top,cls){return '<div class="carte '+(cls||'')+'" style="top:'+top+'px"><div class="k">Prothésiste ongulaire · Lyon 3e</div><div class="nom">'+NOM+'</div><div class="et">★★★★★ 5,0 · 67 avis (exemple)</div><span class="res">Réserver un créneau</span></div>'}
function PF(n,style,cls){return '<img class="pf '+(cls||'')+'" src="'+P(n)+'" style="'+(style||'')+'">'}
function charmsChute(k,z,min,max){return rep(k,function(i){return '<div class="chu" style="z-index:'+z+';left:'+rx(0,88)+'%;width:'+rx(min,max)+'px;animation-duration:'+rx(5,8)+'s;animation-delay:-'+rx(0,8)+'s"><img src="'+CC(i)+'" style="animation-duration:'+rx(1.6,2.8)+'s;animation-delay:-'+rx(0,2)+'s"></div>'})}

var T=[
 ["Trame de points (ton n° 2)",'<div class="hd trame"><img class="ph" src="'+P(3)+'"></div>'+CARTE(296)+'<div class="suite"><b>Prestations</b></div>',"c"],
 ["Pluie de charms",PF(1)+charmsChute(8,10,28,44)+CARTE(205)+charmsChute(5,25,22,34)],
 ["Bulles de charms",PF(2)+rep(9,function(i){var s=rx(46,78);return '<i class="bul" style="z-index:'+(i%2?10:25)+';left:'+rx(0,80)+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+rx(7,11)+'s;animation-delay:-'+rx(0,10)+'s"><img src="'+CC(i)+'"></i>'})+CARTE(395)],
 ["Disco",PF(5)+'<div class="tint"></div><div class="rayons"></div><i class="fil1"></i><i class="boule"></i>'+rep(14,function(){return '<span class="ts" style="left:'+rx(2,94)+'%;top:'+rx(8,70)+'%;font-size:'+rx(10,22)+'px;animation-duration:'+rx(1.4,2.8)+'s;animation-delay:-'+rx(0,3)+'s">✦</span>'})+CARTE(390,'glisse')],
 ["Étoiles filantes",'<div class="nuit fx"></div>'+rep(34,function(){var s=rx(1.5,3.2);return '<i class="pt" style="left:'+rx(1,98)+'%;top:'+rx(1,60)+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+rx(1.5,3.5)+'s;animation-delay:-'+rx(0,3)+'s"></i>'})+rep(5,function(i){return '<i class="fil" style="left:'+rx(0,45)+'%;top:'+rx(0,25)+'%;animation-delay:-'+(i*0.7)+'s"></i>'})+'<div style="position:absolute;left:0;top:236px;width:254px;height:308px;overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 45px);mask:linear-gradient(transparent,#000 45px)"><img class="pf zm" style="top:-10px" src="'+P(4)+'"></div>'+CARTE(118)],
 ["Vichy qui défile",'<div class="vichy fx"></div><div style="position:absolute;left:0;top:158px;width:254px;height:200px;overflow:hidden;border-top:3px solid #fff;border-bottom:3px solid #fff;z-index:3"><img class="pf zm" style="top:-80px" src="'+P(2)+'"></div>'+CARTE(16)+rep(7,function(i){return '<img class="flotte" src="'+CC(i)+'" style="left:'+(i%4*60+8)+'px;top:'+(i<4?376:452)+'px;width:'+rx(40,54)+'px;animation-duration:'+rx(1.8,3)+'s;animation-delay:-'+rx(0,3)+'s">'})],
 ["Pellicule de charms",'<div class="fx" style="background:#ffd9e6"></div><img class="pf" style="left:60px;top:160px;width:134px;height:384px" src="'+P(1)+'"><div class="lane" style="left:0"><div class="col" style="animation-duration:11s">'+rep(16,function(i){return '<img src="'+CC(i)+'">'})+'</div></div><div class="lane" style="right:0"><div class="col" style="animation-name:cv2;animation-duration:9s">'+rep(16,function(i){return '<img src="'+CC(i+3)+'">'})+'</div></div>'+CARTE(14)],
 ["Lampe à lave",'<div class="lave fx"></div><div class="goo">'+[["#ff6fa5",90,10,40,30,60],["#ffb36b",70,150,20,-40,80],["#b87bff",100,80,150,50,-70],["#ff6fa5",60,170,170,-50,-60],["#ffd36b",56,30,200,60,-80],["#b87bff",74,110,230,-30,-110]].map(function(b,i){return '<b style="background:radial-gradient(circle,'+b[0]+' 38%,transparent 70%);width:'+(b[1]*1.7)+'px;height:'+(b[1]*1.7)+'px;left:'+(b[2]-b[1]*.35)+'px;top:'+(b[3]-b[1]*.35)+'px;--dx:'+b[4]+'px;--dy:'+b[5]+'px;animation-duration:'+(4+i)+'s"></b>'}).join('')+'</div><img class="pf" style="top:310px;height:234px" src="'+P(5)+'">'+CARTE(150,'f3d')],
 ["Vagues",PF(3,'height:330px')+'<div class="w w1"></div><div class="w w2"></div><div class="w w3"></div><div class="mer"></div>'+CARTE(356,'bob')],
 ["Feu d'artifice",'<div class="fx" style="background:#120a22"></div>'+PF(1,'filter:brightness(.55) saturate(1.15)')+'<div class="fw fx"></div>'+CARTE(395)],
 ["Carte qui tombe",PF(4)+rep(26,function(){return '<i class="cf" style="z-index:30;left:'+rx(0,96)+'%;animation-duration:'+rx(3,5)+'s;animation-delay:-'+rx(0,5)+'s"><b style="background:'+["#ff5d8f","#ffd76a","#9ad0ff","#fff","#b5f2c8","#d8a6ff"][Math.floor(r()*6)]+';animation-duration:'+rx(1.5,2.5)+'s;animation-delay:-'+rx(0,2)+'s"></b></i>'})+CARTE(205,'tombe')],
 ["Tunnel",PF(2)+PF(2,'animation-delay:0s','tun')+PF(2,'animation-delay:-2s','tun')+PF(2,'animation-delay:-4s','tun')+'<div class="fx" style="background:radial-gradient(circle,transparent 45%,rgba(40,10,30,.45))"></div>'+CARTE(205)],
 ["Ballons",PF(3)+rep(7,function(i){return '<div class="bal" style="z-index:10;left:'+rx(0,80)+'%;--dx:'+Math.round(rx(-30,30))+'px;animation-duration:'+rx(8,12)+'s;animation-delay:-'+rx(0,11)+'s"><img src="'+CH+["coeurchrome","coeurgeleerose","coeurcristal","coeurgeleejaune"][i%4]+'.png"><i></i></div>'})+CARTE(16)],
 ["Rubans de charms",PF(4)+'<div class="belt" style="top:18px"><div>'+rep(30,function(i){return '<img src="'+CC(i%10)+'">'})+'</div></div><div class="belt r" style="top:468px"><div>'+rep(30,function(i){return '<img src="'+CC((i+4)%10)+'">'})+'</div></div>'+CARTE(208)],
 ["Pop de charms",'<div class="gd fx"></div><div style="position:absolute;left:0;top:124px;width:254px;height:180px;overflow:hidden;z-index:3"><img class="pf zm" style="top:-110px" src="'+P(1)+'"></div>'+rep(10,function(i){var top=i<6?rx(6,84):rx(456,500);return '<img class="pop" src="'+CC(i)+'" style="left:'+(i<6?i*40+4:(i-6)*60+10)+'px;top:'+top+'px;width:'+rx(36,50)+'px;animation-delay:-'+rx(0,3.4)+'s">'})+CARTE(322)]
];
var g=document.getElementById("g");
T.forEach(function(t,i){var c=document.createElement("div");c.className="case";
  c.innerHTML='<div class="tel"><div class="ecr">'+t[1]+'</div></div><div class="lab"><span class="num '+(t[2]||"")+'">'+(i+1)+'</span>'+t[0]+'</div>';
  c.onclick=function(){c.classList.toggle("non")};g.appendChild(c)});

function ajuste(){document.querySelectorAll('.carte .nom').forEach(function(n){var t=28;n.style.fontSize=t+'px';while(n.scrollWidth>n.clientWidth&&t>12){t-=.5;n.style.fontSize=t+'px'}})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(ajuste);ajuste();

/* feu d'artifice */
document.querySelectorAll('.fw').forEach(function(F){
  var cols=["#ff5d8f","#ffd76a","#9ad0ff","#fff","#b5f2c8","#d8a6ff","#ff9f43"];
  function burst(){
    if(F.closest('.tel').classList.contains('off'))return;
    var x=rx(50,204),y=rx(70,230),c=cols[Math.floor(Math.random()*cols.length)];
    var fus=document.createElement('i');fus.className='fwb';fus.style.cssText='left:'+x+'px;top:'+y+'px;background:#fff;width:2px;height:14px;border-radius:2px';
    F.appendChild(fus);
    var a=fus.animate([{translate:'0 '+(420-y)+'px',opacity:1},{translate:'0 0',opacity:1}],{duration:520,easing:'ease-out'});
    a.onfinish=function(){fus.remove();
      for(var i=0;i<22;i++){var p=document.createElement('i');p.className='fwb';p.style.left=x+'px';p.style.top=y+'px';p.style.background=c;F.appendChild(p);
        var ang=i/22*Math.PI*2,d=rx(40,78),dx=Math.cos(ang)*d,dy=Math.sin(ang)*d;
        var q=p.animate([{translate:'0 0',opacity:1},{translate:dx+'px '+dy+'px',opacity:1,offset:.55},{translate:(dx*1.12)+'px '+(dy+46)+'px',opacity:0}],{duration:1500,easing:'ease-out'});
        q.onfinish=(function(p){return function(){p.remove()}})(p)}
    };
  }
