body{margin:0;background:#F4F1EC;font-family:Jost,sans-serif;color:#1E1C1B;padding:0 16px 110px}
h1{font-weight:500;font-size:20px;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin:26px 0 6px}
p.s{text-align:center;margin:0 0 20px;font-size:14px;color:#6b6460}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:1200px;margin:auto}
.c{background:#fff;border-radius:16px;padding:18px 8px 12px;text-align:center;border:3px solid transparent;cursor:pointer;user-select:none}
.c.oui{border-color:#2E9E5B}
.c .w{font-size:36px;line-height:1.15;white-space:nowrap;overflow:hidden}
.c small{display:block;margin-top:8px;font-size:11px;color:#8a817a;letter-spacing:.08em}
.c.deja small:after{content:" · déjà dans le site";color:#2E9E5B}
.bas{position:fixed;left:0;right:0;bottom:0;background:#1E1C1B;color:#fff;display:flex;gap:14px;align-items:center;justify-content:center;padding:14px 16px}
.bas button{border:0;border-radius:99px;padding:12px 22px;background:#fff;color:#1E1C1B;font:500 13px Jost;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
</style></head><body><h1>Les écritures de « Loginail »</h1><p class="s">Touche celles que tu veux voir défiler, puis « Copier mon choix ».</p><div class="g" id="g"></div>
<div class="bas"><span id="n">0 choisie</span><button id="cp">Copier mon choix</button></div>
<script>const L=["Abril Fatface", "Allura", "Bagel Fat One", "Bebas Neue", "Bodoni Moda", "Bungee Shade", "Cherry Bomb One", "Cinzel", "Cinzel Decorative", "Climate Crisis", "Corben", "Cormorant Garamond", "DMSerif Display", "Dancing Script", "Fascinate", "Fredoka", "Gloock", "Great Vibes", "Italiana", "Lily Script One", "Limelight", "Lobster", "Monoton", "Pacifico", "Parisienne", "Permanent Marker", "Pinyon Script", "Playball", "Playfair Display", "Righteous", "Rubik Bubbles", "Satisfy", "Sedgwick Ave Display", "Shrikhand", "Silkscreen", "Sniglet", "Unifraktur Maguntia", "Yeseva One"],D=["Playfair Display", "Cinzel Decorative", "Bagel Fat One", "Italiana", "Cherry Bomb One", "Shrikhand", "Monoton", "Unifraktur Maguntia", "Cinzel", "Parisienne", "Permanent Marker"];let ch={};try{ch=JSON.parse(localStorage.getItem("ecr-loginail")||"{}")}catch(_){}
const g=document.getElementById("g"),maj=()=>{const n=Object.values(ch).filter(Boolean).length;document.getElementById("n").textContent=n+(n>1?" choisies":" choisie");try{localStorage.setItem("ecr-loginail",JSON.stringify(ch))}catch(_){}};
L.forEach(f=>{const d=document.createElement("div");d.className="c"+(D.includes(f)?" deja":"")+(ch[f]?" oui":"");d.innerHTML=`<div class="w" style="font-family:'${f}'">Loginail</div><small>${f}</small>`;d.onclick=()=>{ch[f]=!ch[f];d.classList.toggle("oui",ch[f]);maj()};g.appendChild(d)});maj();
document.getElementById("cp").onclick=()=>{navigator.clipboard.writeText("Écritures de Loginail : "+L.filter(f=>ch[f]).join(", ")).then(()=>{cp.textContent="Copié ✓";setTimeout(()=>cp.textContent="Copier mon choix",1500)})};</script></body></html>
