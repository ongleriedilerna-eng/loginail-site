<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boîte de réception · simulation</title>
<style>
/* Simulation : la boîte mail de la prothésiste (une boîte mail quelconque), avec le vrai e-mail Loginail dedans. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px -apple-system,system-ui,"Segoe UI",sans-serif;color:#111;background:#fff;-webkit-font-smoothing:antialiased}
.simu{position:fixed;top:8px;left:50%;transform:translateX(-50%);font:400 10px Jost,system-ui,sans-serif;letter-spacing:.2em;color:#6B625C;background:#fff;border:1px dashed rgba(30,28,27,.35);border-radius:999px;padding:5px 11px;z-index:9;white-space:nowrap}
.boite{padding:44px 18px 20px}
.boite h1{margin:0 0 14px;font:700 32px system-ui,sans-serif;letter-spacing:-.02em}
.msg{display:grid;grid-template-columns:12px 1fr;gap:10px;width:100%;text-align:left;border:0;background:none;border-bottom:1px solid #e6e6e6;padding:12px 0;cursor:pointer;font:inherit;color:inherit}
.msg i{width:10px;height:10px;border-radius:50%;background:#2f6fdb;margin-top:6px}
.msg.lu i{visibility:hidden}
.msg .h{display:flex;justify-content:space-between}
.msg b{font-weight:600}
.msg small{color:#8a8a8a;font-size:13px}
.msg .s{font-weight:500;margin-top:2px}
.msg .a{color:#8a8a8a;font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vieux{opacity:.55}
.lecture{position:fixed;inset:0;background:#fff;display:none;flex-direction:column}
.lecture.on{display:flex}
.haut{display:flex;align-items:center;gap:8px;padding:40px 14px 10px;border-bottom:1px solid #eee}
.haut button{border:0;background:none;color:#2f6fdb;font:17px system-ui,sans-serif;cursor:pointer;padding:4px}
.entete{padding:12px 18px;border-bottom:1px solid #eee}
.entete b{display:block;font-size:19px;margin-bottom:6px}
.entete span{color:#8a8a8a;font-size:13px}
iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div class="simu">SIMULATION · SA BOÎTE MAIL</div>
<div class="boite">
  <h1>Réception</h1>
  <button class="msg" id="m1"><i></i><div><div class="h"><b>Loginail</b><small>maintenant</small></div><div class="s">Bienvenue sur Loginail · confirmez votre adresse</div><div class="a">Plus qu’une étape : confirmez votre adresse e-mail, et votre espace pro est prêt.</div></div></button>
  <div class="msg vieux lu"><i></i><div><div class="h"><b>Fournisseur</b><small>hier</small></div><div class="s">Votre commande est expédiée</div><div class="a">Exemple d’ancien e-mail.</div></div></div>
  <div class="msg vieux lu"><i></i><div><div class="h"><b>Newsletter</b><small>lundi</small></div><div class="s">Les tendances ongles de la saison</div><div class="a">Exemple d’ancien e-mail.</div></div></div>
</div>
<div class="lecture" id="lecture">
  <div class="haut"><button id="retour">‹ Réception</button></div>
  <div class="entete"><b>Bienvenue sur Loginail · confirmez votre adresse</b><span>De : Loginail &lt;contact@loginail.fr&gt;<br>À : <span id="a"></span></span></div>
  <iframe src="mail-bienvenue.html" title="L’e-mail Loginail"></iframe>
</div>
<script>
try { const b = JSON.parse(localStorage.getItem("loginail-brouillon")); document.getElementById("a").textContent = b?.email || "vous"; } catch (e) {}
document.getElementById("m1").onclick = () => { document.getElementById("m1").classList.add("lu"); document.getElementById("lecture").classList.add("on"); };
document.getElementById("retour").onclick = () => document.getElementById("lecture").classList.remove("on");
</script>
</body>
</html>
