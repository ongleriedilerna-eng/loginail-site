<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loginail · Votre espace</title>
<meta name="theme-color" content="#F6F3EF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="polices.css" rel="stylesheet">
<style>
/* Après le lien reçu par e-mail : on range dans le coffre tout ce qu'elle a rempli (salon, prestations, horaires,
   style du site), puis « Votre espace est prêt » → l'espace pro. */
:root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--fond:#F6F3EF;--noir:#1E1C1B;--muted:#6B625C;--surface:#FBF9F6;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E7E2DC;font-family:Jost,sans-serif;color:var(--noir);-webkit-font-smoothing:antialiased;overflow:hidden}
#tel{max-width:480px;height:100vh;height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:var(--fond);display:flex;flex-direction:column;padding:calc(var(--sat) + 26px) 24px calc(var(--sab) + 22px)}
.logo{width:130px;align-self:center;flex:none}
.centre{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
h1{margin:0;font:200 34px/1.15 Jost,sans-serif}
p{margin:12px 0 0;font:300 15px/1.6 Jost,sans-serif;color:var(--muted)}
.recap{margin:26px auto 0;display:flex;flex-direction:column;gap:10px;text-align:left}
.recap div{display:flex;gap:12px;align-items:baseline;font:300 15px Jost,sans-serif}
.recap div::before{content:"";flex:none;width:12px;height:7px;border-left:1.4px solid;border-bottom:1.4px solid;transform:rotate(-45deg) translateY(-3px)}
.go{display:block;width:100%;border:0;border-radius:999px;padding:18px;background:var(--noir);color:var(--fond);font:500 13px Jost,sans-serif;letter-spacing:.2em;text-align:center;text-decoration:none;cursor:pointer}
.attente{width:42px;height:42px;margin:0 auto 22px;border:1.4px solid rgba(30,28,27,.15);border-top-color:var(--noir);border-radius:50%;animation:tourne 1s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
html.cadre{--sat:54px;--sab:20px}
html.cadre body{display:flex;align-items:center;justify-content:center;min-height:100vh}
html.cadre #tel{width:402px;height:874px;max-width:none;border-radius:55px;margin:0;box-shadow:0 0 0 12px #1b1b1d,0 0 0 14px #3a3a3c,0 40px 80px -30px rgba(30,28,27,.55);zoom:var(--z,1);flex:none}
.c-barre{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 34px 0 46px;font:600 16px -apple-system,system-ui,sans-serif;z-index:95;pointer-events:none}
.c-barre svg{height:12px;margin-left:6px;fill:currentColor}
.c-ile{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:19px;background:#000;z-index:96;pointer-events:none}
.c-maison{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--noir);opacity:.85;z-index:96;pointer-events:none}
</style>
</head>
<body>
<div id="tel">
  <svg class="logo" viewBox="0 -2 330 72" aria-label="Loginail" id="logo"></svg>
  <div class="centre" id="range"><div class="attente"></div><h1>Un instant…</h1><p>On range vos informations dans votre espace.</p></div>
  <div class="centre" id="pret" hidden><h1 id="titre">Votre espace est prêt.</h1><p>Tout ce que vous avez rempli y est déjà.</p><div class="recap" id="recap"></div></div>
  <div class="centre" id="perdu" hidden><h1>Ce lien ne marche plus.</h1><p>Il a peut-être déjà servi, ou il a plus d’une heure. Recommencez, on vous en envoie un nouveau.</p></div>
  <a class="go" id="ouvrir" hidden>OUVRIR MON ESPACE</a>
  <a class="go" id="recommencer" hidden>RECOMMENCER</a>
</div>
<script src="vendor/supabase.js"></script>
<script>
const IPHONE = location.search.includes("iphone") ? "?iphone" : "";
if (IPHONE) {
  document.documentElement.classList.add("cadre");
  document.getElementById("tel").insertAdjacentHTML("afterbegin", '<div class="c-barre"><span>9:41</span><span><svg viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="2"/><rect x="24" y="4" width="2" height="4" rx="1"/></svg></span></div><div class="c-ile"></div><div class="c-maison"></div>');
  const z = () => document.documentElement.style.setProperty("--z", Math.min(1, (innerHeight - 40) / 900, (innerWidth - 30) / 430).toFixed(3));
  z(); addEventListener("resize", z);
}
/* le logo */
const PHI = (1 + Math.sqrt(5)) / 2, r = [0, 1, 2, 3, 4, 5, 6].map(i => 10 * PHI ** i);
const W = r[4], H = Math.sqrt(r[6] ** 2 - r[5] ** 2), S = r[3], CY = (S + W - H) / 2;
const ONGLE = `M0 ${-H} A${r[6]} ${r[6]} 0 0 1 ${W} 0 L${W} ${S} A${r[4]} ${r[4]} 0 0 1 ${-W} ${S} L${-W} 0 A${r[6]} ${r[6]} 0 0 1 0 ${-H}Z`;
const PW = 150, PHt = PW / PHI;
document.getElementById("logo").innerHTML = `<g transform="scale(.5)"><rect x="0" y="5" width="225" height="120" rx="60" fill="#1E1C1B"/><path d="M172 21H215C254 21 282 42 282 65C282 88 254 109 215 109H172A44 44 0 0 1 172 21Z" fill="#1E1C1B"/><path d="M172 28H213C247 28 274 47 274 65C274 83 247 102 213 102H172A37 37 0 0 1 172 28Z" fill="#F3EEE8"/></g><text x="160" y="42" font-family="Jost,sans-serif" font-weight="300" font-size="22" letter-spacing="9" fill="#1E1C1B">LOGINAIL</text>`;

const $ = id => document.getElementById(id);
const coffre = supabase.createClient("https://scfhaombuptmrlkdhcsl.supabase.co", "sb_publishable_lYx1ZH0k3EFrUhZ3v0W8gw_yhGPOhbq");
/* 06/11 : on arrive dans la vraie appli (app.loginail.fr) */
$("ouvrir").href = (location.hostname === "app.loginail.fr" ? "../" : "../appli.html") + IPHONE;
$("recommencer").href = "index.html" + IPHONE;
const montre = (...ids) => ["range", "pret", "perdu", "ouvrir", "recommencer"].forEach(i => $(i).hidden = !ids.includes(i));

/* range le brouillon dans le coffre (une seule fois : ensuite on l'efface) */
async function range(user) {
  // le plus sûr d'abord : celui gardé dans le coffre (?b=…), puis celui du compte, puis celui de ce téléphone
  let b = null;
  try { const local = JSON.parse(localStorage.getItem("loginail-brouillon")); if (local) b = local; } catch (e) {}
  if (user.user_metadata?.brouillon) b = { ...(b || {}), ...user.user_metadata.brouillon };
  const bid = new URLSearchParams(location.search).get("b");
  if (bid) { const { data } = await coffre.rpc("prendre_brouillon", { bid }); if (data) b = { ...(b || {}), ...data }; }
  if (!b) return null;
  const { error: e1 } = await coffre.from("profils").update({
    prenom: b.prenom || null, nom_salon: b.nom || null, telephone: b.telephone || null,
    adresse: b.rue || null, code_postal: b.cp || null, ville: b.ville || null,
    place_id: b.placeId || null, latitude: b.position?.latitude ?? null, longitude: b.position?.longitude ?? null,
    site_style: b.style || 1, site_couleur: b.couleur || "noir", site_mode: b.mode || "jour",
    presentation: b.presentation || null,
  }).eq("id", user.id);
  if (e1) throw e1;
  // les prestations : seulement si l'espace n'en a pas encore (on ne double rien)
  const { count } = await coffre.from("prestations").select("id", { count: "exact", head: true });
  if (!count && b.prestations?.length) {
    const { error: e2 } = await coffre.from("prestations").insert(b.prestations.map((p, i) => ({ nom: p.nom, prix: p.prix ?? null, duree_min: p.duree, ordre: i })));
    if (e2) throw e2;
  }
  if (b.horaires) {
    const { error: e3 } = await coffre.from("horaires").upsert(b.horaires.map((h, j) => ({
      pro_id: user.id, jour: j, ouvert: !!h, debut: h?.d || "09:00", fin: h?.f || "18:00", pause_debut: h?.pd || null, pause_fin: h?.pf || null })));
    if (e3) throw e3;
  }
  /* 06/11 : son site va dans le coffre, avec son adresse (dilerna, dilerna-2…) : les clientes peuvent réserver */
  const { data: deja } = await coffre.from("sites").select("slug").maybeSingle();
  if (!deja) {
    const d = { ...b }; delete d.univers; delete d.exempleFictif; delete d._charmsU;
    const base = String(b.nom || b.prenom || "mon-salon").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 34) || "mon-salon";
    for (let n = 1; n <= 30; n++) {
      const slug = (n === 1 ? base : base + "-" + n).padEnd(3, "0");
      const { error } = await coffre.from("sites").insert({ pro_id: user.id, slug, donnees: d, en_ligne: true });   /* plus tard : en ligne seulement après l'abonnement (Stripe) */
      if (!error) break;
      if (!/duplicate|unique/i.test(error.message)) throw error;
    }
  }
  await coffre.auth.updateUser({ data: { brouillon: null } });
  try { localStorage.removeItem("loginail-brouillon"); } catch (e) {}
  return b;
}

/* simulation : rien n'est rangé pour de vrai, on montre seulement ce qu'elle verrait */
const SIMU = (() => { try { return localStorage.getItem("loginail-simu") === "1"; } catch (e) { return false; } })();
function recap(b) {
  const jours = (b.horaires || []).filter(Boolean).length;
  [b.nom && `Votre salon : ${b.nom}`,
   b.prestations?.length && `${b.prestations.length} prestation${b.prestations.length > 1 ? "s" : ""} avec vos prix`,
   jours && `Vos horaires : ${jours} jour${jours > 1 ? "s" : ""} par semaine`,
   "Votre site, avec le style et la couleur choisis",
  ].filter(Boolean).forEach(t => { const d = document.createElement("div"); d.textContent = t; $("recap").append(d); });
}
async function depart() {
  if (SIMU) {
    let b = null; try { b = JSON.parse(localStorage.getItem("loginail-brouillon")); } catch (e) {}
    if (b?.prenom) $("titre").textContent = `Votre espace est prêt, ${b.prenom}.`;
    if (b) recap(b);
    $("ouvrir").href = "appli-simu.html";
    montre("pret", "ouvrir"); return;
  }
  const { data: { session } } = await coffre.auth.getSession();
  if (!session) { montre("perdu", "recommencer"); return; }
  try {
    const b = await range(session.user);
    const { data: p } = await coffre.from("profils").select("prenom").eq("id", session.user.id).single();
    if (p?.prenom) $("titre").textContent = `Votre espace est prêt, ${p.prenom}.`;
    if (b) recap(b);
    montre("pret", "ouvrir");
  } catch (e) {
    $("range").innerHTML = "<h1>Petit souci.</h1><p>Vos informations ne se sont pas rangées. Vérifiez votre connexion, puis rechargez la page.</p>";
  }
}
/* le lien de l'e-mail arrive avec la connexion dans l'adresse : on laisse la bibliothèque la lire, puis on range */
let fait = false;
if (SIMU) { fait = true; depart(); }
coffre.auth.onAuthStateChange((ev, s) => { if (s && !fait) { fait = true; setTimeout(depart, 0); } });
setTimeout(() => { if (!fait) { fait = true; depart(); } }, 2500);
</script>
</body>
</html>
