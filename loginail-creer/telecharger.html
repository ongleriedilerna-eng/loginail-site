<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Loginail · Télécharger mon appli</title>
<meta name="theme-color" content="#F6EFEA">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* 27/11 (Marie : « je préfère que ce soit plus joli, avec des charms ») : même lien qu'avant, plus joli */
@font-face{font-family:Abril;src:url(../loginail-site/polices/AbrilFatface-400-latin.woff2) format("woff2");font-display:swap}
@font-face{font-family:Jost;font-weight:400;src:url(../loginail-site/polices/Jost-400-latin.woff2) format("woff2");font-display:swap}
@font-face{font-family:Jost;font-weight:500;src:url(../loginail-site/polices/Jost-500-latin.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0,#FBE3EA 0,#F6EFEA 70%);color:#1E1C1B;font:400 16px/1.5 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
.icone{position:relative;width:104px;height:104px;border-radius:26px;background:#1E1C1B;display:grid;place-items:center;box-shadow:0 26px 44px -18px rgba(60,20,40,.6);animation:arrive .7s cubic-bezier(.2,.8,.2,1) both}
.icone img{width:64px;height:64px}
.icone::before,.icone::after{content:"";position:absolute;inset:-10px;border-radius:34px;border:2px solid #E0628C;opacity:0;animation:onde 2s ease-out infinite}
.icone::after{animation-delay:1s}
@keyframes onde{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@keyframes arrive{from{opacity:0;transform:translateY(16px) scale(.9)}}
h1{margin-top:26px;font:400 clamp(30px,9vw,44px)/1.08 Abril,serif;letter-spacing:-.01em;animation:arrive .7s .1s cubic-bezier(.2,.8,.2,1) both}
h1 em{font-style:normal;color:#B03562}
p{margin-top:10px;color:#5E5550;font-size:16.5px;animation:arrive .7s .2s cubic-bezier(.2,.8,.2,1) both}
.points{display:inline-flex;gap:5px;margin-left:2px}
.points i{width:6px;height:6px;border-radius:50%;background:#E0628C;animation:pt 1.2s infinite}
.points i:nth-child(2){animation-delay:.2s}.points i:nth-child(3){animation-delay:.4s}
@keyframes pt{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
a#lien{display:inline-block;margin-top:28px;line-height:0;border-radius:12px;text-decoration:none;box-shadow:0 18px 34px -16px rgba(30,28,27,.6);animation:arrive .7s .3s cubic-bezier(.2,.8,.2,1) both}
.ch{position:fixed;pointer-events:none;filter:drop-shadow(0 10px 12px rgba(80,30,50,.22));animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
@media (prefers-reduced-motion:reduce){.icone,.icone::before,.icone::after,h1,p,a#lien,.ch,.points i{animation:none}}
a#lien img{display:block;height:57px;width:auto}
</style>
</head>
<body>
<img class="ch" src="../loginail-site/charms-mini/cerisedisco.webp" alt="" style="width:64px;left:8%;top:12%;rotate:-12deg">
<img class="ch" src="../loginail-site/charms-mini/saturne.webp" alt="" style="width:58px;right:8%;top:18%;rotate:10deg;animation-delay:-2s">
<img class="ch" src="../loginail-site/charms-mini/noeudcerise.webp" alt="" style="width:56px;left:10%;bottom:14%;rotate:6deg;animation-delay:-4s">
<img class="ch" src="../loginail-site/charms-mini/perle.webp" alt="" style="width:40px;right:12%;bottom:20%;animation-delay:-3s">
<div class="icone"><img src="../loginail-site/icone-appli.svg" alt="Loginail"></div>
<h1>Ton <em>appli</em> arrive</h1>
<p>On t’emmène sur l’App Store<span class="points" aria-hidden="true"><i></i><i></i><i></i></span></p>
<a id="lien" href="https://apps.apple.com/fr/iphone/search?term=Loginail"><img src="../loginail-site/badge-app-store-fr.svg" alt="Télécharger dans l’App Store" width="180" height="57"></a>
<script>
/* D85 (Marie : « j'ai pas à le recoder ») : ce lien se règle TOUT SEUL.
   On demande à Apple si fr.loginail.app est publiée : oui → sa fiche ; pas encore, ou Apple muet → recherche « Loginail ».
   Rien à changer le jour de la sortie. Apple n'est appelé que quand elle touche « Télécharger mon appli ». */
(() => {
  const APPLI = "fr.loginail.app", lien = document.getElementById("lien");
  let parti = false;
  const va = fiche => {
    if (parti) return;
    parti = true;
    if (fiche) lien.href = fiche;
    location.replace(lien.href);
  };
  setTimeout(() => va(), 2500);
  fetch(`https://itunes.apple.com/lookup?bundleId=${APPLI}&country=fr&_=${Date.now()}`)
    .then(r => r.json())
    .then(j => {
      const a = (j.results || []).find(x => x.bundleId === APPLI);
      va(a && /^https:\/\/apps\.apple\.com\//.test(a.trackViewUrl) ? a.trackViewUrl : null);
    })
    .catch(() => va());
})();
</script>
</body>
</html>
