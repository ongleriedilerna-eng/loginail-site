/* 09/11 (Marie) : LE PRÉSENTOIR, en 2 versions (3 ou 4 charms par ligne), plus petit, comme les emojis de l'iPhone.

   ———— (ancien commentaire :) les 3 finalistes pour poser les charms (le tiroir en verre, l'écran partagé, le présentoir), utilisables en plein écran.
   Toucher un charm = il s'ajoute ; le retoucher = il s'enlève (jamais deux fois le même).

  const leve = e => { if (!doigts.has(e.pointerId)) return; doigts.delete(e.pointerId);
    if (!doigts.size) { const r = ecr.getBoundingClientRect();
      if (mode === "glisse" && choisi && (dansPoub(e.clientX, e.clientY) || e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) M.enleve(choisi.dataset.n);
      mode = null; poub.classList.remove("on", "dessus"); ecr.classList.remove("tient"); }
    else if (mode === "pince") { mode = "attente"; } };   // un doigt reste : on attend qu'elle le lève (pas de saut)
  ecr.addEventListener("pointerup", leve); ecr.addEventListener("pointercancel", leve);
  ecr.addEventListener("wheel", e => { const t = e.target.closest(".st") || (horsJeu(e.target) ? null : choisi); if (!t) return; e.preventDefault(); if (e.shiftKey) t._r += e.deltaY > 0 ? 12 : -12; else t._s = Math.max(26, Math.min(190, t._s * (e.deltaY > 0 ? .92 : 1.08))); maj(t); }, { passive: false });
  return M;
}

/* ---------- le panneau : recherche, familles (image + nom), glisser à côté = famille suivante, glisser en bas = fermer ---------- */
function panneau(e, M, opts) {
  const p = e.querySelector(".panneau"); let fam = FAV.length ? "Vos favoris" : "Cœurs";
  p.innerHTML = `<div class="poi"><i></i></div><label class="cherche">${LOUPE}<input placeholder="Rechercher un charm" autocomplete="off"></label><div class="fams">${FAMS.map(f => famBtn(f, fam)).join("")}</div>${opts.pages ? `<div class="nomf"></div><div class="pagesP"></div><div class="ptsP"></div>` : `<div class="zoneG"><div class="g4"></div></div>`}`;
  const inp = p.querySelector("input"), famsE = p.querySelector(".fams");
  const posePour = () => { const h = p.classList.contains("ferme") ? 0 : p.offsetHeight; return [e.clientWidth / 2 + (Math.random() * 80 - 40), Math.max(110, (e.clientHeight - h) * .5) + (Math.random() * 50 - 25)]; };
  const allume = () => { famsE.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.fam === fam)); const b = famsE.querySelector(".on"); if (b) famsE.scrollTo({ left: b.offsetLeft - famsE.clientWidth / 2 + b.offsetWidth / 2, behavior: "smooth" }); };
  let remplit;
  if (!opts.pages) {
    const g = p.querySelector(".g4");
    remplit = (sens) => { const q = inp.value.trim(); const go = () => { g.innerHTML = (q ? cherche(q) : liste(fam)).map(chHtml).join("") || `<p class="rien">Aucun charm</p>`; g.scrollTop = 0; M.maj(); };
      if (sens) { g.classList.add(sens > 0 ? "glisseG" : "glisseD"); setTimeout(() => { go(); g.style.transition = "none"; g.classList.remove("glisseG", "glisseD"); g.classList.add(sens > 0 ? "glisseD" : "glisseG"); requestAnimationFrame(() => { g.style.transition = ""; g.classList.remove("glisseG", "glisseD"); }); }, 180); } else go(); allume(); };
    /* glisser à gauche / à droite sur les charms = la famille d'à côté */
    let x0 = null, y0 = 0;
    g.addEventListener("pointerdown", ev => { x0 = ev.clientX; y0 = ev.clientY; });
    g.addEventListener("pointerup", ev => { if (x0 == null) return; const dx = ev.clientX - x0, dy = ev.clientY - y0; x0 = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && !inp.value) { const k = FAMS.findIndex(f => f[0] === fam), n = (k + (dx < 0 ? 1 : -1) + FAMS.length) % FAMS.length; fam = FAMS[n][0]; remplit(dx < 0 ? 1 : -1); g._glisse = 1; } });
    g.addEventListener("click", ev => { if (g._glisse) { g._glisse = 0; return; } const b = ev.target.closest(".ch"); if (!b) return; const [x, y] = posePour(); M.bascule(b.dataset.n, x, y); });
  } else {
    /* le présentoir : des pages de 8, une famille après l'autre ; on feuillette (la famille change toute seule) */
    const pg = p.querySelector(".pagesP"), pts = p.querySelector(".ptsP"), nomf = p.querySelector(".nomf"); let pages = [];
    remplit = () => { const q = inp.value.trim(); const parPage = opts.cols * (opts.rows || 2);
      pages = []; (q ? [["Résultats", cherche(q)]] : FAMS.map(([f]) => [f, liste(f)])).forEach(([f, l]) => { if (!l.length && (f === "Vos favoris" || f === "Sur votre site")) { pages.push([f, []]); return; } for (let k = 0; k < l.length; k += parPage) pages.push([f, l.slice(k, k + parPage)]); });
      if (!pages.length) pages = [["Résultats", []]];
      pg.innerHTML = pages.map(([f, l]) => `<div class="pageP">${l.map(chHtml).join("") || `<p class="rien">${f === "Vos favoris" ? "Restez appuyée sur un charm pour l’ajouter à vos favoris" : f === "Sur votre site" ? "Les charms posés sur votre site s’afficheront ici" : "Aucun charm"}</p>`}</div>`).join("");
      const k0 = q ? 0 : pages.findIndex(x => x[0] === fam); const va = () => { pg.style.scrollSnapType = "none"; pg.scrollLeft = Math.max(0, k0) * pg.clientWidth; pg.style.scrollSnapType = ""; majPage(); };
      va(); requestAnimationFrame(va); M.maj(); };
    const majPage = () => { const k = Math.round(pg.scrollLeft / (pg.clientWidth || 1)), cur = pages[k] || pages[0]; nomf.textContent = cur[0];
      const memes = pages.filter(x => x[0] === cur[0]), i = memes.indexOf(cur); pts.innerHTML = memes.map((_, n) => `<i class="${n === i ? "on" : ""}"></i>`).join("");
      if (!inp.value.trim()) { fam = cur[0]; } allume(); };
    pg.addEventListener("scroll", () => { cancelAnimationFrame(pg._r); pg._r = requestAnimationFrame(majPage); }, { passive: true });
    /* rester appuyée sur un charm = favori (il va dans « Vos favoris », l'étoile) */
    pg.addEventListener("pointerdown", ev => { const b = ev.target.closest(".ch"); if (!b) return; clearTimeout(b._t); b._t = setTimeout(() => { b._long = 1; const n = b.dataset.n, i = FAV.indexOf(n);
        if (i >= 0) FAV.splice(i, 1); else FAV.unshift(n); try { localStorage.setItem("charmsFavoris", JSON.stringify(FAV)); } catch (x) {}
        document.querySelectorAll(`.ch[data-n="${n}"]`).forEach(c => c.classList.toggle("fav", i < 0)); bulle(i < 0 ? "Ajouté à vos favoris ★" : "Retiré de vos favoris"); navigator.vibrate?.(15); }, 480); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(t => pg.addEventListener(t, ev => { const b = ev.target.closest?.(".ch"); if (b) clearTimeout(b._t); }));
    pg.addEventListener("contextmenu", ev => ev.preventDefault());
    pg.addEventListener("click", ev => { if (Date.now() - (p._ferme || 0) < 400) return; const b = ev.target.closest(".ch"); if (!b) return; if (b._long) { b._long = 0; return; } const [x, y] = posePour(); M.bascule(b.dataset.n, x, y); });
  }
  famsE.onclick = ev => { const b = ev.target.closest("[data-fam]"); if (!b) return; fam = b.dataset.fam; inp.value = ""; remplit(); };
  inp.oninput = () => remplit();
  inp.onfocus = () => p.classList.add("cherchant"); inp.onblur = () => setTimeout(() => p.classList.remove("cherchant"), 150);
  inp.setAttribute("enterkeyhint", "search"); inp.addEventListener("keydown", ev => { if (ev.key === "Enter") inp.blur(); });
  /* glisser le panneau vers le bas = le fermer (le présentoir ne défile que de côté, donc pas de confusion) */
  let y0 = null, x0 = 0;
  p.addEventListener("pointerdown", ev => { if (ev.target.closest("input")) return; y0 = ev.clientY; x0 = ev.clientX; });
  p.addEventListener("pointermove", ev => { if (y0 == null) return; const d = ev.clientY - y0; if (d > 10 && d > Math.abs(ev.clientX - x0) * 1.3) p.style.transform = `translateY(${d}px)`; });
  const fin = ev => { if (y0 == null) return; const d = ev.clientY - y0, dx = Math.abs(ev.clientX - x0); y0 = null; p.style.transform = "";
    if (d > 60 && d > dx * 1.3) { p.classList.add("ferme"); opts.ferme && opts.ferme(); p._ferme = Date.now(); } };
  p.addEventListener("pointerup", fin); p.addEventListener("pointercancel", fin);
  remplit(); return { ouvre: () => { p.classList.remove("ferme"); remplit(); } };
}

/* ---------- le présentoir 6×3 (choisi par Marie) ---------- */
const VERSIONS = [{ cols: 6, rows: 3, h: "48px", pad: "4px" }];   // 09/11 : 6×3 CHOISI (si les tests ne vont pas : 5×4, rows 4, h 46px)
document.getElementById("ecrans").innerHTML = VERSIONS.map((v, k) => `<div class="ecr on" id="e${k}" style="--cols:${v.cols};--rows:${v.rows};--h:${v.h};--pad:${v.pad}"><div class="defileSite"><div class="pageSite">${VRAI ? `<div class="vraiSite"><iframe id="vrai" title="Votre site" src="loginail-creer/pret.html?v=1311j&nouveau&public&charms=0"></iframe><div class="attente"></div></div><div class="espace"></div>` : `<img src="${SITE}" alt="">`}<div class="calque"></div></div></div>
  <div class="poubelle verre"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="#1E1C1B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <button class="btnBas verre" data-ouvre hidden style="left:30%">＋ CHARMS</button><button class="btnBas" data-valider hidden style="left:72%;background:#1E1C1B;color:#fff;border:0">VALIDER</button><div class="panneau blanc presentoir"></div></div>`).join("");
const e = document.getElementById("e0"), M = moteur(e), b = e.querySelector("[data-ouvre]"), val = e.querySelector("[data-valider]"); POSES = () => M.poses();
const P = panneau(e, M, { pages: true, cols: 6, rows: 3, ferme: () => { b.hidden = false; val.hidden = false; } });

/* valider : 12 maximum ; sinon les charms se mettent à bouger comme sur son site, et c'est fini */
val.onclick = () => {

  document.getElementById("fini").hidden = false; };
document.querySelector("[data-modifier]").onclick = () => { document.getElementById("fini").hidden = true; e.classList.remove("finie"); document.getElementById("explique").style.opacity = 1; e.querySelectorAll(".st").forEach(s => s.classList.remove("flotte")); };
document.querySelector("[data-activer]").onclick = () => {
  if (!VRAI) { bulle("(maquette) Ici : le paiement, puis son site est en ligne"); return; }
  /* ses charms sont enregistrés dans son brouillon, puis « Activer mon site » */
  const cq = e.querySelector(".calque"), w = cq.clientWidth;
  try { const b = JSON.parse(localStorage.getItem("loginail-brouillon"));
    b.stickers = [...cq.querySelectorAll(".st")].filter(x => x.dataset.n).map(x => ({ n: x.dataset.n, x: +(parseFloat(x.style.left) / w * 100).toFixed(2), y: Math.round(parseFloat(x.style.top)), s: Math.round(x._s), r: Math.round(x._r || 0), w }));
    b.charms = []; localStorage.setItem("loginail-brouillon", JSON.stringify(b)); } catch (x) {}
  if (APPLI) { renvoieAppli(); return; }
  location.href = "loginail-creer/pret.html?activer"; };
if (APPLI) { const ba = document.querySelector("[data-activer]"); if (ba) ba.textContent = "ENREGISTRER MES CHARMS"; }
/* son vrai site : la page défile, la fenêtre du site suit (les charms restent accrochés au bon endroit) */
if (VRAI) { const f = document.getElementById("vrai"), dz = e.querySelector(".defileSite"), es = e.querySelector(".espace"), vs = e.querySelector(".vraiSite");
  const boite = () => { try { return f.contentDocument.querySelector(".ecran .defile"); } catch (x) { return null; } };
  const mesure = () => { const d = boite(); if (!d) return; vs.style.setProperty("--hEcr", dz.clientHeight + "px"); es.style.height = Math.max(0, d.scrollHeight - d.clientHeight) + "px"; };
  const habille = () => { try { const D = f.contentDocument; if (!D || !D.head || D.getElementById("lgnPres")) return; const st = D.createElement("style"); st.id = "lgnPres";
      st.textContent = ".pret,.langues,.lgn-st,.ch-couche{display:none!important}.defile{scroll-behavior:auto!important}html{scrollbar-width:none}::-webkit-scrollbar{display:none}"; D.head.appendChild(st); } catch (x) {} };
  /* 13/11 nuit (Marie : « Votre site arrive », c'est long) : on montre le site dès qu'il est dessiné, sans attendre toutes ses images */
  const guette = setInterval(() => { if (!boite()) return; clearInterval(guette); habille(); mesure(); setTimeout(() => vs.classList.add("pret"), 150); }, 80);
  f.onload = () => { habille(); [300, 1200, 3000, 6000].forEach(t => setTimeout(mesure, t)); setTimeout(() => vs.classList.add("pret"), 200); };
  dz.addEventListener("scroll", () => { const d = boite(); if (d) d.scrollTop = dz.scrollTop; }, { passive: true });
  addEventListener("resize", mesure); }
/* tout effacer (avec une question avant) */
document.getElementById("toutEffacer").onclick = () => { if (M.n() || e.querySelector(".calque .eto")) document.getElementById("confirme").hidden = false; };
/* 13/11 (Marie) : après le 1er charm, on montre EN GRAND le geste pour l'agrandir ; puis qu'on peut en poser partout dans le site */
function astuceCharm(quoi) { let a = document.getElementById("astuceC"); if (!a) { a = document.createElement("div"); a.id = "astuceC"; a.className = "astuceC"; document.body.appendChild(a); }
  a.innerHTML = quoi === "taille" ? '<span class="dg"><i></i><i></i></span><span>Écartez deux doigts pour l’agrandir<small>ou tournez-les pour le pencher</small></span>'
    : '<span class="fl"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 4v16M6 14l6 6 6-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Descendez dans votre site<small>vous pouvez poser des charms partout</small></span>';
  const ex = document.getElementById("explique"); if (ex) ex.style.opacity = 0;
  a.classList.add("on"); clearTimeout(a._t); a._t = setTimeout(() => a.classList.remove("on"), 5200); }
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
{ const aj0 = M.ajoute; let nb = 0; M.ajoute = (...a) => { const deja = M.a(a[0]), r = aj0(...a); if (!deja) { nb++; if (nb === 1) setTimeout(() => astuceCharm("taille"), 500); if (nb === 3) setTimeout(() => astuceCharm("partout"), 500); } return r; }; }
{ const pn = document.querySelector(".ecr.on .panneau") || document.querySelector(".panneau"); if (pn) pn.appendChild(document.getElementById("etoP")); }   /* 13/11 nuit : Étoiles en bas à gauche, juste au-dessus des charms */
document.getElementById("etoP").onclick = ev => { if (ev.target.closest("#etoPX")) M.enleveEtoiles(); else M.etoiles(); };

document.querySelector("#confirme [data-non]").onclick = () => document.getElementById("confirme").hidden = true;
