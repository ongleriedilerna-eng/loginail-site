<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Loginail</title>
<script>
/* loginail.fr/nom-du-salon (lien des SMS, des e-mails, de la carte de visite)
   → le site de la prothésiste. GitHub Pages renvoie cette page pour toute adresse inconnue. */
(function () {
  var p = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
  try { p = decodeURIComponent(p); } catch (e) {}
  if (/^[a-z0-9-]{3,40}$/.test(p)) {
    location.replace("/loginail-creer/pret.html?public&s=" + p + location.hash);
  }
})();
</script>

  a{color:inherit;font-weight:600}
  p{line-height:1.5}
</style>
</head>
