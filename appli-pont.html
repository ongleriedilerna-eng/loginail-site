<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loginail</title>
<style>html,body{margin:0;height:100%;background:#F6F3EF;font-family:Jost,-apple-system,sans-serif;color:#6a625b;display:flex;align-items:center;justify-content:center;font-size:14px}</style>
</head><body>Un instant…
<script>
/* 09/11 (Marie) : le pont entre l'appli (app.loginail.fr) et les pages de loginail.fr qui changent son site
   (cartes à glisser, personnalisation, présentoir des charms).
   L'appli envoie son site (son brouillon) ici ; on le range, puis on ouvre la bonne page. À la fin, ces pages renvoient le site modifié à l'appli. */
const OK = ["https://app.loginail.fr", "capacitor://localhost", location.origin];   /* 14/11 : + l'appli iPhone */
const PAGES = { style: "coups-de-coeur.html?vrai&appli", perso: "maquette-perso.html", charms: "charms-presentoir.html?vrai&appli" };
/* 26/11 (Marie) : « Personnaliser mon site » dans l'appli = 4 lignes ; En-tête, Fond et Écriture ouvrent Personnaliser directement sur leur onglet (?onglet=, que loginail-creer/personnaliser.html lit déjà) ; Charms = la pose des charms */
const ETAPES = { entete: "entete", fond: "fond", ecriture: "ecriture" };
const p0 = new URLSearchParams(location.search).get("p") || "perso", etape = ETAPES[p0] || "";
const ou = (etape ? "perso" : p0).replace(/^style$/, "perso");   /* 14/11 : plus de cartes à glisser */
addEventListener("message", m => {
  if (!OK.includes(m.origin) || !m.data || m.data.loginail !== "brouillon" || !m.data.br || recu) return;
  recu = true;
  try { localStorage.setItem("loginail-brouillon", JSON.stringify(m.data.br)); } catch (e) { document.body.textContent = "Pas assez de place sur ce téléphone."; return; }
  const b = m.data.br;
  if (ou === "perso") {
    const f = b.arrondi ? "&arrondi=1" : b.coffin ? "&coffin=1" : b.epure ? "&epure=1" : "";
    const q = new URLSearchParams({ style: b.style || 1, couleur: b.couleur || "noir", mode: "jour", police: b.police || "elegante", paillettes: b.paillettes || "non" });
    if (b.fond) q.set("fond", b.fond);
    /* 28/11 (Marie : « je clique sur un truc, ça bug, je mets valider ça valide pas, j'ai fini mon site ça finit pas ») : depuis l'appli, son site EXISTE déjà →
       jamais la démo « Créer le mien » (look Sirène) : elle remplaçait son site par le « classique » au 1er toucher, rechargeait la page (son choix perdu)
       et « J'ai fini mon site » ne renvoyait rien à l'appli. ?ouverture=0 = Personnaliser s'ouvre directement sur SON site. */
    location.replace("maquette-perso.html?v=1511s&vrai=1&appli=1&ouverture=0" + (etape ? "&onglet=" + etape : "") + "&src=" + encodeURIComponent("loginail-creer/pret.html?v=1511m&nouveau&essai&" + q.toString() + f));
  } else location.replace(PAGES[ou] || PAGES.perso);
});
/* on dit à l'appli qu'on est prêt à recevoir son site */
let recu = false; const dis = () => { if (recu) return; try { parent.postMessage({ loginail: "pret" }, "*"); } catch (e) {} setTimeout(dis, 800); }; dis();   /* on redemande tant que l’appli n’a pas répondu */
</script>
</body></html>
