<style>
/* 08/11 (Marie) : PROTOTYPE « cartes à glisser ».
   0) « Quel site vous ressemble ? » (sur une ligne, « ressemble » change d'écriture comme « briller ») : deux rectangles identiques.
   1) des propositions de SON site, sans fin, en grand, façon Tinder (✕ / ♥), elle regarde ses coups de cœur quand elle veut.
   2) ses coups de cœur en carrousel (le site au milieu, les voisins à gauche et à droite), puis la personnalisation (maquette-perso.html). */
:root{--noir:#1E1C1B;--fond:#F6F3EF;--muted:#6B625C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#E7E2DC;font-family:Jost,sans-serif;color:var(--noir);overflow:hidden;touch-action:pan-x pan-y}
button{font:inherit;color:inherit;cursor:pointer}
#tel{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--fond);overflow:hidden}
#ambiance{position:absolute;inset:0;opacity:0;transition:opacity .5s;overflow:hidden;pointer-events:none}
#ambiance.on{opacity:.24}
#ambiance>.f100{position:absolute!important;inset:0!important}
#ambiance .tuile{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important}
.ecran{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 16px);opacity:0;pointer-events:none;transition:opacity .35s}
.ecran.on{opacity:1;pointer-events:auto}
.titre{margin:6px 0 0;font:300 24px/1.2 Jost,sans-serif;text-align:center;white-space:nowrap;letter-spacing:-.01em}
.mot{display:inline-block;position:relative;white-space:nowrap;transition:opacity .2s;font-weight:400}.mot.chg{opacity:0}
.sous{margin:6px 0 0;text-align:center;font:300 13.5px/1.5 Jost,sans-serif;color:var(--muted)}
.pts{display:flex;gap:4px;justify-content:center}.pts i{width:22px;height:3px;border-radius:2px;background:rgba(30,28,27,.15)}.pts i.on{background:var(--noir)}
/* 0 · deux rectangles identiques */
.cartes2{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:12px;margin-top:16px;min-height:0}
.carte2{border:0;border-radius:24px;background:#E2DBD3 center/cover;position:relative;overflow:hidden;padding:0;min-height:0;transition:transform .2s}
.carte2:active{transform:scale(.98)}
.carte2 span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.26);color:#fff;font:500 21px Jost,sans-serif;letter-spacing:.22em;text-transform:uppercase;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.carte2 span small{font:300 12px Jost,sans-serif;letter-spacing:.04em;text-transform:none;opacity:.95}
.liens{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lien{border:1px solid rgba(30,28,27,.18);border-radius:999px;background:#fff;padding:12px 6px;font:400 13px Jost,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--noir)}
/* 1 · le paquet, en grand */
.tete{display:flex;align-items:center;justify-content:space-between}
#paquet{padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
.barreT{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 6px}
.marque{display:flex;align-items:center;border:0;background:none;padding:4px 0;font:500 11.5px Jost,sans-serif;letter-spacing:.32em}
.marque svg{height:16px;width:auto}
.compte{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 4px;font:500 15px Jost,sans-serif}
.compte svg{width:22px;height:22px}
.consigne{position:absolute;inset:0 0 86px;z-index:150;display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column;border-radius:6px;background:var(--fond);font:400 30px/1.15 Jost,sans-serif;text-align:center;letter-spacing:-.01em;pointer-events:none;transition:opacity .6s}
.consigne svg{width:34px!important;height:34px!important}
.consigne.part{opacity:0}
.glisse{position:absolute;left:50%;top:44%;z-index:160;translate:-50% 0;display:flex;align-items:center;gap:10px;border-radius:999px;padding:10px 18px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 22px -12px rgba(0,0,0,.35);color:#1E1C1B;font:400 13px Jost,sans-serif;letter-spacing:.06em;opacity:0;transition:opacity .4s;pointer-events:none}
.glisse.on{opacity:1}
#retourB{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:rgba(246,243,239,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#retourB>div{width:min(310px,86vw);border-radius:26px;background:rgba(255,255,255,.94);padding:28px 22px 16px;text-align:center;box-shadow:0 24px 50px -26px rgba(0,0,0,.45)}
#retourB h3{margin:0;font:400 26px Jost,sans-serif}#retourB p{margin:8px 0 20px;font:300 14px/1.5 Jost,sans-serif;color:var(--muted)}
#retourB .noirB{width:100%;border:0;border-radius:999px;background:#1E1C1B;color:#fff;padding:16px;font:500 12px Jost,sans-serif;letter-spacing:.16em}
#retourB .lienB{border:0;background:none;padding:14px 10px 6px;font:400 13px Jost,sans-serif;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.verre{border:1px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 14px;font:400 13px Jost,sans-serif;box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
.compte.hop{animation:hop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes hop{50%{transform:scale(1.18)}}
.zoneW{position:relative;flex:1;margin:4px 0 0;min-height:0;padding-bottom:86px}.zone{bottom:86px!important}
.consigne{left:50%!important;right:auto!important;translate:-50% 0;height:calc(100% - 86px);aspect-ratio:390/820;max-width:100%}.zone{position:absolute;inset:0}
.carte{position:absolute;left:50%;top:0;height:100%;aspect-ratio:390/820;max-width:100%;margin-left:0;translate:-50% 0;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 10px 30px -18px rgba(30,28,27,.25);transition:transform .35s cubic-bezier(.3,1.1,.4,1),opacity .35s;will-change:transform}
.carte iframe{position:absolute;top:-1px;left:-1px;width:390px;height:780px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.carte .prise{position:absolute;inset:0;touch-action:none;cursor:grab}
.carte .info{position:absolute;left:0;right:0;top:0;padding:14px 12px 30px;background:linear-gradient(rgba(0,0,0,.35),transparent);display:flex;flex-wrap:wrap;gap:5px;justify-content:center;pointer-events:none}
.carte .info span{border-radius:999px;background:rgba(255,255,255,.9);padding:4px 10px;font:400 11px Jost,sans-serif}
.tampon{position:absolute;top:64px;padding:6px 14px;border:3px solid;border-radius:12px;font:600 24px Jost,sans-serif;letter-spacing:.1em;opacity:0;pointer-events:none;background:rgba(255,255,255,.88)}
.tampon.oui{left:18px;transform:rotate(-14deg);color:var(--noir)}.tampon.non{right:18px;transform:rotate(14deg);color:#8A847E}
.carte.dessous{transform:scale(.97);opacity:0}
.carte.cache{opacity:0}
/* les boutons ✕ et ♥ posés sur la carte, comme Tinder */
.vote{position:absolute;left:0;right:0;bottom:4px;z-index:200;display:flex;justify-content:center;align-items:center;gap:34px;pointer-events:none}
.vote button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(30,28,27,.08);background:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 20px -10px rgba(30,28,27,.35);display:grid;place-items:center;transition:transform .15s}
.vote button:active{transform:scale(.88)}
.vote.attente button{opacity:.35;pointer-events:none}
.vote svg{width:30px;height:30px}
.voirC{margin-top:12px;align-self:center}
/* 2 · coups de cœur en carrousel */
.carrou{--w:260px;--h:500px;flex:1;display:flex;align-items:center;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -18px 8px;padding:0 calc(50% - var(--w) / 2);scrollbar-width:none;min-height:0}
.carrou::-webkit-scrollbar{display:none}
.slide{flex:none;width:var(--w);height:var(--h);scroll-snap-align:center;position:relative;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 14px 28px -16px rgba(0,0,0,.5);transition:transform .12s,opacity .12s}
.slide iframe{position:absolute;top:0;left:0;width:390px;border:0;transform-origin:0 0;pointer-events:none}
.slide .prise{position:absolute;inset:0;touch-action:pan-x}
.ptsC{display:flex;gap:5px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}.ptsC i{width:6px;height:6px;border-radius:50%;background:rgba(30,28,27,.2);transition:all .25s}.ptsC i.on{width:18px;border-radius:3px;background:var(--noir)}
.duo{display:flex;gap:10px}
.autres{display:block;margin:10px auto 0;border-radius:999px;padding:10px 18px;font:400 13px Jost,sans-serif}
.go{flex:1;border:0;border-radius:999px;background:var(--noir);color:var(--fond);padding:16px;font:500 12.5px Jost,sans-serif;letter-spacing:.2em}
.maquette{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:10px;z-index:300;font:400 9px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;background:var(--noir);color:#fff;padding:3px 7px;border-radius:999px;opacity:.5}
html.vrai .maquette{display:none}
</style><style id="plein-1311">
/* 13/11 (Marie) : les cartes à glisser prennent TOUT l'écran ; « ‹ LOGINAIL » et le cœur 0 / 5 se posent par-dessus */
#paquet{padding:0!important}

#paquet .zoneW{margin:0!important;padding-bottom:0!important}

#paquet .consigne{inset:0!important;left:0!important;translate:none!important;width:100%!important;height:100%!important;aspect-ratio:auto!important;max-width:none!important;border-radius:0!important}
#paquet .vote{bottom:calc(env(safe-area-inset-bottom) + 16px)}
/* pas de zoom de l'écran au double appui */
html,body{touch-action:manipulation}
</style>
