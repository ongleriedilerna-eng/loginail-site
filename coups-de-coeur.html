<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Coups de cœur · prototype</title>
<link href="loginail-creer/polices.css" rel="stylesheet">
<style>
/* 08/11 (Marie) : PROTOTYPE « cartes à glisser ». 0) classique ou ouf ? 1) des propositions de SON site, elle garde (♥) ou pas (✕),
   2) à la fin, ses coups de cœur, elle en choisit un et le personnalise (maquette-perso.html). Chaque carte = le vrai rendu (pret.html?public). */
:root{--noir:#1E1C1B;--fond:#F6F3EF;--muted:#6B625C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E7E2DC;font-family:Jost,sans-serif;color:var(--noir);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#tel{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--fond);overflow:hidden}
.ecran{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 18px);opacity:0;pointer-events:none;transition:opacity .4s}
.ecran.on{opacity:1;pointer-events:auto}
h1{margin:6px 0 0;font:500 34px/1.02 "Cormorant Garamond",serif;text-align:center}
.sous{margin:8px 0 0;text-align:center;font:300 14px/1.5 Jost,sans-serif;color:var(--muted)}
.pts{display:flex;gap:4px;justify-content:center}.pts i{width:22px;height:3px;border-radius:2px;background:rgba(30,28,27,.15)}.pts i.on{background:var(--noir)}
/* 0 · classique ou ouf */
.cartes2{flex:1;display:flex;flex-direction:column;gap:12px;margin-top:18px;min-height:0}
.carte2{flex:1;border:0;border-radius:24px;background:center/cover;position:relative;overflow:hidden;padding:0;transition:transform .2s}
.carte2:active{transform:scale(.98)}
.carte2 span{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font:500 19px "Cormorant Garamond",serif;text-align:center}
.carte2 span small{display:block;font:300 12px Jost,sans-serif;opacity:.9;margin-top:2px}
.deux{margin-top:12px;border:0;background:none;font:400 14px Jost,sans-serif;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
/* 1 · le paquet */
.tete{display:flex;align-items:center;justify-content:space-between}
.tete b{font:500 10.5px Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase}
.compte{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;padding:7px 13px;font:500 13px Jost,sans-serif;box-shadow:0 4px 12px -6px rgba(0,0,0,.3)}
.compte i{font-style:normal;color:var(--noir)}
.compte.hop{animation:hop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes hop{50%{transform:scale(1.25)}}
.zone{position:relative;flex:1;margin:14px 0 10px;min-height:0}
.carte{position:absolute;left:50%;top:0;height:100%;aspect-ratio:390/760;max-width:100%;transform:translateX(-50%);border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 18px 34px -18px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.3,1.1,.4,1),opacity .35s;will-change:transform}
.carte iframe{position:absolute;top:0;left:0;width:390px;height:760px;border:0;transform-origin:0 0;pointer-events:none}
.carte .prise{position:absolute;inset:0;touch-action:none;cursor:grab}
.carte .info{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.6));display:flex;flex-wrap:wrap;gap:5px;justify-content:center;pointer-events:none}
.carte .info span{border-radius:999px;background:rgba(255,255,255,.92);padding:4px 10px;font:400 11px Jost,sans-serif}
.tampon{position:absolute;top:26px;padding:6px 14px;border:3px solid;border-radius:12px;font:600 22px Jost,sans-serif;letter-spacing:.1em;opacity:0;pointer-events:none;background:rgba(255,255,255,.85)}
.tampon.oui{left:18px;transform:rotate(-14deg);color:var(--noir)}.tampon.non{right:18px;transform:rotate(14deg);color:#8A847E}
.carte.dessous{transform:translateX(-50%) scale(.94) translateY(12px);opacity:.9}
.carte.cache{opacity:0}
.vote{display:flex;justify-content:center;align-items:center;gap:26px}
.vote button{width:62px;height:62px;border-radius:50%;border:0;background:#fff;font-size:24px;box-shadow:0 8px 20px -8px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.vote button:active{transform:scale(.9)}
.vote .oui{background:var(--noir);color:#fff}
.vote .petit{width:46px;height:46px;font-size:17px}
.astuce{margin:8px 0 0;text-align:center;font:300 12px Jost,sans-serif;color:var(--muted)}
/* voir en grand */
#grand{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
#grand.on{opacity:1;pointer-events:auto}
#grand iframe{width:100%;height:100%;border:0}
#grand .bas{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;justify-content:center;gap:22px}
#grand .bas button{width:58px;height:58px;border-radius:50%;border:0;background:#fff;font-size:22px;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}
#grand .bas .oui{background:var(--noir);color:#fff}
#grand .fermer{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;border:0;border-radius:999px;background:rgba(255,255,255,.92);padding:9px 14px;font:400 13px Jost,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.2)}
/* 2 · coups de cœur */
.grille{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 12px;align-content:start;scrollbar-width:none}
.mini{position:relative;aspect-ratio:390/700;border-radius:18px;overflow:hidden;border:0;padding:0;background:#fff;box-shadow:0 10px 20px -12px rgba(0,0,0,.5);outline:3px solid transparent;outline-offset:2px}
.mini iframe{position:absolute;top:0;left:0;width:390px;height:700px;border:0;transform-origin:0 0;pointer-events:none}
.mini.on{outline-color:var(--noir)}
.mini.on::after{content:"✓";position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--noir);color:#fff;font:500 14px/26px Jost,sans-serif;text-align:center}
.mini .coeur{position:absolute;top:8px;left:8px;font-size:15px}
.go{width:100%;border:0;border-radius:999px;background:var(--noir);color:var(--fond);padding:17px;font:500 12.5px Jost,sans-serif;letter-spacing:.2em}
.go:disabled{opacity:.35}
.encore{margin-top:8px;border:0;background:none;font:400 13.5px Jost,sans-serif;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.vide{grid-column:1/-1;text-align:center;font:300 14px/1.5 Jost,sans-serif;color:var(--muted);padding:40px 10px}
/* 08/11 : coups de cœur en ligne, un par un (on glisse à gauche / à droite), « Enlever » ou « Personnaliser celui-ci » */
.carrou{--w:260px;--h:500px;flex:1;display:flex;align-items:center;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -20px 8px;padding:0 calc(50% - var(--w) / 2);scrollbar-width:none;min-height:0}
.carrou::-webkit-scrollbar{display:none}
.slide{flex:none;width:var(--w);height:var(--h);scroll-snap-align:center;transition:transform .15s,opacity .15s}
.slide .carte{position:relative;left:auto;transform:none;width:100%;height:100%;aspect-ratio:auto}
.ptsC{display:flex;gap:5px;justify-content:center;margin-bottom:10px}.ptsC i{width:6px;height:6px;border-radius:50%;background:rgba(30,28,27,.2);transition:all .25s}.ptsC i.on{width:18px;border-radius:3px;background:var(--noir)}
.duo{display:flex;gap:10px}
.duo .enl{flex:none;border:1px solid rgba(30,28,27,.25);border-radius:999px;background:#fff;padding:0 18px;font:400 13px Jost,sans-serif}
.moi{border:0;background:none;font:400 13px Jost,sans-serif;text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:4px}
.maquette{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:10px;z-index:30;font:400 9px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;background:var(--noir);color:#fff;padding:3px 7px;border-radius:999px;opacity:.6}
</style></head><body>
<div id="tel">
  <span class="maquette">Prototype</span>
  <section class="ecran on" id="q">
    <div class="pts"><i class="on"></i><i></i><i></i></div>
    <h1>Quel site vous<br>ressemble ?</h1>

      <button class="carte2" data-genre="ouf" style="background-image:url(loginail-site/apercus-mini/y2k.webp)"><span>Fun et ouf<small>Fonds, charms, écritures folles</small></span></button>

    <button class="deux" data-genre="mix" type="button">Un peu des deux</button>

    <div class="zone" id="zone"></div>
    <div class="vote"><button class="non" id="non" type="button" aria-label="Je ne garde pas">✕</button><button class="oui" id="oui" type="button" aria-label="Je garde">♥</button></div>
    <p class="astuce">Glissez à droite pour garder, à gauche pour passer · vers le haut pour voir tout le site</p>
    <button class="moi" id="moi" type="button">Je préfère tout créer moi-même</button>
  </section>

  <section class="ecran" id="coeurs">
    <div class="pts"><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <h1>Vos coups de cœur</h1>
    <p class="sous" id="sousC"></p>
    <div class="carrou" id="carrou"></div><div class="ptsC" id="ptsC"></div>
    <div class="duo"><button class="enl" id="enl" type="button">Enlever</button><button class="go" id="perso" type="button">PERSONNALISER CELUI-CI</button></div>
    <button class="encore" id="encore" type="button">Voir 12 autres propositions</button>
  </section>


</div>

$("retourQ").onclick = () => montre("q");
document.querySelectorAll("[data-genre]").forEach(b => b.onclick = () => { genre = b.dataset.genre; lancePaquet(); });
function finPaquet() {
  const z = $("carrou"); z.innerHTML = ""; $("ptsC").innerHTML = "";
  $("sousC").textContent = coeurs.length ? "Glissez pour les revoir. Gardez celui que vous préférez : vous pourrez encore tout personnaliser." : "Aucun coup de cœur pour l’instant. On vous en propose d’autres ?";
  $("enl").hidden = $("perso").hidden = !coeurs.length;
  coeurs.forEach((p, k) => { const sl = document.createElement("div"); sl.className = "slide"; const c = carteHtml(p); c.querySelector(".tampon.oui").remove(); c.querySelector(".tampon.non").remove();
    c.insertAdjacentHTML("afterbegin", ""); sl.appendChild(c); z.appendChild(sl); branche2(c); $("ptsC").insertAdjacentHTML("beforeend", `<i class="${k ? "" : "on"}"></i>`); });
  montre("coeurs"); requestAnimationFrame(dimCarrou);
}
const pas = () => (parseFloat(getComputedStyle($("carrou")).getPropertyValue("--w")) || 260) + 12;
const courant = () => Math.round($("carrou").scrollLeft / pas());
function dimCarrou() { const z = $("carrou"), h = Math.max(260, z.clientHeight - 8), w = Math.min(z.clientWidth * .72, h * 390 / 760);
  z.style.setProperty("--w", w + "px"); z.style.setProperty("--h", (w * 760 / 390) + "px"); requestAnimationFrame(() => { echelle(); effet(); }); }
function effet() { const z = $("carrou"), p = pas(); [...z.children].forEach((sl, n) => { const d = Math.min(1, Math.abs(n * p - z.scrollLeft) / p); sl.style.transform = `scale(${1 - .12 * d})`; sl.style.opacity = 1 - .45 * d; });
  const k = courant(); [...$("ptsC").children].forEach((x, n) => x.classList.toggle("on", n === k)); }
$("carrou").addEventListener("scroll", effet, { passive: true });
/* dans le carrousel : glisser à gauche / à droite = changer de site (le carrousel s'en charge), la molette ou le pouce vertical = faire défiler le site */
function branche2(c) { const pr = c.querySelector(".prise"); pr.style.touchAction = "pan-x";
  const boite = () => { try { const d = c.querySelector("iframe").contentDocument; return d.querySelector(".defile") || d.scrollingElement; } catch (e) { return null; } };
  let y0 = null, x0 = 0, top0 = 0, sens = null, sl0 = 0; const z = $("carrou");
  pr.onpointerdown = e => { y0 = e.clientY; x0 = e.clientX; sens = null; top0 = boite()?.scrollTop || 0; sl0 = z.scrollLeft; if (e.pointerType === "mouse") pr.setPointerCapture(e.pointerId); };
  pr.onpointermove = e => { if (y0 == null) return; const dy = e.clientY - y0, dx = e.clientX - x0; if (!sens && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sens = Math.abs(dy) > Math.abs(dx) ? "y" : "x";
    if (sens === "y") { const b = boite(); if (b) b.scrollTop = top0 - dy / (c.clientWidth / 390); }
    if (sens === "x" && e.pointerType === "mouse") { z.style.scrollSnapType = "none"; z.scrollLeft = sl0 - dx; } };
  pr.onpointerup = pr.onpointercancel = e => { if (sens === "x" && e.pointerType === "mouse") { const dx = e.clientX - x0, k = Math.max(0, Math.min(coeurs.length - 1, Math.round(sl0 / pas()) + (dx < -40 ? 1 : dx > 40 ? -1 : 0))); z.scrollTo({ left: k * pas(), behavior: "smooth" }); setTimeout(() => z.style.scrollSnapType = "", 400); } y0 = null; };
  pr.onwheel = e => { if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return; const b = boite(); if (b) { e.preventDefault(); b.scrollTop += e.deltaY; } }; }
$("enl").onclick = () => { const k = courant(); coeurs.splice(k, 1); finPaquet(); setTimeout(() => { $("carrou").scrollLeft = Math.max(0, Math.min(k, coeurs.length - 1)) * pas(); effet(); }, 50); };
$("encore").onclick = lancePaquet;
$("perso").onclick = () => { const p = coeurs[courant()]; if (p) location.href = "maquette-perso.html?src=" + encodeURIComponent(src(p, false)); };
addEventListener("resize", () => { echelle(); if ($("coeurs").classList.contains("on")) dimCarrou(); });
</script>
