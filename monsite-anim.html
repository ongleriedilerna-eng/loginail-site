:root{--creme:#F6F3EF;--noir:#1E1C1B;--doux:#7A716A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#EEE9E3;font-family:Jost,sans-serif;color:var(--noir);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.tel{width:390px;height:844px;border-radius:44px;border:10px solid #1E1C1B;overflow:hidden;position:relative;background:#fff;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.fond{position:absolute;inset:0}.fond .tuile{position:absolute;inset:0}
.cont{position:absolute;inset:0;padding:54px 20px 120px}
.pill-tete{display:inline-block;background:rgba(246,243,239,.92);border-radius:22px;padding:12px 18px 14px;margin-bottom:16px}
.pill-tete small{display:flex;align-items:center;gap:7px;font:500 11px Jost;letter-spacing:.2em;text-transform:uppercase;color:var(--doux)}
.pill-tete small i{width:9px;height:9px;border-radius:50%;flex:none}
.pill-tete b{display:block;font:400 30px Jost;margin-top:4px}
.carte{position:relative;background:#F6F3EF;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px -16px rgba(0,0,0,.45)}
.carte .ph{position:relative;height:200px;overflow:hidden}.carte .ph img{width:100%;height:100%;object-fit:cover}
.nom{position:absolute;left:16px;right:16px;bottom:8px;font-size:44px;line-height:.95;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.carte .bas{padding:14px 16px 16px}.carte .bas small{display:block;font:500 11px Jost;letter-spacing:.16em;text-transform:uppercase;color:var(--doux)}
.carte .bas a{display:block;margin-top:14px;font:500 12px Jost;letter-spacing:.14em;text-transform:uppercase}
.gros{display:block;width:100%;margin:18px 0 22px;border:0;border-radius:99px;padding:18px;font:500 13px Jost;letter-spacing:.2em;text-transform:uppercase;transition:transform .15s}
.gros.app{transform:scale(.95)}
.sect>small{display:inline-block;background:rgba(246,243,239,.92);border-radius:99px;padding:6px 12px;font:500 11px Jost;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.liste{background:#fff;border-radius:20px;padding:4px 18px}.liste div{padding:15px 0;border-bottom:1px solid #EEE9E3}.liste div:last-child{border:0}
.liste b{display:block;font-weight:400;font-size:17px}.liste span{display:block;color:var(--doux);font-size:13px;margin-top:3px}
.ch{position:absolute;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));z-index:3}
.nav{position:absolute;left:12px;right:12px;bottom:14px;z-index:5;background:#1E1C1B;border-radius:30px;display:flex;justify-content:space-around;padding:12px 6px}
.nav i{font-style:normal;color:#cfc8c1;font-size:11px;padding:6px 8px;border-radius:20px}.nav i.on{background:#3a3634;color:#fff}
/* le changement : doux, d'un coup, avec des étoiles */
.vue{position:absolute;inset:0;transition:opacity .6s ease}
.vue{opacity:0}.vue.on{opacity:1}
.ec{position:absolute;inset:0;pointer-events:none;z-index:9}.ec i{position:absolute;font-style:normal;color:#fff;font-size:18px;text-shadow:0 0 10px rgba(36,218,255,1),0 0 22px rgba(179,226,255,.9)}
.doigt{position:absolute;z-index:20;width:46px;height:46px;pointer-events:none;left:250px;top:520px;opacity:0;transition:opacity .35s,transform .15s}
.doigt.on{opacity:1}.doigt.tape{transform:scale(.85)}
.rej{background:none;border:0;font:500 12px Jost;letter-spacing:.14em;text-transform:uppercase;color:var(--doux);text-decoration:underline;cursor:pointer}

/* 10/11 (Marie) : la main n'est pas belle — d'autres façons de montrer le toucher (?t=1…5) */
.t1 #dg svg,.t2 #dg svg,.t3 #dg svg,.t4 #dg svg,.t5 #dg svg{display:none}
.t1 #dg{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 1.5px rgba(30,28,27,.25),0 6px 16px -6px rgba(0,0,0,.4);left:255px;top:285px}
.t1 #dg.tape{transform:scale(.7);background:rgba(255,255,255,.95)}
.onde2{position:absolute;z-index:19;border-radius:99px;border:2px solid rgba(255,255,255,.95);pointer-events:none;animation:onde2 .7s ease-out forwards}
@keyframes onde2{from{transform:scale(.6);opacity:1}to{transform:scale(1.35);opacity:0}}
.gros{position:relative;overflow:hidden}
.reflet{position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);pointer-events:none;animation:reflet .7s ease-in-out forwards}
@keyframes reflet{to{left:110%}}
.gros.pulse{animation:gpulse .9s ease-in-out 2}
@keyframes gpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 7px rgba(255,255,255,.55)}}
.etinc{position:absolute;z-index:19;pointer-events:none;color:#fff;font-style:normal;font-size:30px;text-shadow:0 0 12px rgba(255,200,230,1),0 0 24px rgba(255,255,255,.9);animation:etinc .6s ease-out forwards}
@keyframes etinc{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.6) rotate(90deg);opacity:0}}

/* 10/11 (Marie) : « des petites étoiles avec des effets PARTOUT » — elles scintillent tout le temps, sur tout l'écran */
.scint{position:absolute;inset:0;pointer-events:none;z-index:7}
.scint i{position:absolute;font-style:normal;color:#fff;line-height:1;animation:scint 2.4s ease-in-out infinite;text-shadow:0 0 6px var(--lueur,rgba(179,226,255,1)),0 0 14px var(--lueur,rgba(179,226,255,.8))}
.scint i.p{font-size:9px}.scint i.m{font-size:14px}.scint i.g{font-size:22px}
.scint i.r{animation-name:scintR}
@keyframes scint{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1)}60%{opacity:.85;transform:scale(1.15)}}
@keyframes scintR{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(90deg)}}
.scint b{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--lueur,rgba(179,226,255,.9));animation:scint 1.8s ease-in-out infinite}
.vue .gros{box-shadow:0 0 0 0 transparent}

/* dans l'accueil (iframe) : l'écran remplit tout, sans cadre */
html.embed,html.embed body{background:transparent;display:block;overflow:hidden}
html.embed .tel{border:0;border-radius:0;box-shadow:none;position:absolute;left:0;top:0;transform-origin:0 0}
html.embed .rej{display:none}

<script>
/* 10/11 (Marie) : ses DEUX sites, à elle (envoyés depuis modifier-monsite). Le 1er au départ ; elle touche « Personnaliser mon site » et ça devient le 2e, d'un coup, tout en douceur, avec des étoiles. Pas d'autre animation. */
const FI="loginail-site/fonds-img/",F=()=>(window.FONDS100&&FONDS100.f)||[],tuile=n=>{const f=F().find(x=>x[0]===n);return f?f[1].replace(/__FI__/g,FI):""};
const fonce=(hex,k)=>{let c=hex.replace("#","");const n=[0,2,4].map(i=>Math.round(parseInt(c.substr(i,2),16)*k));return "#"+n.map(x=>x.toString(16).padStart(2,"0")).join("")};
const SITES=[
 {fond:"Bulles qui montent",photo:"mercure/5.webp",nom:"Les ongles de Sabine",tete:"En ligne · Les ongles de Sabine",pol:"Bagel Fat One",nomc:"#b3e2ff",maj:true,rond:"#24daff",gcol:"#466172",charm:"verseau",chx:248,chy:358,cht:109,chr:25},
 {fond:"Strass facettés sur rose",photo:"mercure/1.webp",phx:93.8,phy:69.3,phz:100,nom:"Les ongles de Sabine",tete:"En ligne · Les ongles de Sabine",pol:"Corben",nomc:"#ffffff",maj:false,rond:"#c52b9c",gcol:"#fe7ca9",charm:"ailesfee",chx:272,chy:391,cht:91,chr:20}
];
/* 10/11 (Marie) : « je voudrais qu'il y en ait plein » — les sites ajoutés dans l'outil (bouton « + Ajouter ce site à l'animation ») passent avant */
try{const L=/[?&]embed/.test(location.search)?[]:JSON.parse(localStorage.getItem("monsite-anim")||"[]");if(L.length>=2){SITES.length=0;L.forEach(e=>SITES.push({phx:e.phx,phy:e.phy,phz:e.phz,fond:e.fond,photo:e.photo,nom:e.nom,tete:e.tete,pol:e.pol,nomc:e.nomc,maj:e.maj,rond:e.rondc||"",gcol:e.gcol,charm:e.charm,chx:e.chx,chy:e.chy,cht:e.cht,chr:e.chr||0}))}}catch(_){}
const clair=c=>/^#?(f|e|d|c)/i.test(c.replace("#",""));
const vue=(E,cl)=>`<div class="vue ${cl}"><div class="fond">${tuile(E.fond)}</div><div class="cont">
 <div class="pill-tete"><small><i style="background:${E.rond||fonce(E.nomc,.8)}"></i>${E.tete}</small><b>Modifier mon site</b></div>
 <div class="carte"><div class="ph"><img src="loginail-site/univers-photos/${E.photo}" alt="" style="object-position:${E.phx||50}% ${E.phy||50}%;transform:scale(${(E.phz||100)/100});transform-origin:${E.phx||50}% ${E.phy||50}%"><div class="nom" style="font-family:'${E.pol}';color:${E.nomc};text-transform:${E.maj===false?"none":"uppercase"}">${E.nom}</div></div><div class="bas"><small>Prothésiste ongulaire · Marseille</small><a>Voir mon site en grand ›</a></div></div>
 <img class="ch" src="loginail-site/charms-mini/${E.charm}.webp" alt="" style="left:${E.chx}px;top:${E.chy}px;width:${E.cht}px;transform:rotate(${E.chr}deg)">
 <button class="gros" style="background:${E.gcol};color:${clair(E.gcol)?"#1E1C1B":"#fff"}">Personnaliser mon site</button>
 <div class="sect"><small>Mon style</small><div class="liste"><div><b>Changer de style</b><span>Des sites à glisser : gardez vos coups de cœur</span></div><div><b>Personnaliser</b><span>La forme, le fond, les couleurs, l’écriture</span></div><div><b>Mes charms</b><span>3 charms posés</span></div></div></div>
 </div></div>`;
const tel=document.getElementById("tel"),TV=new URLSearchParams(location.search).get("t")||"1";if(TV!=="0")tel.classList.add("t"+TV);let T=[];const at=(ms,f)=>T.push(setTimeout(f,ms));
const scint=()=>{let h="";for(let i=0;i<34;i++){const t=["p","p","m","m","g"][i%5],x=(Math.random()*96+2).toFixed(1),y=(Math.random()*86+2).toFixed(1),d=(Math.random()*2.4).toFixed(2),du=(1.6+Math.random()*1.8).toFixed(2);h+=`<i class="${t}${i%3?"":" r"}" style="left:${x}%;top:${y}%;animation-delay:${d}s;animation-duration:${du}s">✦</i>`}
 for(let i=0;i<26;i++)h+=`<b style="left:${(Math.random()*96+2).toFixed(1)}%;top:${(Math.random()*88+2).toFixed(1)}%;animation-delay:${(Math.random()*2).toFixed(2)}s"></b>`;return '<div class="scint" id="sc">'+h+'</div>'};
const lueur=E=>{const c=(E.rond||E.nomc||"#b3e2ff").replace("#","");const n=[0,2,4].map(i=>parseInt(c.substr(i,2),16));return `rgba(${n[0]},${n[1]},${n[2]},.95)`};
const monte=()=>{tel.innerHTML=SITES.map((E,i)=>vue(E,i?"":"on")).join("")+scint()+'<div class="ec" id="ec"></div><div class="nav"><i>Accueil</i><i>Agenda</i><i>Clientes</i><i class="on">Mon site</i><i>Réglages</i></div><div class="doigt" id="dg"><svg viewBox="0 0 24 24" width="46" height="46"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10m0-.5V8a1.5 1.5 0 0 1 3 0v2m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-4-2L4.3 16a1.6 1.6 0 0 1 2.4-2.1L9 16" fill="#fff" stroke="#1E1C1B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'};
const eclate=n=>{const ec=document.getElementById("ec");for(let i=0;i<n;i++){const e=document.createElement("i");e.textContent="✦";const an=Math.random()*Math.PI*2,r=50+Math.random()*150;e.style.left=(8+Math.random()*84)+"%";e.style.top=(6+Math.random()*60)+"%";e.style.fontSize=(12+Math.random()*16)+"px";ec.appendChild(e);
 e.animate([{transform:"translate(-50%,-50%) scale(.2)",opacity:0},{transform:"translate(-50%,-50%) scale(1.1)",opacity:1,offset:.25},{transform:`translate(calc(-50% + ${Math.cos(an)*r*.4}px),calc(-50% + ${Math.sin(an)*r*.4}px)) scale(.6)`,opacity:0}],{duration:1300+Math.random()*700,delay:Math.random()*400,easing:"ease-out"}).onfinish=()=>e.remove()}};
/* à chaque fois : le doigt touche « Personnaliser mon site », le site change d'un coup, en douceur, et plein d'étoiles */
const joue=()=>{T.forEach(clearTimeout);T=[];monte();document.getElementById("sc").style.setProperty("--lueur",lueur(SITES[0]));const V=[...tel.querySelectorAll(".vue")],dg=document.getElementById("dg");let t=900;
 const change=i=>{at(t,()=>{if(TV==="0"||TV==="1")dg.classList.add("on")});if(TV==="3")at(t,()=>tel.querySelectorAll(".vue.on .gros").forEach(g=>{g.classList.remove("pulse");void g.offsetWidth;g.classList.add("pulse")}));
  at(t+700,()=>{dg.classList.add("tape");tel.querySelectorAll(".gros").forEach(g=>g.classList.add("app"));const g=tel.querySelector(".vue.on .gros"),R=tel.getBoundingClientRect(),k=R.width/390,b=g.getBoundingClientRect(),bx=(b.left-R.left)/k,by=(b.top-R.top)/k,bw=b.width/k,bh=b.height/k;
   if(TV==="2"){const o=document.createElement("i");o.className="onde2";o.style.cssText=`left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px`;tel.appendChild(o);setTimeout(()=>o.remove(),700)}
   if(TV==="3"){const re=document.createElement("i");re.className="reflet";g.appendChild(re);setTimeout(()=>re.remove(),700)}
   if(TV==="4"){const e=document.createElement("i");e.className="etinc";e.textContent="✦";e.style.left=(bx+bw*.65)+"px";e.style.top=(by+bh/2)+"px";tel.appendChild(e);setTimeout(()=>e.remove(),600)}
   if(TV==="1"){dg.style.left=(bx+bw*.65-20)+"px";dg.style.top=(by+bh/2-20)+"px"}});
  at(t+860,()=>{dg.classList.remove("tape");tel.querySelectorAll(".gros").forEach(g=>g.classList.remove("app"));V.forEach((v,j)=>v.classList.toggle("on",j===i));eclate(46);document.getElementById("sc").style.setProperty("--lueur",lueur(SITES[i]))});at(t+1400,()=>dg.classList.remove("on"));t+=2700};
 for(let i=1;i<V.length;i++)change(i);change(0);/* elle clique plein de fois */at(t+400,joue)};
document.getElementById("rj").onclick=joue;
const go=()=>joue();if(F().length)go();else addEventListener("f100",go);
const EMB=/[?&]embed/.test(location.search);if(EMB)document.documentElement.classList.add("embed");
const cale=()=>{if(EMB){tel.style.transform=`scale(${innerWidth/390},${innerHeight/844})`;return}const k=Math.min(1,(innerHeight-60)/864,(innerWidth-20)/410);tel.style.transform=`scale(${k})`;tel.style.margin=(-(1-k)*432)+"px 0"};addEventListener("resize",cale);cale();
</script></body></html>
