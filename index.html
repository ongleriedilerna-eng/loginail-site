.f-split img{width:100%;height:100%;object-fit:contain;object-position:center bottom;padding:30px 8px 10px 0}
.f-t3{font-family:Italiana,serif;font-size:15px;margin:12px 0 4px}.f-t3 small{font-size:10px;opacity:.6;margin-right:4px}
.r3 small{font-family:Italiana,serif;opacity:.6;width:14px}.r3 span{flex:1}
.f-cit{font-family:Italiana,serif;font-size:13px;line-height:1.35;border-top:1px solid currentColor;padding-top:8px}
.f-et{display:block;font-family:Jost,sans-serif;font-size:9px;letter-spacing:2px;margin-bottom:4px;animation:scint2 3s infinite}
@keyframes scint2{0%,100%{opacity:.35}20%,70%{opacity:1}}
.tm-c .tm-e,.tm-c .f-btn,.tm-c .f-h2 em{transition:background .8s,color .8s}
.pt-c{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pt,#1E1C1B);margin-left:7px;vertical-align:1px;transition:background .8s}
.couls-t{text-align:center;font-size:13px;line-height:1.45;color:var(--gris);margin:14px 10px 4px}
.couls-t b{display:block;font-weight:400;font-size:17px;color:var(--noir);margin-bottom:2px}
.ecran .h1x h1,.sec h2,.temoin1 .it,.etape .n{font-family:"Cormorant Garamond",serif;font-weight:500}
.ecran .h1x h1{font-size:44px;line-height:1.02}.sec h2{font-size:38px;line-height:1.05}.temoin1 .it{font-size:26px;line-height:1.25}.etape .n{font-size:38px}
.flot{position:absolute;left:16px;right:16px;bottom:22px;z-index:20;transition:transform .4s,opacity .3s}
.flot.cache{transform:translateY(120%);opacity:0}
.toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-20px);background:var(--noir);color:var(--creme);font-size:12.5px;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note-l{font-size:12px;color:var(--gris);text-align:center;margin-top:10px}
/* V1 : la photo et le lien */
.v1 .hero{position:relative;height:640px;color:var(--creme)}
.v1 .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v1 .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,17,.55) 0,rgba(20,18,17,.1) 35%,rgba(20,18,17,.75) 100%)}
.v1 .hero .haut{position:absolute;top:58px;left:26px;right:26px;z-index:2}
.v1 .hero .bas{position:absolute;left:26px;right:26px;bottom:30px;z-index:2}
.v1 h1{font-family:Italiana,serif;font-weight:400;font-size:42px;line-height:1.05;margin:10px 0 6px}
.v1 .bas .k{line-height:1.6}
.v1 .sous{font-size:15px;opacity:.85;margin-bottom:20px}
.v1 .lien{background:rgba(255,255,255,.95);color:var(--noir)}
.v1 .hero .btn{background:var(--creme);color:var(--noir)}
.v1 .hero .note-l{color:rgba(246,243,239,.8)}
/* V2 : la promesse en grand */
.v2 .hero{padding:62px 26px 0}
.v2 h1{font-family:Italiana,serif;font-weight:400;font-size:62px;line-height:.98;margin:34px 0 10px}
.v2 h1 em{font-style:normal;display:block;font-size:26px;line-height:1.2;color:var(--gris);margin-top:12px}
.v2 .chiffres3{display:flex;gap:8px;margin:22px 0}
.v2 .chiffres3 div{flex:1;background:#fff;border-radius:18px;padding:14px 12px}
.v2 .chiffres3 b{display:block;font-family:Italiana,serif;font-weight:400;font-size:28px}
.v2 .chiffres3 span{font-size:11.5px;color:var(--gris);line-height:1.35;display:block}
.v2 .bande{display:flex;gap:10px;overflow-x:auto;margin:30px -26px 0;padding:0 26px;scrollbar-width:none}
.v2 .bande img{width:150px;height:200px;object-fit:cover;border-radius:16px;flex:none}
/* V3 : la prothésiste */
.v3 .hero{padding:62px 26px 0}
.v3 .photo{margin-top:24px;height:330px;border-radius:26px;overflow:hidden;position:relative}
.v3 .photo img{width:100%;height:100%;object-fit:cover}
.v3 .photo .etiq{position:absolute;left:14px;bottom:14px;background:rgba(246,243,239,.92);border-radius:14px;padding:8px 14px;font-size:12px}
.v3 h1{font-family:Italiana,serif;font-weight:400;font-size:40px;line-height:1.08;margin:24px 0 8px}
.v3 .sous{font-size:14.5px;color:var(--gris);margin-bottom:18px;line-height:1.5}
.v3 .temoin{background:var(--noir);color:var(--creme);border-radius:24px;padding:24px 22px}
.v3 .temoin .it{font-size:24px;line-height:1.35}
.v3 .temoin small{display:block;margin-top:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.65}

 1:()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>3 styles de site. 12 couleurs. Jour et nuit.</h2><div class="styles" data-mini>${[1,2,3].map(n=>`<div class="st-c"><div class="st-n">Site n°${n}</div>${MINI[n]()}</div>`).join("")}</div>
   <div class="dots">${COULS.map((c,i)=>`<button class="${i?"":"on"}" data-coul="${i}" style="background:${c[2]}"></button>`).join("")}</div><div class="seg"><button class="on" data-mode="jour">Jour</button><button data-mode="nuit">Nuit</button></div><p class="note-l">Faites glisser les styles · touchez une couleur</p></div>`,
 2:()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>Tout se choisit, tout se change.</h2><div class="choisit">${[["▦","3 styles de site","le vôtre en un geste"],["●","12 couleurs","et la version nuit"],["Aa","5 langues","français, anglais, italien, allemand, russe"],["◰","Vos photos","vos plus belles poses"],["€","Vos prestations","et vos prix"],["★","Vos avis Google","affichés tout seuls"],["⌖","Votre adresse","avec le plan et l’itinéraire"],["◎","Votre Instagram","vos dernières publications"],["✓","La réservation","en ligne, ou par téléphone"],["☺","Votre équipe","une photo par personne"]].map(x=>`<div><i>${x[0]}</i><b>${x[1]}</b><span>${x[2]}</span></div>`).join("")}</div><p class="note-l">Et vous changez tout quand vous voulez, depuis votre téléphone.</p></div>`,
 3:()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>De votre fiche Google à votre site.</h2>
   <div class="g-fiche"><div class="g-t">Votre fiche Google</div><b>Votre onglerie</b><span>★★★★★ 5,0 · 24 avis</span><span>Ouvert · ferme à 19h</span><div class="g-ph"><img src="${P.nude}" alt=""><img src="${P.creme}" alt=""><img src="${P.blanc}" alt=""></div></div>
   <div class="g-fl">↓ on reprend tout</div>
   <div class="g-site">${MINI[1]()}</div>
   <ul class="inc" style="margin-top:16px">${["Votre nom, vos horaires, votre adresse","Vos avis Google et vos photos","Vous choisissez le style, la couleur, jour ou nuit"].map(x=>`<li><i></i>${x}</li>`).join("")}</ul></div>`};

Object.assign(AV,{
 4:()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>Choisissez votre style.</h2><div class="tms" data-mini>${[1,2,3].map(n=>`<div class="tm-c">${telM(n)}<span>Site n°${n}</span></div>`).join("")}</div><div class="pts3"><i class="on"></i><i></i><i></i></div>
   <div class="dots">${COULS.map((c,i)=>`<button class="${i?"":"on"}" data-coul="${i}" style="background:${c[2]}"></button>`).join("")}</div><div class="seg"><button class="on" data-mode="jour">Jour</button><button data-mode="nuit">Nuit</button></div></div>`,
 5:()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>Tout se choisit.</h2><div class="icos">${[["▦","3 styles"],["●","12 couleurs"],["◐","Jour / nuit"],["Aa","5 langues"],["◰","Vos photos"],["€","Vos prix"],["★","Vos avis"],["⌖","Votre plan"],["◎","Instagram"]].map(x=>`<div><i>${x[0]}</i><b>${x[1]}</b></div>`).join("")}</div></div>`,
 6:()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>Votre site, votre style.</h2><div class="tms" data-mini>${[1,2,3].map(n=>`<div class="tm-c">${telM(n)}<span>Site n°${n}</span></div>`).join("")}</div><div class="pts3"><i class="on"></i><i></i><i></i></div>
   <div class="chips2">${["12 couleurs","Jour et nuit","5 langues","Vos photos","Vos avis Google","Votre Instagram"].map(x=>`<span>${x}</span>`).join("")}</div>
   <div class="dots">${COULS.map((c,i)=>`<button class="${i?"":"on"}" data-coul="${i}" style="background:${c[2]}"></button>`).join("")}</div></div>`});

const FILM={
 1:()=>`<div class="fm fm1"><div class="f-hero"><img src="${P.noir}" alt=""><div><span>Institut · Votre ville</span><b>Votre onglerie</b><i class="f-btn cl">Réserver un créneau</i></div></div>
   <div class="f-pad"><div class="f-t">— Prestations</div>${["Semi-permanent renforcé|45 €","Semi-permanent mains|35 €","Manucure|25 €"].map(x=>`<div class="f-row"><span>${x.split("|")[0]}</span><b>${x.split("|")[1]}</b></div>`).join("")}
   <div class="f-t">— Avis Google</div><div class="f-avis"><div class="f-piste">${[1,2,3,1,2,3].map(()=>`<div class="f-card">★★★★★<br>« Superbe travail, je recommande »</div>`).join("")}</div></div>
   <i class="f-btn">Réserver un créneau</i></div></div>`,
 2:()=>`<div class="fm fm2"><div class="f-pad"><div class="f-h2"><span>VOTRE ONGLERIE</span><em>Réserver</em></div><div class="f-sq"><img src="${P.creme}" alt=""></div><b class="f-nom">Votre onglerie</b>
   <div class="f-t2">— Prestations</div>${["Semi-permanent mains|35 €","Pédicure|35 €","Manucure|25 €"].map((x,i)=>`<div class="f-row r2"><span>${x.split("|")[0]}</span><b>${x.split("|")[1]}</b><u class="${i===0?"on":""}"></u></div>`).join("")}
   <div class="f-t2">— Avis Google</div><div class="f-paq"><div>★★★★★<br>« Très douce et précise »</div><div></div><div></div></div><i class="f-btn">Réserver un créneau</i></div></div>`,
 3:()=>`<div class="fm fm3"><div class="f-split"><div><span>Institut</span><b>Votre<br>onglerie</b><small>★★★★★ 5,0</small></div><img src="${P.blanc}" alt=""></div>
   <div class="f-pad"><div class="f-t3"><small>01</small> Prestations</div>${["Semi-permanent renforcé|45 €","Semi-permanent pieds|35 €","Sourcils|15 €"].map((x,i)=>`<div class="f-row r3"><small>0${i+1}</small><span>${x.split("|")[0]}</span><b>${x.split("|")[1]}</b></div>`).join("")}
   <div class="f-t3"><small>03</small> Avis Google</div><div class="f-cit"><span class="f-et">★★★★★</span>« Un salon magnifique, je reviens chaque mois. »</div><i class="f-btn">Réserver un créneau</i></div></div>`};
const telF=(n)=>`<div class="tm"><i class="tm-ile"></i><div class="tm-e"><div class="tm-film t${n}">${FILM[n]()}</div></div></div>`;
AV[7]=()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>Choisissez votre style.</h2><div class="tms" data-mini>${[1,2,3].map(n=>`<div class="tm-c">${telF(n)}<span>Site n°${n}</span></div>`).join("")}</div><div class="pts3"><i class="on"></i><i></i><i></i></div>
   <div class="dots">${COULS.map((c,i)=>`<button class="${i?"":"on"}" data-coul="${i}" style="background:${c[2]}"></button>`).join("")}</div><div class="seg"><button class="on" data-mode="jour">Jour</button><button data-mode="nuit">Nuit</button></div>
   <div class="icos" style="margin-top:22px">${[["▦","3 styles"],["●","12 couleurs"],["◐","Jour / nuit"],["Aa","5 langues"],["◰","Vos photos"],["€","Vos prix"],["★","Vos avis"],["⌖","Votre plan"],["◎","Instagram"]].map(x=>`<div><i>${x[0]}</i><b>${x[1]}</b></div>`).join("")}</div></div>`;
const TOUR=[2,10,7,5,11,1,0];
AV[8]=()=>`<div class="sec" id="image"><div class="k">À votre image</div><h2>Choisissez votre style.</h2><div class="tms">${[1,2,3].map(n=>`<div class="tm-c" data-auto="${n-1}">${telF(n)}<span>Site n°${n}<i class="pt-c"></i></span></div>`).join("")}</div><div class="pts3"><i class="on"></i><i></i><i></i></div>
   <p class="couls-t"><b>12 couleurs au choix.</b>Ici, elles changent toutes seules : vous n’en voyez qu’une partie.</p>
   <div class="seg"><button class="on" data-mode="jour">Jour</button><button data-mode="nuit">Nuit</button></div>
   <div class="icos" style="margin-top:22px">${[["▦","3 styles"],["●","12 couleurs"],["◐","Jour / nuit"],["Aa","5 langues"],["◰","Vos photos"],["€","Vos prix"],["★","Vos avis"],["⌖","Votre plan"],["◎","Instagram"]].map(x=>`<div><i>${x[0]}</i><b>${x[1]}</b></div>`).join("")}</div></div>`;
const V={
1:(h,a,d)=>`${(FLD=d,HERO[h]())}<div id="suite"></div>${clair}${etapes}${createur}${AV[a]()}${inclus}${prix}${faq}${pied}`,
2:()=>`<div class="hero">${logo(NOIR)}<h1>3 étapes.<em>Votre site d’onglerie, sans rien écrire.</em></h1><div class="chiffres3"><div><b>12</b><span>couleurs</span></div><div><b>3</b><span>styles</span></div><div><b>0 €</b><span>de frais sur vos réservations</span></div></div>${lienBox}<div class="bande">${["nude","creme","noir","blanc"].map(k=>`<img src="${P[k]}" alt="">`).join("")}</div></div>${etapes}${couleurs}${inclus}${prix}${faq}${pied}`,
3:()=>`<div class="hero">${logo(NOIR)}<div class="photo"><img src="${P.materiel}" alt=""><span class="etiq">Créé par une prothésiste ongulaire</span></div><h1>Le site que j’aurais voulu avoir.</h1><div class="sous">Votre site d’onglerie en 3 étapes, sans rien écrire. Puis vous l’activez.</div>${lienBox}</div>${etapes}
  <div class="sec"><div class="temoin"><div class="it">« Je voulais un site beau, simple, et pensé pour notre métier. Alors je l’ai créé. »</div><small>La créatrice de Loginail, prothésiste ongulaire</small></div></div>${couleurs}${inclus}${prix}${faq}${pied}`};
document.querySelectorAll(".ecran").forEach(e=>{
  e.innerHTML='<i class="ile"></i><div class="defile">'+V[1](+e.dataset.h,+e.dataset.av,+(e.dataset.d||1))+'</div><div class="flot cache"><button class="btn" data-a="creer">Réserver ma place</button></div><div class="toast"></div>';
  const d=e.querySelector(".defile"),flot=e.querySelector(".flot"),t=e.querySelector(".toast");
  const dit=x=>{t.textContent=x;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800)};
  d.addEventListener("scroll",()=>flot.classList.toggle("cache",d.scrollTop<700),{passive:true});
  e.querySelectorAll(".tms").forEach(g=>g.addEventListener("scroll",()=>{const k=Math.round(g.scrollLeft/(g.scrollWidth-g.clientWidth||1)*2);g.nextElementSibling.querySelectorAll("i").forEach((p,i)=>p.classList.toggle("on",i===k))},{passive:true}));
  if(e.dataset.aller){setTimeout(()=>{d.scrollTop=d.querySelector("#"+e.dataset.aller).offsetTop-40},300)}
  let ci=0,mode="jour";const peint=()=>{const c=COULS[ci],n=mode==="nuit";e.querySelectorAll("[data-mini]").forEach(m=>{m.style.setProperty("--mc",n?NUIT[c[1]][0]:c[0]);m.style.setProperty("--mi",n?NUIT[c[1]][1]:c[1])})};
  let pas=0;const auto=()=>{const n=mode==="nuit";e.querySelectorAll("[data-auto]").forEach(m=>{const c=COULS[TOUR[(pas+2*+m.dataset.auto)%TOUR.length]];m.style.setProperty("--mc",n?NUIT[c[1]][0]:c[0]);m.style.setProperty("--mi",n?NUIT[c[1]][1]:c[1]);m.style.setProperty("--pt",c[1])})};
  if(e.querySelector("[data-auto]")){auto();setInterval(()=>{pas++;auto()},2600)}
  e.addEventListener("click",ev=>{const a=ev.target.closest("[data-a]");if(a){if(a.dataset.a==="descendre"){d.scrollTo({top:d.querySelector("#suite").offsetTop,behavior:"smooth"});return}if(a.dataset.a==="creer"){const i=e.querySelector(".lien input");ouvreResa(i?i.value.trim():"")}return}
    const c=ev.target.closest("[data-coul]");if(c){ci=+c.dataset.coul;e.querySelectorAll("[data-coul]").forEach(b=>b.classList.toggle("on",b===c));peint();return}
    const m=ev.target.closest("[data-mode]");if(m){mode=m.dataset.mode;e.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b===m));peint();auto()}});
});
document.querySelectorAll(".reglages button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".reglages button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".col").forEach(c=>c.classList.toggle("vis",c.dataset.col===b.dataset.c))});
const RF=document.querySelector(".resa-f");
function ouvreResa(lien){const m=RF.querySelector('[data-lien="mail"]');m.href="mailto:contact@loginail.fr?subject="+encodeURIComponent("Réserver ma place Loginail")+"&body="+encodeURIComponent("Bonjour, je voudrais réserver ma place.\nMon salon : \nMa ville : "+(lien?"\nMon lien Google Maps : "+lien:""));RF.hidden=false;requestAnimationFrame(()=>RF.classList.add("on"))}
function fermeResa(){RF.classList.remove("on");setTimeout(()=>RF.hidden=true,250)}
RF.addEventListener("click",ev=>{if(ev.target===RF||ev.target.closest('[data-a="fermer"]'))fermeResa()});
addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!RF.hidden)fermeResa()});
function ajuste(){const z=Math.min(1,(innerHeight-130)/866,(innerWidth-60)/412);document.documentElement.style.setProperty("--z",z.toFixed(3))}
addEventListener("resize",ajuste);ajuste();
</script>
