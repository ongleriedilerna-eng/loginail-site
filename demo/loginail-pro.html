<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loginail · Espace pro</title>
<style>
:root{--noir:#1E1C1B;--creme:#F6F3EF;--gris:#8a8076;--ligne:rgba(30,28,27,.08);--vert:#6E9A66}
*{box-sizing:border-box}
body{margin:0;background:#E7E2DC;font-family:Jost,sans-serif;color:var(--noir);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.bandeau{text-align:center;padding:16px 16px 4px;font-size:12px;letter-spacing:.06em;color:#6f665e}
.bandeau b{font-weight:500;color:var(--noir);letter-spacing:.18em;text-transform:uppercase;font-size:11px;display:block;margin-bottom:4px}
.rangee{display:flex;justify-content:safe center;align-items:flex-start;gap:28px;padding:12px 16px 28px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.code{white-space:nowrap;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#5d554e}
.code b{color:var(--noir);font-weight:500;margin-right:6px}
.tel{zoom:var(--z,1);width:412px;height:866px;border-radius:64px;background:#0d0d0d;padding:11px;position:relative;box-shadow:0 0 0 2px #2a2a2a inset,0 30px 60px -20px rgba(30,28,27,.45)}
.ecran{width:390px;height:844px;border-radius:53px;overflow:hidden;position:relative;background:var(--creme);isolation:isolate}
.ile{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;z-index:60}
.reglages{display:none;justify-content:center;gap:12px;padding:10px 12px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.reglages div{display:flex;gap:6px}
.reglages button{border:1px solid rgba(30,28,27,.25);background:none;border-radius:16px;padding:6px 11px;letter-spacing:.14em;cursor:pointer}
.reglages button.on{background:var(--noir);color:var(--creme);border-color:var(--noir)}
@media (max-width:699px){
  body{background:var(--creme)}.bandeau{display:none}
  .reglages{display:flex;height:46px;align-items:center;border-bottom:1px solid var(--ligne)}
  .rangee{padding:0;display:block}.col{display:none}.col.vis{display:block}.code{display:none}
  .tel{zoom:1!important;width:100vw;height:calc(100dvh - 46px);padding:0;border-radius:0;box-shadow:none;background:none}
  .ecran{width:100%;height:100%;border-radius:0}.ile{display:none}
}

/* pages */
.vue{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:62px 22px 120px;display:none}
.vue::-webkit-scrollbar{display:none}
.vue.on{display:block;animation:entre .35s both}
@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tete small{display:block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris)}
.tete h1{font-weight:300;font-size:30px;margin:4px 0 0;letter-spacing:.01em}
.rond{width:42px;height:42px;border-radius:50%;background:#E4DDD5;display:grid;place-items:center;font-size:13px;letter-spacing:.04em;border:0;cursor:pointer}
.k{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris);margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.k a{letter-spacing:.06em;text-transform:none;font-size:12px;color:var(--noir);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.carte{background:#fff;border-radius:22px;padding:4px 18px}
.rdv{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.rdv:last-child{border:0}
.rdv .h{width:46px;font-size:14px}
.rdv .t{flex:1;min-width:0}
.rdv .t b{display:block;font-weight:400;font-size:14.5px}
.rdv .t span{font-size:12px;color:var(--gris)}
.rdv .ac{font-size:11px;color:#5E7A58;display:flex;align-items:center;gap:5px}
.rdv .ac i{width:6px;height:6px;border-radius:50%;background:var(--vert)}
.rdv.libre .t b{color:var(--gris);font-style:italic}
.pil{border:1px solid rgba(30,28,27,.2);background:none;border-radius:18px;padding:7px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.duo{display:flex;gap:8px}
.duo button{flex:1}
.btn{height:46px;border-radius:26px;border:0;background:var(--noir);color:var(--creme);font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.clair{background:#fff;color:var(--noir)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5}
.noire{background:var(--noir);color:var(--creme);border-radius:26px;padding:20px 22px}
.noire small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.65}
.prochain .l1{display:flex;align-items:baseline;gap:12px;margin:10px 0 2px}
.prochain .l1 b{font-weight:300;font-size:38px}
.prochain .l1 span{font-size:13px;opacity:.75}
.prochain .nom{font-size:18px;font-weight:300}
.prochain .pr{font-size:13px;opacity:.7;margin-top:2px}
.noire .bts{display:flex;gap:8px;margin-top:16px}
.noire .bts button{flex:1;height:42px;border-radius:22px;border:1px solid rgba(246,243,239,.3);background:none;color:var(--creme);font-size:12.5px;cursor:pointer}
.noire .bts button.plein{background:var(--creme);color:var(--noir);border-color:var(--creme)}
.siteb .adr{font-weight:300;font-size:23px;margin:8px 0 4px}
.enl{font-size:12px;display:flex;align-items:center;gap:6px}
.enl i{width:7px;height:7px;border-radius:50%;background:#8FC283}
.noire .enl{opacity:.85}
.blanche{background:#fff;border-radius:24px;padding:18px 20px}
.monsite{display:flex;align-items:center;gap:14px}
.monsite .ic{width:44px;height:44px;border-radius:14px;background:var(--creme);display:grid;place-items:center}
.monsite .ic svg{width:22px;height:22px;stroke:var(--noir);fill:none;stroke-width:1.3}
.monsite .t{flex:1}
.monsite b{display:block;font-weight:400;font-size:15.5px}
.monsite .enl{color:#5E7A58}
.prochainb{display:flex;gap:16px;align-items:center}
.prochainb .hh{font-weight:300;font-size:34px;line-height:1}
.prochainb .t{flex:1}
.prochainb small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris)}
.prochainb b{display:block;font-weight:400;font-size:16px;margin-top:4px}
.prochainb span{font-size:12.5px;color:var(--gris)}
.visites{margin-top:14px;padding-top:12px;border-top:1px solid var(--ligne);font-size:13px;color:var(--gris)}
.visites b{font-weight:400;font-size:17px;color:var(--noir);margin-right:4px}
.vide b{display:block;font-weight:400;font-size:15px;margin-bottom:4px}
.vide span{font-size:12.5px;color:var(--gris);line-height:1.45}
.cpt{letter-spacing:.1em;color:var(--noir)}
.coche{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.coche:last-child{border:0}
.coche>i{width:24px;height:24px;border-radius:50%;border:1.5px solid #CFC6BC;flex:none;position:relative;transition:background .25s,border-color .25s}
.coche.ok>i{background:var(--noir);border-color:var(--noir)}
.coche.ok>i:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;border:solid var(--creme);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.coche.ok b{text-decoration:line-through;color:var(--gris)}
.coche .t{flex:1}.coche b{display:block;font-weight:400;font-size:14.5px}.coche span{font-size:12px;color:var(--gris)}
.coche .fl{color:#b5aba1;font-size:18px}
.barre3{display:flex;gap:5px;margin-bottom:12px}.barre3 i{flex:1;height:3px;border-radius:2px;background:#E4DDD5}.barre3 i.on{background:var(--noir)}
.en{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gris)}
.et-t{font-weight:300;font-size:21px;margin:8px 0 4px;line-height:1.2}
.et-s{font-size:13px;color:var(--gris)}
.plustard{display:block;margin:10px auto 0;border:0;background:none;font-size:12.5px;color:var(--gris);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.carte-et .ic{width:44px;height:44px;border-radius:14px;background:var(--creme);display:grid;place-items:center;margin:12px 0 4px}
.carte-et .ic svg{width:22px;height:22px;stroke:var(--noir);fill:none;stroke-width:1.3}
.paie{display:flex;align-items:center;gap:12px;background:#EFE8DF;border-radius:20px;padding:13px 16px;margin-bottom:10px}
.paie .t,.manque .t{flex:1}.paie b,.manque b{display:block;font-weight:400;font-size:14px}.paie span,.manque span{font-size:12px;color:#6f665e}
.nouv{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:13px 16px;margin-bottom:10px;font-size:13px;cursor:pointer}
.nouv>i{width:8px;height:8px;border-radius:50%;background:var(--vert);flex:none}
.nouv b{font-weight:500}.nouv span:nth-child(2){flex:1}.nouv .fl{color:#b5aba1;font-size:18px}
.manque{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:13px 16px;margin-top:10px;border:1px dashed #CFC6BC}
.imprevu{display:block;width:100%;margin-top:10px;height:44px;border-radius:24px;border:1px solid rgba(30,28,27,.18);background:none;font-size:12.5px;color:#5d554e;cursor:pointer}
.avis .et5{letter-spacing:3px;font-size:13px}
.av-t{font-weight:300;font-size:16px;margin:6px 0 4px;line-height:1.35}
.av-s{font-size:12px;color:var(--gris)}
.dem{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ligne);font-size:12.5px;color:#5d554e}
.dem span{flex:1}
.bravo .adr{font-size:25px}
.conseil-t{font-size:13px;line-height:1.5;color:#5d554e;margin-top:14px}
.notif{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 12px;margin-top:10px}
.notif .cloche{width:34px;height:34px;border-radius:11px;background:var(--creme);display:grid;place-items:center;flex:none}
.notif .cloche svg{width:18px;height:18px;stroke:var(--noir);fill:none;stroke-width:1.4}
.notif .t{flex:1;min-width:0}
.notif b{display:block;font-weight:400;font-size:13px;line-height:1.3}
.notif .pil{padding:7px 11px;font-size:11.5px}
.pil.noir{background:var(--noir);color:var(--creme);border-color:var(--noir)}
.vide2{display:flex;align-items:center;gap:12px;padding:14px 16px}
.vide2 .t{flex:1}.vide2 b{display:block;font-weight:400;font-size:14.5px}.vide2 span{font-size:12px;color:var(--gris)}
.photo-ex{height:120px;border-radius:18px;background:#fff;margin:4px 0 6px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.photo-ex div{height:8px;border-radius:4px;background:#ECE6DF}.photo-ex div:nth-child(2n){width:70%}
.charge{height:4px;border-radius:2px;background:#E4DDD5;overflow:hidden;margin:20px 10px 10px}
.charge i{display:block;height:100%;width:40%;background:var(--noir);border-radius:2px;animation:charge 1.2s ease-in-out infinite}
@keyframes charge{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.pg{display:grid;grid-template-columns:30px repeat(6,1fr);gap:4px;align-items:center}
.pg span{font-size:10px;color:var(--gris);text-align:center;letter-spacing:.06em}
.pc{height:24px;border-radius:7px;border:0;background:#fff;cursor:pointer;padding:0}
.pc.on{background:var(--noir)}
.pc.ferme{background:repeating-linear-gradient(45deg,#ECE6DF 0 4px,#F6F3EF 4px 8px);cursor:default}
.pnav{display:flex;justify-content:space-between;margin-top:12px}
.vign{display:flex;gap:8px;flex-wrap:wrap;min-height:84px;background:#fff;border-radius:18px;padding:10px;margin:4px 0 6px;align-items:center}
.vide-ph{flex:1;text-align:center;font-size:12.5px;color:var(--gris)}
.ph{width:52px;height:64px;border-radius:10px;background:#EFE9E2;padding:8px 7px;display:flex;flex-direction:column;gap:6px;position:relative;animation:entre .3s both}
.ph div{height:4px;border-radius:2px;background:#D9D0C6}.ph div:nth-child(2){width:70%}
.ph b{position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--noir);color:var(--creme);font-size:10px;font-weight:400;display:grid;place-items:center}
.btn:disabled{opacity:.35;cursor:default}
.verif{background:#EFE8DF;border-radius:18px;padding:13px 16px;font-size:12.5px;line-height:1.5;color:#5d554e}
.verif b{display:block;font-weight:500;color:var(--noir);font-size:13.5px;margin-bottom:3px}
.manque-rdv{display:block;margin:12px auto 0;border:0;background:none;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.jai{display:flex;gap:10px;align-items:center;font-size:13px;margin:16px 2px 0;cursor:pointer}
.jai input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border:1.5px solid var(--noir);border-radius:6px;margin:0;position:relative;cursor:pointer}
.jai input:checked{background:var(--noir)}
.jai input:checked:after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:9px;border:solid var(--creme);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chiffres div{background:#fff;border-radius:20px;padding:14px 12px}
.chiffres b{display:block;font-weight:300;font-size:26px}
.chiffres span{font-size:11.5px;color:var(--gris);line-height:1.3;display:block}
/* cartes qui glissent (V3) */
.glis{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:0 22px;scrollbar-width:none}
.glis::-webkit-scrollbar{display:none}
.glis>div{flex:none;width:calc(100% - 26px);scroll-snap-align:center}
.pts{display:flex;justify-content:center;gap:6px;margin-top:10px}
.pts i{width:6px;height:6px;border-radius:3px;background:#D5CDC4;transition:width .3s,background .3s}
.pts i.on{width:18px;background:var(--noir)}
/* agenda */
.semaine{display:flex;justify-content:space-between;margin:4px 0 6px}
.semaine button{width:44px;height:62px;border-radius:22px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.semaine button small{font-size:10px;letter-spacing:.14em;color:var(--gris);text-transform:uppercase}
.semaine button b{font-weight:400;font-size:17px}
.semaine button i{width:4px;height:4px;border-radius:50%;background:transparent}
.semaine button.plein i{background:var(--gris)}
.semaine button.on{background:var(--noir);color:var(--creme)}
.semaine button.on small{color:rgba(246,243,239,.6)}
.semaine button.on i{background:var(--creme)}
/* clientes */
.cherche{height:46px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--gris);font-size:14px}
.cherche svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5}
.cli{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.cli:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:#EDE7E0;display:grid;place-items:center;font-size:14px;flex:none}
.cli .t{flex:1}
.cli b{display:block;font-weight:400;font-size:14.5px}
.cli span{font-size:12px;color:var(--gris)}
.cli em{font-style:normal;font-size:12px;color:var(--gris)}
/* listes de réglages */
.liste{background:#fff;border-radius:22px;padding:2px 18px}
.ligne{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--ligne);cursor:pointer;font-size:14.5px}
.ligne:last-child{border:0}
.ligne .t{flex:1;padding:10px 0}
.ligne .t span{display:block;font-size:12px;color:var(--gris);margin-top:2px}
.ligne em{font-style:normal;font-size:13px;color:var(--gris)}
.ligne .fl{color:#b5aba1;font-size:18px}
.sw{width:46px;height:28px;border-radius:14px;background:#DDD6CE;position:relative;flex:none;border:0;cursor:pointer;transition:background .25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .25s}
.sw.on{background:var(--noir)}
.sw.on:after{left:21px}
.seg{display:flex;gap:4px;background:#EAE5DF;border-radius:20px;padding:3px}
.seg button{border:0;background:none;border-radius:17px;height:30px;padding:0 11px;font-size:12px;color:#8a8076;cursor:pointer}
.seg button.on{background:var(--noir);color:var(--creme)}
.aide{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--gris);margin-top:22px;cursor:pointer}
.aide u{color:var(--noir)}

/* feuille + message */
.voile{position:absolute;inset:0;background:rgba(20,18,17,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
.feuille{position:absolute;left:0;right:0;bottom:0;background:var(--creme);border-radius:30px 30px 0 0;padding:12px 24px 34px;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:81;max-height:82%;overflow:auto;scrollbar-width:none;touch-action:pan-y}
.ecran.fe .voile{opacity:1;pointer-events:auto}
.ecran.fe .feuille{transform:none}
.poig{width:40px;height:4px;border-radius:2px;background:rgba(30,28,27,.2);margin:0 auto 14px}
.feuille h3{font-weight:300;font-size:24px;text-align:center;margin:4px 0 4px}
.feuille .sous{text-align:center;font-size:13px;color:var(--gris);margin-bottom:16px}
.qr{width:200px;height:200px;margin:6px auto 10px;background:#fff;border-radius:22px;padding:16px;display:grid;grid-template-columns:repeat(21,1fr)}
.qr i{background:transparent}.qr i.n{background:var(--noir)}
.feuille .btn{width:100%;margin-top:9px}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:var(--noir);color:var(--creme);font-size:12.5px;padding:11px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 3 styles d'onglets ===== */
.ong{position:absolute;z-index:70;display:flex}
.ong button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ong svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}
/* 1 : capsule noire flottante */
.ong.o1{left:16px;right:16px;bottom:22px;height:66px;border-radius:33px;background:rgba(30,28,27,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px;box-shadow:0 16px 34px -14px rgba(0,0,0,.55)}
.ong.o1 button{flex:1;border-radius:27px;color:rgba(246,243,239,.5);font-size:9.5px;letter-spacing:.08em;transition:background .3s,color .3s}
.ong.o1 button.on{background:rgba(246,243,239,.12);color:var(--creme)}
/* 2 : capsule claire, le bouton choisi s'élargit avec son nom */
.ong.o2{left:16px;right:16px;bottom:22px;height:64px;border-radius:32px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:7px;box-shadow:0 14px 34px -16px rgba(30,28,27,.4);justify-content:space-between}
.ong.o2 button{flex-direction:row;gap:8px;height:50px;min-width:50px;padding:0 13px;border-radius:25px;color:#8f857b;font-size:12.5px;transition:background .35s,color .35s,padding .35s}
.ong.o2 button span{display:none}
.ong.o2 button.on{background:var(--noir);color:var(--creme);padding:0 18px}
.ong.o2 button.on span{display:inline}
/* 3 : barre fine pleine largeur, petit trait sous le choisi */
.ong.o3{left:0;right:0;bottom:0;height:86px;background:rgba(246,243,239,.97);border-top:1px solid var(--ligne);padding:10px 6px 24px}
.ong.o3 button{flex:1;color:#a59b91;font-size:10px;letter-spacing:.1em;position:relative}
.ong.o3 button:before{content:"";position:absolute;top:-10px;left:50%;width:0;height:2px;background:var(--noir);transform:translateX(-50%);transition:width .3s}
.ong.o3 button.on{color:var(--noir)}
.ong.o3 button.on:before{width:26px}
</style>

   +'<div class="k">Aujourd’hui · 4 rendez-vous <a data-go="ag">Agenda</a></div>'+rdvs(true),
 3:()=>tete("Bonjour")+`<div class="glis"><div>${prochainNoir}</div><div>${siteNoir}</div></div><div class="pts"><i class="on"></i><i></i></div>`
   +'<div class="k">Aujourd’hui · 4 rendez-vous <a data-go="ag">Agenda</a></div>'+rdvs(true)
   +'<div class="k">Cette semaine</div><div class="chiffres"><div><b>12</b><span>réservations</span></div><div><b>86</b><span>visites de mon site</span></div><div><b>3</b><span>en liste d’attente</span></div></div>'};

const ETAPES=[["Mettre le lien dans ma bio Instagram","Vos abonnées réservent en un clic","bio"],["Imprimer mon QR code","Pour le salon et les cartes de visite","qr"],["Vérifier mes horaires et mes prix","Pour que tout soit juste","bientot"]];
const siteEnLigne=`<div class="noire siteb"><small>Bienvenue</small><div class="adr">Votre site est en ligne</div><div class="enl"><i></i>votre-onglerie.fr</div><div class="bts"><button class="plein" data-a="voir">Voir mon site</button><button data-a="partage">Partager</button></div></div>`;
const videJour=`<div class="k">Aujourd’hui</div><div class="blanche vide"><b>Pas encore de rendez-vous</b><span>Dès qu’une cliente réserve, elle apparaît ici et vous recevez un message.</span></div>`;
const monSiteCarte=`<div class="k">Mon site</div><div class="blanche"><div class="monsite"><div class="ic">${I.si}</div><div class="t"><b>votre-onglerie.fr</b><div class="enl"><i></i>En ligne</div></div><button class="pil" data-a="voir">Voir</button></div><div class="visites"><b>86</b> visites de mon site cette semaine</div>
   <div class="duo" style="margin-top:14px"><button class="btn" data-a="partage">${I.pa}Partager</button><button class="btn clair" data-a="qr" style="background:var(--creme)">${I.qr}QR code</button></div></div>`;
Object.assign(HOME,{
 j1:()=>tete("Bonjour")
   +`<div class="noire bravo"><small>Félicitations</small><div class="adr">Votre site est en ligne</div><div class="bts"><button class="plein" data-a="voir">Voir mon site</button></div></div>`
   +`<div class="notif"><div class="cloche"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg></div><div class="t"><b>Être prévenue à chaque réservation ?</b></div><button class="pil noir" data-a="notif">Oui</button><button class="pil" data-a="notif-non">Plus tard</button></div>`
   +`<div class="k">Mon site</div><div class="blanche"><div class="monsite"><div class="ic">${I.si}</div><div class="t"><b>votre-onglerie.fr</b><div class="enl"><i></i>En ligne</div></div></div>
     <div class="conseil-t">Partagez votre lien : bio Instagram, WhatsApp, SMS…</div>
     <div class="duo" style="margin-top:14px"><button class="btn" data-a="partage">${I.pa}Partager</button><button class="btn clair" data-a="qr" style="background:var(--creme)">${I.qr}QR code</button></div>
</div>`
   +`<div class="k">Aujourd’hui</div><div class="blanche vide2"><div class="t"><b>Pas encore de rendez-vous</b><span>Vous en avez déjà ? Ajoutez-les ici.</span></div><button class="pil noir" data-a="ajoutrdv">Ajouter</button></div>`,
 j2:()=>tete("Bonjour")+siteEnLigne
   +`<div class="k">Pour vos premières réservations</div><div class="blanche etape" data-n="0"><div class="barre3"><i class="on"></i><i></i><i></i></div><small class="en">Étape 1 sur 3</small><div class="et-t">${ETAPES[0][0]}</div><div class="et-s">${ETAPES[0][1]}</div><button class="btn" data-a="etape" style="width:100%;margin-top:16px">C’est parti</button><button class="plustard" data-a="etape-skip">Plus tard</button></div>`+videJour,
 j3:()=>tete("Bonjour")+siteEnLigne
   +'<div class="k">Pour vos premières réservations</div><div class="glis">'
   +ETAPES.map((e,i)=>`<div><div class="blanche carte-et"><small class="en">${i+1} / 3</small><div class="ic">${[I.cl,I.qr,I.re][i]}</div><div class="et-t">${e[0]}</div><div class="et-s">${e[1]}</div><button class="btn" data-a="${e[2]}" style="width:100%;margin-top:14px">${["Copier mon lien","Voir mon QR code","Vérifier"][i]}</button></div></div>`).join("")
   +'</div><div class="pts"><i class="on"></i><i></i><i></i></div>'+videJour,
 tout:()=>tete("Bonjour")
   +`<div class="paie"><div class="t"><b>Votre carte a expiré</b><span>Mettez-la à jour pour garder votre site en ligne.</span></div><button class="pil" data-a="bientot">Mettre à jour</button></div>`
   +`<div class="nouv" data-go="ag"><i></i><span><b>Depuis hier :</b> 2 nouvelles réservations · 1 annulation</span><span class="fl">›</span></div>`
   +prochainNoir
   +`<div class="manque"><div class="t"><b>Il manque 2 infos</b><span>Votre SIRET · le prix de « Nail art »</span></div><button class="pil" data-a="bientot">Compléter</button></div>`
   +'<div class="k">Aujourd’hui · 4 rendez-vous <a data-go="ag">Agenda</a></div>'+rdvs(true)
   +`<button class="imprevu" data-a="imprevu">Un imprévu ? Fermer ma journée</button>`
   +`<div class="k">Avis</div><div class="blanche avis"><div class="et5">★★★★★</div><div class="av-t">« Très soigneuse, mes ongles ont tenu un mois. »</div><div class="av-s">Nouvel avis Google · Julie</div>
     <div class="dem"><span>Le rendez-vous de Camille est fini</span><button class="pil" data-a="avis">Demander un avis</button></div></div>`
   +monSiteCarte});
const JOURS=[["Lun",2,1],["Mar",3,1],["Mer",4,0],["Jeu",5,1],["Ven",6,1],["Sam",7,1],["Dim",8,0]];
const AGENDA=()=>tete("Agenda","Novembre 2026")+'<div class="semaine">'+JOURS.map((j,i)=>`<button class="${j[2]?"plein":""}${i===0?" on":""}" data-jour="${i}"><small>${j[0]}</small><b>${j[1]}</b><i></i></button>`).join("")+'</div>'
  +'<div class="k" data-titre-jour>Lundi 2 · 4 rendez-vous</div><div data-liste-jour>'+rdvs(false)+'</div>'
  +`<button class="btn" data-a="nouveau" style="width:100%;margin-top:16px">Nouveau rendez-vous</button><button class="btn clair" data-a="bloque" style="width:100%;margin-top:9px">Bloquer un créneau</button>`;
const CLI=[["Léa","Pose américaine · aujourd’hui"],["Camille","Remplissage gel · aujourd’hui"],["Inès","Semi-permanent · aujourd’hui"],["Sarah","Nail art · aujourd’hui"],["Julie","Pose américaine · il y a 3 semaines"],["Manon","Remplissage gel · il y a 1 mois"]];
const CLIENTES=()=>tete("Clientes","24 clientes")+`<div class="cherche">${I.lo}Chercher une cliente</div><button class="btn" data-a="ajoutcli" style="width:100%;margin-top:10px">Ajouter une cliente</button>`
  +'<div class="k">Liste d’attente · 3</div><div class="carte">'
  +[["Clara","Veut un créneau lundi après-midi"],["Emma","N’importe quel jour avant 12 h"],["Lina","Samedi matin"]].map(c=>`<div class="cli" data-cli="${c[0]}"><div class="av">${c[0][0]}</div><div class="t"><b>${c[0]}</b><span>${c[1]}</span></div><button class="pil" data-a="propose">Proposer</button></div>`).join("")+'</div>'
  +'<div class="k">Toutes mes clientes</div><div class="carte">'+CLI.map(c=>`<div class="cli" data-cli="${c[0]}"><div class="av">${c[0][0]}</div><div class="t"><b>${c[0]}</b><span>${c[1]}</span></div><em>›</em></div>`).join("")+'</div>';
const MONSITE=()=>tete("Mon site","En ligne")+siteNoir
  +'<div class="k">Modifier mon site</div><div class="liste">'
  +[["Style et couleur","Site 1 · Noir · jour"],["Photos","6 photos"],["Prestations et prix","12 prestations"],["Horaires",""],["À propos de moi",""],["Langues","Français, anglais, italien, allemand, russe"]].map(l=>`<div class="ligne" data-a="bientot"><div class="t">${l[0]}${l[1]?`<span>${l[1]}</span>`:""}</div><span class="fl">›</span></div>`).join("")+'</div>'
  +'<div class="k">Faire connaître mon site</div><div class="liste">'
  +[["QR code à imprimer","Pour le salon, les cartes de visite","qr"],["Lien pour ma bio Instagram","","bio"],["Aperçu quand je partage le lien","Ce que voient les gens sur WhatsApp","apercu"]].map(l=>`<div class="ligne" data-a="${l[2]}"><div class="t">${l[0]}${l[1]?`<span>${l[1]}</span>`:""}</div><span class="fl">›</span></div>`).join("")+'</div>';
const sw=(on)=>`<button class="sw${on?" on":""}" data-sw></button>`;
const REGLAGES=()=>tete("Réglages","Mon compte")
  +'<div class="k">Mon site</div><div class="liste">'
  +`<div class="ligne"><div class="t">Apparence</div><div class="seg" data-seg><button class="on">Jour</button><button>Nuit</button><button>Auto</button></div></div>`
  +`<div class="ligne"><div class="t">Réservation en ligne<span>Sinon, les clientes vous appellent ou vous écrivent</span></div>${sw(1)}</div></div>`
  +'<div class="k">Notifications</div><div class="liste">'
  +`<div class="ligne"><div class="t">Me prévenir à chaque réservation<span>Et à chaque annulation</span></div><button class="sw" data-sw data-sw-notif></button></div></div>`
  +'<div class="k">Mes réservations</div><div class="liste">'
  +`<div class="ligne"><div class="t">Acompte à la réservation<span>Contre les rendez-vous oubliés</span></div>${sw(1)}</div>`
  +`<div class="ligne"><div class="t">SMS de confirmation et de rappel<span>Compris, sans limite</span></div>${sw(1)}</div>`
  +`<div class="ligne"><div class="t">Liste d’attente<span>Proposer les créneaux libérés</span></div>${sw(1)}</div>`
  +`<div class="ligne" data-a="bientot"><div class="t">Annulation<span>Jusqu’à quand une cliente peut annuler</span></div><em>24 h avant</em><span class="fl">›</span></div></div>`
  +'<div class="k">Mon salon</div><div class="liste">'
  +[["Horaires",""],["Congés et fermetures","Un bandeau s’affiche sur mon site"],["Adresse et comment me trouver",""]].map(l=>`<div class="ligne" data-a="bientot"><div class="t">${l[0]}${l[1]?`<span>${l[1]}</span>`:""}</div><span class="fl">›</span></div>`).join("")+'</div>'
  +'<div class="k">Mon abonnement</div><div class="liste">'
  +[["Loginail","49,99 € / mois · sans engagement"],["Mes factures",""],["Mon nom de domaine","votre-onglerie.fr · il vous appartient"]].map(l=>`<div class="ligne" data-a="bientot"><div class="t">${l[0]}${l[1]?`<span>${l[1]}</span>`:""}</div><span class="fl">›</span></div>`).join("")+'</div>'
  +'<div class="k">Légal</div><div class="liste">'
  +["Mentions légales","Conditions générales","Confidentialité"].map(l=>`<div class="ligne" data-a="bientot"><div class="t">${l}</div><span class="fl">›</span></div>`).join("")+'</div>'
  +'<div class="aide" data-a="aide">Besoin d’aide ? <u>Poser une question</u></div>';
const ONG=[["acc","Accueil"],["ag","Agenda"],["cl","Clientes"],["si","Mon site"],["re","Réglages"]];
const PAGES={acc:null,ag:AGENDA,cl:CLIENTES,si:MONSITE,re:REGLAGES};
// QR décoratif
const qr=()=>{let h="";const f=(x,y)=>(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const c=(x,y)=>{const a=x%7,b=y%7,X=x>13?x-14:x,Y=y>13?y-14:y;return(X===0||X===6||Y===0||Y===6)||(X>=2&&X<=4&&Y>=2&&Y<=4)};
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){let n=f(x,y)?c(x,y):((x*7+y*13+x*y)%5<2);h+=`<i class="${n?"n":""}"></i>`}return h};
document.querySelectorAll(".ecran").forEach(e=>{
  const v=e.dataset.v;
  e.innerHTML='<i class="ile"></i>'+Object.keys(PAGES).map(k=>`<div class="vue${k==="acc"?" on":""}" data-p="${k}">${k==="acc"?HOME[v]():PAGES[k]()}</div>`).join("")
   +`<nav class="ong o1">`+ONG.map((o,i)=>`<button class="${i?"":"on"}" data-go="${o[0]}">${I[o[0]]}<span>${o[1]}</span></button>`).join("")+'</nav>'
   +'<div class="voile"></div><div class="feuille"><div class="poig"></div><div class="fc"></div></div><div class="toast"></div>';
  const fe=e.querySelector(".feuille"),fc=e.querySelector(".fc"),toast=e.querySelector(".toast");
  const dit=t=>{toast.textContent=t;toast.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove("on"),1900)};
  const ouvre=h=>{fc.innerHTML=h;e.classList.add("fe")};const ferme=()=>e.classList.remove("fe");
  const va=p=>{e.querySelectorAll(".vue").forEach(x=>x.classList.toggle("on",x.dataset.p===p));e.querySelectorAll(".ong button").forEach(b=>b.classList.toggle("on",b.dataset.go===p));const vu=e.querySelector(`.vue[data-p="${p}"]`);vu.scrollTop=0};
  e.querySelector(".voile").onclick=ferme;
  /* glisser la feuille vers le bas pour la fermer */
  let y0=null;fe.addEventListener("pointerdown",ev=>{if(ev.target.closest("button"))return;y0=ev.clientY});
  addEventListener("pointermove",ev=>{if(y0===null)return;const z=parseFloat(getComputedStyle(e.closest(".tel")).zoom)||1,dy=Math.max(0,(ev.clientY-y0)/z);fe.style.transition="none";fe.style.transform=`translateY(${dy}px)`});
  addEventListener("pointerup",ev=>{if(y0===null)return;const z=parseFloat(getComputedStyle(e.closest(".tel")).zoom)||1,dy=(ev.clientY-y0)/z;y0=null;fe.style.transition="";fe.style.transform="";if(dy>80)ferme()});
  /* points des cartes qui glissent */
  e.querySelectorAll(".glis").forEach(g=>g.addEventListener("scroll",()=>{const n=g.children.length-1,k=Math.round(g.scrollLeft/(g.scrollWidth-g.clientWidth||1)*n);g.nextElementSibling.querySelectorAll("i").forEach((p,i)=>p.classList.toggle("on",i===k))},{passive:true}));
  e.addEventListener("change",ev=>{const c=ev.target.closest("[data-verif]");if(c){const b=fc.querySelector("[data-ok]");if(b)b.disabled=!c.checked}});
  e.addEventListener("click",ev=>{
    const t=ev.target;
    const sw_=t.closest("[data-sw]");if(sw_){sw_.classList.toggle("on");dit(sw_.classList.contains("on")?"Activé":"Désactivé");return}
    const sg=t.closest("[data-seg] button");if(sg){sg.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===sg));dit("Votre site passe en "+sg.textContent.toLowerCase());return}
    const go=t.closest("[data-go]");if(go){va(go.dataset.go);return}
    const j=t.closest("[data-jour]");if(j){const i=+j.dataset.jour,J=JOURS[i];e.querySelectorAll("[data-jour]").forEach(b=>b.classList.toggle("on",b===j));
      const nom=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"][i];
      e.querySelector("[data-titre-jour]").textContent=nom+" "+J[1]+(J[2]?" · 4 rendez-vous":" · fermé");
      e.querySelector("[data-liste-jour]").innerHTML=J[2]?rdvs(false):'<div class="carte"><div class="rdv libre"><div class="t"><b>Pas de rendez-vous</b><span>Jour de fermeture</span></div></div></div>';return}
    const a=t.closest("[data-a]");
    if(a){const k=a.dataset.a;ev.stopPropagation();
      if(k==="qr")ouvre(`<h3>Mon QR code</h3><div class="sous">À imprimer pour le salon ou les cartes de visite</div><div class="qr">${qr()}</div><div class="sous" style="margin:0 0 6px">votre-onglerie.fr</div><button class="btn" data-a="ok-pdf">Télécharger pour imprimer</button><button class="btn clair" data-a="ok-img">Enregistrer l’image</button>`);
      else if(k==="partage")ouvre(`<h3>Partager mon site</h3><div class="sous">votre-onglerie.fr</div><button class="btn" data-a="ok-copie">Copier le lien</button><button class="btn clair" data-a="ok-wa">WhatsApp</button><button class="btn clair" data-a="bio">Mettre dans ma bio Instagram</button><button class="btn clair" data-a="ok-sms">Par SMS</button>`);
      else if(k==="bio")ouvre(`<h3>Lien pour ma bio</h3><div class="sous">Copiez ce lien et collez-le dans votre profil Instagram, à « Site web »</div><div class="blanche" style="text-align:center;font-size:17px">votre-onglerie.fr</div><button class="btn" data-a="ok-copie">Copier le lien</button>`);
      else if(k==="apercu")ouvre(`<h3>Aperçu du lien</h3><div class="sous">Ce que voient les gens quand vous envoyez votre lien</div><div class="blanche" style="padding:0;overflow:hidden"><div style="height:120px;background:linear-gradient(135deg,#3a2c26,#7a5c50)"></div><div style="padding:12px 16px"><b style="font-weight:400">Votre onglerie · Votre ville</b><div style="font-size:12px;color:var(--gris)">Prothésiste ongulaire · réservez en ligne</div></div></div>`);
      else if(k==="appel")dit("Ouvre l’appel vers la cliente");
      else if(k==="msg")dit("Ouvre un message vers la cliente");
      else if(k==="voir")dit("Ouvre votre site");
      else if(k==="propose"){dit("Créneau proposé par SMS à la liste d’attente");a.textContent="Proposé ✓";a.disabled=true}
      else if(k==="nouveau")ouvre(`<h3>Nouveau rendez-vous</h3><div class="sous">Lundi 2 novembre</div><div class="liste"><div class="ligne"><div class="t">Cliente</div><em>Choisir</em><span class="fl">›</span></div><div class="ligne"><div class="t">Prestation</div><em>Choisir</em><span class="fl">›</span></div><div class="ligne"><div class="t">Heure</div><em>13:30</em><span class="fl">›</span></div></div><button class="btn" data-a="ok-rdv">Enregistrer</button>`);
      else if(k==="coche"){a.classList.toggle("ok");const n=e.querySelectorAll(".coche.ok").length;e.querySelector(".cpt").textContent=n+" / 4";if(a.classList.contains("ok"))dit(n===4?"Bravo, tout est prêt !":"C’est fait ✓")}
      else if(k==="etape"||k==="etape-skip"){const b=a.closest(".etape"),n=+b.dataset.n+1;if(n>2){b.innerHTML='<div class="et-t" style="text-align:center">Tout est prêt ✓</div><div class="et-s" style="text-align:center">Vos clientes peuvent réserver.</div>';dit("Bravo, tout est prêt !");return}
        b.dataset.n=n;b.querySelectorAll(".barre3 i").forEach((p,i)=>p.classList.toggle("on",i<=n));b.querySelector(".en").textContent="Étape "+(n+1)+" sur 3";b.querySelector(".et-t").textContent=ETAPES[n][0];b.querySelector(".et-s").textContent=ETAPES[n][1];if(k==="etape")dit("C’est fait ✓")}
      else if(k==="imprevu")ouvre(`<h3>Fermer aujourd’hui ?</h3><div class="sous">Vos 4 clientes du jour reçoivent un SMS pour choisir un autre créneau. Votre site affiche « Fermé aujourd’hui ».</div><button class="btn" data-a="ok-ferme">Fermer ma journée</button><button class="btn clair" data-a="ok-rien">Annuler</button>`);
      else if(k==="avis")dit("SMS envoyé à Camille pour laisser un avis");
      else if(k==="notif"||k==="notif-non"){const c=a.closest(".notif"),oui=k==="notif";c.innerHTML=c.querySelector(".cloche").outerHTML+'<div class="t"><b>'+(oui?"Notifications activées ✓":"Vous pourrez les activer dans Réglages")+'</b></div>';
        const n=e.querySelector("[data-sw-notif]");if(n)n.classList.toggle("on",oui);dit(oui?"Vous serez prévenue à chaque réservation":"D’accord, plus tard")}
      else if(k==="ajoutrdv")ouvre(`<h3>Ajouter mes rendez-vous</h3><div class="sous">Ceux que vous avez déjà, sans tout retaper</div><div class="liste">
        <div class="ligne" data-a="photo"><div class="t">Prendre mon agenda en photo<span>Agenda papier ou capture d’écran de votre ancien logiciel</span></div><span class="fl">›</span></div>
        <div class="ligne" data-a="pris"><div class="t">Marquer mes créneaux déjà pris<span>Sans recopier les détails, en 30 secondes</span></div><span class="fl">›</span></div>
        <div class="ligne" data-a="ok-tel"><div class="t">Depuis l’agenda de mon téléphone<span>iPhone ou Google Agenda</span></div><span class="fl">›</span></div>
        <div class="ligne" data-a="nouveau"><div class="t">Un par un<span>Prénom, prestation, heure</span></div><span class="fl">›</span></div></div>`);
      else if(k==="photo"){e._nph=0;ouvre(`<h3>Mon agenda en photo</h3><div class="sous">Mettez-en autant qu’il faut : une par jour, par semaine ou par page</div><div class="vign"><span class="vide-ph">Aucune photo pour l’instant</span></div><button class="btn" data-a="ajphoto" data-n="1">Prendre une photo</button><button class="btn clair" data-a="ajphoto" data-n="3">Choisir des captures d’écran</button><button class="btn lire" data-a="lecture" disabled>Lire mes photos</button><div class="sous" style="margin:12px 0 0;font-size:11.5px">Les photos sont effacées dès qu’elles sont lues.</div>`)}
      else if(k==="ajphoto"){const v=fc.querySelector(".vign");if(!e._nph)v.innerHTML="";const n=+a.dataset.n;for(let x=0;x<n;x++){e._nph++;v.insertAdjacentHTML("beforeend",`<div class="ph"><div></div><div></div><div></div><b>${e._nph}</b></div>`)}
        const l=fc.querySelector(".lire");l.disabled=false;l.textContent="Lire mes "+e._nph+" photo"+(e._nph>1?"s":"");dit(n>1?n+" captures ajoutées":"Photo ajoutée")}
      else if(k==="lecture"){const N=e._nph||1;ouvre(`<h3>Lecture en cours…</h3><div class="sous">${N} photo${N>1?"s":""} · quelques secondes</div><div class="charge"><i></i></div>`);
        const R=[["Mar 3","09:30","Julie","Pose américaine"],["Mar 3","11:30","Manon","Remplissage gel"],["Jeu 5","10:00","Emma","Semi-permanent pieds"],["Jeu 5","13:00","Lina","Pose américaine"],["Ven 6","09:00","Jade","Pose américaine"],["Sam 7","09:00","Rose","Nail art"]];
        const parPh=Array.from({length:N},(_,x)=>R.slice(Math.round(x*R.length/N),Math.round((x+1)*R.length/N)));
        setTimeout(()=>{if(!e.classList.contains("fe"))return;fc.innerHTML=`<h3>${R.length} rendez-vous trouvés</h3><div class="sous">sur vos ${N} photo${N>1?"s":""}</div>
          <div class="verif"><b>Prenez le temps de bien tout vérifier</b>Dates, heures, prénoms et prestations : comparez avec vos photos. Si quelque chose est faux, touchez « Modifier ». S’il en manque un, ajoutez-le.</div>`
          +parPh.map((L,x)=>`<div class="k">Photo ${x+1} · ${L.length} rendez-vous</div><div class="carte">`+L.map(r=>`<div class="rdv"><div class="h" style="width:58px"><b style="font-weight:400;font-size:12px;display:block;color:var(--gris)">${r[0]}</b>${r[1]}</div><div class="t"><b>${r[2]}</b><span>${r[3]}</span></div><button class="pil" data-a="bientot">Modifier</button></div>`).join("")+`</div>`).join("")
          +`<button class="manque-rdv" data-a="nouveau">Il en manque un ? L’ajouter</button>
          <label class="jai"><input type="checkbox" data-verif><span>J’ai bien tout vérifié, tout est juste</span></label>
          <button class="btn" data-a="ok-import" data-ok disabled>C’est bon, ajouter</button>`},1400)}
      else if(k==="pris"){let g='<div class="pg"><span></span>'+["Lun","Mar","Mer","Jeu","Ven","Sam"].map(d=>`<span>${d}</span>`).join("");for(let h=9;h<19;h++){g+=`<span>${h}h</span>`;for(let d=0;d<6;d++)g+=`<button class="pc${d===2?" ferme":""}" data-a="case"></button>`}g+='</div>';
        ouvre(`<h3>Mes créneaux déjà pris</h3><div class="sous">Touchez les heures déjà occupées · semaine du 2 novembre</div>${g}<div class="pnav"><button class="pil" data-a="bientot">‹ Semaine d’avant</button><button class="pil" data-a="bientot">Semaine d’après ›</button></div><button class="btn" data-a="ok-pris">Enregistrer</button>`)}
      else if(k==="case"){if(!a.classList.contains("ferme"))a.classList.toggle("on")}
      else if(k==="ajoutcli")ouvre(`<h3>Ajouter une cliente</h3><div class="sous">Juste l’essentiel</div><div class="liste"><div class="ligne"><div class="t">Prénom</div><em>Écrire</em></div><div class="ligne"><div class="t">Téléphone</div><em>Pour les SMS de rappel</em></div><div class="ligne"><div class="t">Note</div><em>Facultatif</em></div></div><button class="btn" data-a="ok-cli">Enregistrer</button>`);
      else if(k==="bloque")dit("Choisissez le créneau à bloquer");
      else if(k==="aide")ouvre(`<h3>Besoin d’aide ?</h3><div class="sous">Posez votre question, la réponse arrive tout de suite</div><div class="blanche" style="font-size:13.5px;color:var(--gris)">Exemple : « Comment changer mes horaires ? »</div><button class="btn" data-a="ok-q">Envoyer</button>`);
      else if(k.startsWith("ok-")){ferme();dit({"ok-copie":"Lien copié","ok-wa":"Ouvre WhatsApp","ok-sms":"Ouvre vos messages","ok-pdf":"QR code prêt à imprimer","ok-img":"Image enregistrée","ok-rdv":"Rendez-vous enregistré","ok-q":"Question envoyée","ok-cli":"Cliente ajoutée","ok-ferme":"Journée fermée · SMS envoyés","ok-rien":"Rien n’a changé","ok-tel":"Vos rendez-vous du téléphone sont ajoutés","ok-import":"6 rendez-vous ajoutés","ok-pris":"Créneaux bloqués : vos clientes ne pourront pas réserver dessus","ok-fichier":"Choisissez votre fichier"}[k])}
      else dit("Cette page viendra ensuite");
      return}
    const r=t.closest("[data-rdv]");if(r){const n=r.dataset.rdv,R=RDV.find(x=>x[1]===n);
      ouvre(`<h3>${n}</h3><div class="sous">${R?R[0]+" · "+R[2]:""}</div><div class="duo"><button class="btn" data-a="appel">Appeler</button><button class="btn clair" data-a="msg">Message</button></div><button class="btn clair" data-a="bientot">Déplacer le rendez-vous</button><button class="btn clair" data-a="bientot">Annuler le rendez-vous</button>`);return}
    const c=t.closest("[data-cli]");if(c){const n=c.dataset.cli;ouvre(`<div style="display:flex;justify-content:center"><div class="av" style="width:64px;height:64px;font-size:22px">${n[0]}</div></div><h3>${n}</h3><div class="sous">Cliente depuis 2025 · 8 visites</div><div class="duo"><button class="btn" data-a="appel">Appeler</button><button class="btn clair" data-a="msg">Message</button></div><div class="k">Notes</div><div class="blanche" style="font-size:13.5px;color:var(--gris)">Aime les formes amande · couleurs nude</div>`);return}
  });
});
document.querySelectorAll(".reglages button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".reglages button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".col").forEach(c=>c.classList.toggle("vis",c.dataset.col===b.dataset.c))});
function ajuste(){const z=Math.min(1,(innerHeight-130)/866,(innerWidth-120)/(2*412));document.documentElement.style.setProperty("--z",z.toFixed(3))}
addEventListener("resize",ajuste);ajuste();
</script>
