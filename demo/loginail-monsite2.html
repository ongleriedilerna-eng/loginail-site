<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loginail · Agenda</title>
<style>
:root{--noir:#1E1C1B;--creme:#F6F3EF;--gris:#8a8076;--ligne:rgba(30,28,27,.08);--vert:#6E9A66}
*{box-sizing:border-box}
body{margin:0;background:#E7E2DC;font-family:Jost,sans-serif;color:var(--noir);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.bandeau{text-align:center;padding:16px 16px 4px;font-size:12px;letter-spacing:.06em;color:#6f665e}
.bandeau b{font-weight:500;color:var(--noir);letter-spacing:.18em;text-transform:uppercase;font-size:11px;display:block;margin-bottom:4px}
.rangee{display:flex;justify-content:safe center;align-items:flex-start;gap:28px;padding:12px 16px 28px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.code{white-space:nowrap;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#5d554e}
.code b{color:var(--noir);font-weight:500;margin-right:6px}
.tel{zoom:var(--z,1);width:412px;height:866px;border-radius:64px;background:#0d0d0d;padding:11px;position:relative;box-shadow:0 0 0 2px #2a2a2a inset,0 30px 60px -20px rgba(30,28,27,.45)}
.ecran{width:390px;height:844px;border-radius:53px;overflow:hidden;position:relative;background:var(--creme);isolation:isolate}
.ile{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;z-index:60}
.reglages{display:none;justify-content:center;gap:12px;padding:10px 12px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.reglages div{display:flex;gap:6px}
.reglages button{border:1px solid rgba(30,28,27,.25);background:none;border-radius:16px;padding:6px 11px;letter-spacing:.14em;cursor:pointer}
.reglages button.on{background:var(--noir);color:var(--creme);border-color:var(--noir)}
@media (max-width:699px){
  body{background:var(--creme)}.bandeau{display:none}
  .reglages{display:flex;height:46px;align-items:center;border-bottom:1px solid var(--ligne)}
  .rangee{padding:0;display:block}.col{display:none}.col.vis{display:block}.code{display:none}
  .tel{zoom:1!important;width:100vw;height:calc(100dvh - 46px);padding:0;border-radius:0;box-shadow:none;background:none}
  .ecran{width:100%;height:100%;border-radius:0}.ile{display:none}
}

/* pages */
.vue{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:62px 22px 120px;display:none}
.vue::-webkit-scrollbar{display:none}
.vue.on{display:block;animation:entre .35s both}
@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tete small{display:block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris)}
.tete h1{font-weight:300;font-size:30px;margin:4px 0 0;letter-spacing:.01em}
.rond{width:42px;height:42px;border-radius:50%;background:#E4DDD5;display:grid;place-items:center;font-size:13px;letter-spacing:.04em;border:0;cursor:pointer}
.k{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris);margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.k a{letter-spacing:.06em;text-transform:none;font-size:12px;color:var(--noir);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.carte{background:#fff;border-radius:22px;padding:4px 18px}
.rdv{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.rdv:last-child{border:0}
.rdv .h{width:46px;font-size:14px}
.rdv .t{flex:1;min-width:0}
.rdv .t b{display:block;font-weight:400;font-size:14.5px}
.rdv .t span{font-size:12px;color:var(--gris)}
.rdv .ac{font-size:11px;color:#5E7A58;display:flex;align-items:center;gap:5px}
.rdv .ac i{width:6px;height:6px;border-radius:50%;background:var(--vert)}
.rdv.libre .t b{color:var(--gris);font-style:italic}
.pil{border:1px solid rgba(30,28,27,.2);background:none;border-radius:18px;padding:7px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.duo{display:flex;gap:8px}
.duo button{flex:1}
.btn{height:46px;border-radius:26px;border:0;background:var(--noir);color:var(--creme);font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.clair{background:#fff;color:var(--noir)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5}
.noire{background:var(--noir);color:var(--creme);border-radius:26px;padding:20px 22px}
.noire small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.65}
.prochain .l1{display:flex;align-items:baseline;gap:12px;margin:10px 0 2px}
.prochain .l1 b{font-weight:300;font-size:38px}
.prochain .l1 span{font-size:13px;opacity:.75}
.prochain .nom{font-size:18px;font-weight:300}
.prochain .pr{font-size:13px;opacity:.7;margin-top:2px}
.noire .bts{display:flex;gap:8px;margin-top:16px}
.noire .bts button{flex:1;height:42px;border-radius:22px;border:1px solid rgba(246,243,239,.3);background:none;color:var(--creme);font-size:12.5px;cursor:pointer}
.noire .bts button.plein{background:var(--creme);color:var(--noir);border-color:var(--creme)}
.siteb .adr{font-weight:300;font-size:23px;margin:8px 0 4px}
.enl{font-size:12px;display:flex;align-items:center;gap:6px}
.enl i{width:7px;height:7px;border-radius:50%;background:currentColor}
.noire .enl{opacity:.85}
.blanche{background:#fff;border-radius:24px;padding:18px 20px}
.monsite{display:flex;align-items:center;gap:14px}
.monsite .ic{width:44px;height:44px;border-radius:14px;background:var(--creme);display:grid;place-items:center}
.monsite .ic svg{width:22px;height:22px;stroke:var(--noir);fill:none;stroke-width:1.3}
.monsite .t{flex:1}
.monsite b{display:block;font-weight:400;font-size:15.5px}
.monsite .enl{color:#5E7A58}
.prochainb{display:flex;gap:16px;align-items:center}
.prochainb .hh{font-weight:300;font-size:34px;line-height:1}
.prochainb .t{flex:1}
.prochainb small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris)}
.prochainb b{display:block;font-weight:400;font-size:16px;margin-top:4px}
.prochainb span{font-size:12.5px;color:var(--gris)}
.visites{margin-top:14px;padding-top:12px;border-top:1px solid var(--ligne);font-size:13px;color:var(--gris)}
.visites b{font-weight:400;font-size:17px;color:var(--noir);margin-right:4px}
.vide b{display:block;font-weight:400;font-size:15px;margin-bottom:4px}
.vide span{font-size:12.5px;color:var(--gris);line-height:1.45}
.cpt{letter-spacing:.1em;color:var(--noir)}
.coche{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.coche:last-child{border:0}
.coche>i{width:24px;height:24px;border-radius:50%;border:1.5px solid #CFC6BC;flex:none;position:relative;transition:background .25s,border-color .25s}
.coche.ok>i{background:var(--noir);border-color:var(--noir)}
.coche.ok>i:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;border:solid var(--creme);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.coche.ok b{text-decoration:line-through;color:var(--gris)}
.coche .t{flex:1}.coche b{display:block;font-weight:400;font-size:14.5px}.coche span{font-size:12px;color:var(--gris)}
.coche .fl{color:#b5aba1;font-size:18px}
.barre3{display:flex;gap:5px;margin-bottom:12px}.barre3 i{flex:1;height:3px;border-radius:2px;background:#E4DDD5}.barre3 i.on{background:var(--noir)}
.en{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gris)}
.et-t{font-weight:300;font-size:21px;margin:8px 0 4px;line-height:1.2}
.et-s{font-size:13px;color:var(--gris)}
.plustard{display:block;margin:10px auto 0;border:0;background:none;font-size:12.5px;color:var(--gris);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.carte-et .ic{width:44px;height:44px;border-radius:14px;background:var(--creme);display:grid;place-items:center;margin:12px 0 4px}
.carte-et .ic svg{width:22px;height:22px;stroke:var(--noir);fill:none;stroke-width:1.3}
.paie{display:flex;align-items:center;gap:12px;background:#EFE8DF;border-radius:20px;padding:13px 16px;margin-bottom:10px}
.paie .t,.manque .t{flex:1}.paie b,.manque b{display:block;font-weight:400;font-size:14px}.paie span,.manque span{font-size:12px;color:#6f665e}
.nouv{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:13px 16px;margin-bottom:10px;font-size:13px;cursor:pointer}
.nouv>i{width:8px;height:8px;border-radius:50%;background:var(--vert);flex:none}
.nouv b{font-weight:500}.nouv span:nth-child(2){flex:1}.nouv .fl{color:#b5aba1;font-size:18px}
.manque{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:13px 16px;margin-top:10px;border:1px dashed #CFC6BC}
.imprevu{display:block;width:100%;margin-top:10px;height:44px;border-radius:24px;border:1px solid rgba(30,28,27,.18);background:none;font-size:12.5px;color:#5d554e;cursor:pointer}
.avis .et5{letter-spacing:3px;font-size:13px}
.av-t{font-weight:300;font-size:16px;margin:6px 0 4px;line-height:1.35}
.av-s{font-size:12px;color:var(--gris)}
.dem{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ligne);font-size:12.5px;color:#5d554e}
.dem span{flex:1}
.bravo .adr{font-size:25px}
.conseil-t{font-size:13px;line-height:1.5;color:#5d554e;margin-top:14px}
.notif{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 12px;margin-top:10px}
.notif .cloche{width:34px;height:34px;border-radius:11px;background:var(--creme);display:grid;place-items:center;flex:none}
.notif .cloche svg{width:18px;height:18px;stroke:var(--noir);fill:none;stroke-width:1.4}
.notif .t{flex:1;min-width:0}
.notif b{display:block;font-weight:400;font-size:13px;line-height:1.3}
.notif .pil{padding:7px 11px;font-size:11.5px}
.pil.noir{background:var(--noir);color:var(--creme);border-color:var(--noir)}
.vide2{display:flex;align-items:center;gap:12px;padding:14px 16px}
.vide2 .t{flex:1}.vide2 b{display:block;font-weight:400;font-size:14.5px}.vide2 span{font-size:12px;color:var(--gris)}
.photo-ex{height:120px;border-radius:18px;background:#fff;margin:4px 0 6px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.photo-ex div{height:8px;border-radius:4px;background:#ECE6DF}.photo-ex div:nth-child(2n){width:70%}
.charge{height:4px;border-radius:2px;background:#E4DDD5;overflow:hidden;margin:20px 10px 10px}
.charge i{display:block;height:100%;width:40%;background:var(--noir);border-radius:2px;animation:charge 1.2s ease-in-out infinite}
@keyframes charge{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.pg{display:grid;grid-template-columns:30px repeat(6,1fr);gap:4px;align-items:center}
.pg span{font-size:10px;color:var(--gris);text-align:center;letter-spacing:.06em}
.pc{height:24px;border-radius:7px;border:0;background:#fff;cursor:pointer;padding:0}
.pc.on{background:var(--noir)}
.pc.ferme{background:repeating-linear-gradient(45deg,#ECE6DF 0 4px,#F6F3EF 4px 8px);cursor:default}
.pnav{display:flex;justify-content:space-between;margin-top:12px}
.vign{display:flex;gap:8px;flex-wrap:wrap;min-height:84px;background:#fff;border-radius:18px;padding:10px;margin:4px 0 6px;align-items:center}
.vide-ph{flex:1;text-align:center;font-size:12.5px;color:var(--gris)}
.ph{width:52px;height:64px;border-radius:10px;background:#EFE9E2;padding:8px 7px;display:flex;flex-direction:column;gap:6px;position:relative;animation:entre .3s both}
.ph div{height:4px;border-radius:2px;background:#D9D0C6}.ph div:nth-child(2){width:70%}
.ph b{position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--noir);color:var(--creme);font-size:10px;font-weight:400;display:grid;place-items:center}
.btn:disabled{opacity:.35;cursor:default}
.verif{background:#EFE8DF;border-radius:18px;padding:13px 16px;font-size:12.5px;line-height:1.5;color:#5d554e}
.verif b{display:block;font-weight:500;color:var(--noir);font-size:13.5px;margin-bottom:3px}
.manque-rdv{display:block;margin:12px auto 0;border:0;background:none;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.jai{display:flex;gap:10px;align-items:center;font-size:13px;margin:16px 2px 0;cursor:pointer}
.jai input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border:1.5px solid var(--noir);border-radius:6px;margin:0;position:relative;cursor:pointer}
.jai input:checked{background:var(--noir)}
.jai input:checked:after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:9px;border:solid var(--creme);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
/* grille horaire */
.grille{position:relative;height:660px;margin-top:4px}
.gh{position:absolute;left:0;right:0;border-top:1px solid var(--ligne);height:0}
.gh span{position:absolute;left:0;top:-8px;font-size:10.5px;color:var(--gris);background:var(--creme);padding-right:6px}
.gbloc,.glibre{position:absolute;left:46px;right:0;border-radius:14px;padding:7px 12px;overflow:hidden;cursor:pointer}
.gbloc{background:#fff;box-shadow:0 1px 0 rgba(30,28,27,.05);border-left:3px solid var(--noir)}
.gbloc.ac{border-left-color:var(--vert)}
.gbloc b{display:block;font-weight:400;font-size:13.5px}
.gbloc span{font-size:11px;color:var(--gris);white-space:nowrap}
.glibre{border:1px dashed #D3CAC0;display:flex;align-items:center;justify-content:center}
.glibre span{font-size:11px;color:#a59b91}
.gmaint{position:absolute;left:40px;right:0;height:0;border-top:1.5px solid var(--noir);z-index:2}
.gmaint i{position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--noir)}
.gferme{position:absolute;left:46px;right:0;top:30px;text-align:center;color:var(--gris);font-style:italic}
/* mois */
.mois{background:#fff;border-radius:22px;padding:12px 10px 8px}
.mj,.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mj span{text-align:center;font-size:10px;letter-spacing:.14em;color:var(--gris);padding:2px 0 6px}
.mg button{height:44px;border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.mg button b{font-weight:400;font-size:14px}
.mg button span{font-size:9px;letter-spacing:1px;color:var(--gris);height:10px;line-height:10px}
.mg button.ferme b{color:#c3b9af}
.mg button.on{background:var(--noir);color:var(--creme)}
.mg button.on span{color:rgba(246,243,239,.7)}
/* B1 page lignée */
.pap{position:relative;background:#FBF9F6;border-radius:18px;margin-top:4px;padding-left:52px;box-shadow:0 1px 0 rgba(30,28,27,.05);overflow:hidden}
.pap:before{content:"";position:absolute;left:46px;top:0;bottom:0;width:1px;background:#E6D9CB}
.pl{height:30px;border-bottom:1px solid #EFE8E0;position:relative;cursor:pointer}
.pl.plein{border-bottom-color:#EFE8E0}
.pl span{position:absolute;left:-44px;top:4px;width:34px;text-align:right;font-size:12px;color:#9b9188}
.pap .pr{position:absolute;left:58px;right:10px;padding:4px 12px;background:#F1ECE6;border-radius:12px;cursor:pointer;overflow:hidden}
.pap .pr b{display:block;font-weight:400;font-size:14.5px;line-height:1.3}
.pap .pr span{font-size:11.5px;color:#7d746b}
.pferme{position:absolute;left:52px;right:0;top:40px;text-align:center;color:var(--gris);font-style:italic}
/* B2 une ligne par heure */
.heures{padding:0 16px}
.hl{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--ligne);cursor:pointer}
.hl:last-child{border:0}
.hl .hh{width:38px;font-weight:300;font-size:19px;color:var(--noir)}
.hl .t{flex:1}
.hl .t b{display:block;font-weight:400;font-size:14.5px}
.hl .t span{font-size:12px;color:var(--gris)}
.hl.suite .hh,.hl.libre .hh{color:#bdb3a9}
.hl.suite .t span{font-style:italic;color:#b0a69c}
.hl.libre .t span{color:#b0a69c}
.hl em{font-style:normal;font-size:12px;color:var(--noir);text-decoration:underline;text-underline-offset:3px}
.hl .ac{font-size:11px;color:#5E7A58;display:flex;align-items:center;gap:5px}.hl .ac i{width:6px;height:6px;border-radius:50%;background:var(--vert)}
/* B3 la journée qui se lit */
.tl{position:relative;margin-top:6px}
.tr,.tli{display:flex;gap:12px;cursor:pointer}
.tr{margin-bottom:8px}
.th{width:48px;flex:none;text-align:right;padding-top:10px}
.th b{display:block;font-weight:400;font-size:15px}
.th span{display:block;font-size:11px;color:var(--gris);margin-top:2px}
.tb{flex:1;background:#fff;border-radius:18px;padding:11px 15px;display:flex;flex-direction:column;justify-content:center}
.tb b{font-weight:400;font-size:15.5px}
.tb span{font-size:12.5px;color:#6f665e;margin-top:1px}
.tb em{font-style:normal;font-size:11px;color:var(--gris);margin-top:5px}
.tb.ac em{color:#5E7A58}
.tli{margin-bottom:8px}
.tli .th{padding-top:6px}
.tlb{flex:1;border:1px dashed #D3CAC0;border-radius:14px;padding:8px 14px;font-size:12px;color:#9b9188}
.tlb u{color:var(--noir);text-underline-offset:3px}
.tfe{text-align:center;color:var(--gris);font-style:italic;padding:30px 0}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chiffres div{background:#fff;border-radius:20px;padding:14px 12px}
.chiffres b{display:block;font-weight:300;font-size:26px}
.chiffres span{font-size:11.5px;color:var(--gris);line-height:1.3;display:block}
/* cartes qui glissent (V3) */
.glis{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:0 22px;scrollbar-width:none}
.glis::-webkit-scrollbar{display:none}
.glis>div{flex:none;width:calc(100% - 26px);scroll-snap-align:center}
.pts{display:flex;justify-content:center;gap:6px;margin-top:10px}
.pts i{width:6px;height:6px;border-radius:3px;background:#D5CDC4;transition:width .3s,background .3s}
.pts i.on{width:18px;background:var(--noir)}
/* agenda */
.semaine{display:flex;justify-content:space-between;margin:4px 0 6px}
.semaine button{width:44px;height:62px;border-radius:22px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.semaine button small{font-size:10px;letter-spacing:.14em;color:var(--gris);text-transform:uppercase}
.semaine button b{font-weight:400;font-size:17px}
.semaine button i{width:4px;height:4px;border-radius:50%;background:transparent}
.semaine button.plein i{background:var(--gris)}
.semaine button.on{background:var(--noir);color:var(--creme)}
.semaine button.on small{color:rgba(246,243,239,.6)}
.semaine button.on i{background:var(--creme)}
/* clientes */
.cherche{height:46px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--gris);font-size:14px}
.cherche svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5}
.cli{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.cli:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:#EDE7E0;display:grid;place-items:center;font-size:14px;flex:none}
.cli .t{flex:1}
.cli b{display:block;font-weight:400;font-size:14.5px}
.cli span{font-size:12px;color:var(--gris)}
.cli em{font-style:normal;font-size:12px;color:var(--gris)}
/* listes de réglages */
.liste{background:#fff;border-radius:22px;padding:2px 18px}
.ligne{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--ligne);cursor:pointer;font-size:14.5px}
.ligne:last-child{border:0}
.ligne .t{flex:1;padding:10px 0}
.ligne .t span{display:block;font-size:12px;color:var(--gris);margin-top:2px}
.ligne em{font-style:normal;font-size:13px;color:var(--gris)}
.ligne .fl{color:#b5aba1;font-size:18px}
.sw{width:46px;height:28px;border-radius:14px;background:#DDD6CE;position:relative;flex:none;border:0;cursor:pointer;transition:background .25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .25s}
.sw.on{background:var(--noir)}
.sw.on:after{left:21px}
.seg{display:flex;gap:4px;background:#EAE5DF;border-radius:20px;padding:3px}
.seg button{border:0;background:none;border-radius:17px;height:30px;padding:0 11px;font-size:12px;color:#8a8076;cursor:pointer}
.seg button.on{background:var(--noir);color:var(--creme)}
.aide{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--gris);margin-top:22px;cursor:pointer}
.aide u{color:var(--noir)}

/* feuille + message */
.voile{position:absolute;inset:0;background:rgba(20,18,17,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
.feuille{position:absolute;left:0;right:0;bottom:0;background:var(--creme);border-radius:30px 30px 0 0;padding:12px 24px 34px;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:81;max-height:82%;overflow:auto;scrollbar-width:none;touch-action:pan-y}
.ecran.fe .voile{opacity:1;pointer-events:auto}
.ecran.fe .feuille{transform:none}
.poig{width:40px;height:4px;border-radius:2px;background:rgba(30,28,27,.2);margin:0 auto 14px}
.feuille h3{font-weight:300;font-size:24px;text-align:center;margin:4px 0 4px}
.feuille .sous{text-align:center;font-size:13px;color:var(--gris);margin-bottom:16px}
.qr{width:200px;height:200px;margin:6px auto 10px;background:#fff;border-radius:22px;padding:16px;display:grid;grid-template-columns:repeat(21,1fr)}
.qr i{background:transparent}.qr i.n{background:var(--noir)}
.feuille .btn{width:100%;margin-top:9px}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:var(--noir);color:var(--creme);font-size:12.5px;padding:11px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 3 styles d'onglets ===== */
.ong{position:absolute;z-index:70;display:flex}
.ong button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ong svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}
/* 1 : capsule noire flottante */
.ong.o1{left:16px;right:16px;bottom:22px;height:66px;border-radius:33px;background:rgba(30,28,27,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px;box-shadow:0 16px 34px -14px rgba(0,0,0,.55)}
.ong.o1 button{flex:1;border-radius:27px;color:rgba(246,243,239,.5);font-size:9.5px;letter-spacing:.08em;transition:background .3s,color .3s}
.ong.o1 button.on{background:rgba(246,243,239,.12);color:var(--creme)}
/* 2 : capsule claire, le bouton choisi s'élargit avec son nom */
.ong.o2{left:16px;right:16px;bottom:22px;height:64px;border-radius:32px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:7px;box-shadow:0 14px 34px -16px rgba(30,28,27,.4);justify-content:space-between}
.ong.o2 button{flex-direction:row;gap:8px;height:50px;min-width:50px;padding:0 13px;border-radius:25px;color:#8f857b;font-size:12.5px;transition:background .35s,color .35s,padding .35s}
.ong.o2 button span{display:none}
.ong.o2 button.on{background:var(--noir);color:var(--creme);padding:0 18px}
.ong.o2 button.on span{display:inline}
/* 3 : barre fine pleine largeur, petit trait sous le choisi */
.ong.o3{left:0;right:0;bottom:0;height:86px;background:rgba(246,243,239,.97);border-top:1px solid var(--ligne);padding:10px 6px 24px}
.ong.o3 button{flex:1;color:#a59b91;font-size:10px;letter-spacing:.1em;position:relative}
.ong.o3 button:before{content:"";position:absolute;top:-10px;left:50%;width:0;height:2px;background:var(--noir);transform:translateX(-50%);transition:width .3s}
.ong.o3 button.on{color:var(--noir)}
.ong.o3 button.on:before{width:26px}
/* l'espace pro prend la couleur de son site */
.code i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.semaine button.on,.btn:not(.clair),.pil.noir,.mg button.on,.noire{background:var(--acc,var(--noir))}
.ong.o1{background:var(--acc,rgba(30,28,27,.94))}

.chips{display:flex;flex-wrap:wrap;gap:6px}

const PRESTA=[["Pose américaine",90],["Remplissage gel",60],["Semi-permanent mains",45],["Nail art",60]];
const RAP=(d,r)=>r[2]==="Camille"?["sans","Pas de rappel"]:d===0?["ok","✓ rappel"]:d===1?["soir","Rappel ce soir"]:["plus","Rappel la veille"];
const RAPF=(k,n)=>({ok:'<div class="rap-f">✓ SMS de rappel envoyé hier à 18:00</div>',
  sans:`<div class="rap-f sans">Pas de rappel : ${n} n’a pas de numéro de téléphone.</div><button class="btn clair" data-a="modcli" data-n="${n}" style="width:100%;margin-top:10px">Ajouter son numéro</button>`,
  soir:'<div class="rap-f">Le SMS de rappel partira ce soir à 18:00</div>',
  plus:'<div class="rap-f">Le SMS de rappel partira la veille à 18:00</div>'})[k]||"";
AG.q=(d=0)=>{const L=SEM[d],R=30;let g='<div class="pap">';
  for(let m=OUV;m<FERM;m+=30)g+=`<div class="pl${m%60?"":" plein"}" data-a="slot" data-h="${hm(m)}">${m%60?"":`<span>${m/60}h</span>`}</div>`;
  if(L){const libreA=(a,b)=>!L.some(r=>a<r[0]+r[1]+15&&b>r[0]);
    [[780,900,"Pause · selon vos horaires"],[1080,FERM,"Fermé"]].filter(z=>!L.some(r=>r[0]<z[1]&&r[0]+r[1]>z[0])).forEach(z=>{g+=`<div class="ppause" style="top:${(z[0]-OUV)/30*R}px;height:${(z[1]-z[0])/30*R}px"><span>${z[2]}</span></div>`});
    L.forEach((r,k)=>{const nx=L[k+1],buf=!nx||nx[0]>=r[0]+r[1]+15;
      g+=`<div class="pr prq" data-rap="${RAP(d,r)[0]}" data-rdv="${r[2]}" data-info="${hm(r[0])} · ${r[3]} · ${duree(r[1])}" style="top:${(r[0]-OUV)/30*R}px;height:${r[1]/30*R}px"><b><strong>${hm(r[0])} – ${hm(r[0]+r[1])}</strong>${r[2]}<i class="rap ${RAP(d,r)[0]}">${RAP(d,r)[1]}</i></b><span>${r[3]}${r[4]?" · acompte payé":""}</span></div>`})}
  else g+='<div class="pferme">Fermé</div>';
  return tete("Agenda","Novembre 2026")+semaine(d)+titreJour(d,d+2)+`<div class="sync"><i></i>Synchronisé avec l’agenda de votre téléphone</div>`+g+'</div>'+basAgenda};

const PRESTAS=[["Ongles","Pose américaine","1 h 30","55 €"],["Ongles","Remplissage gel","1 h","40 €"],["Ongles","Semi-permanent mains","45 min","30 €"],["Ongles","Nail art (par ongle)","10 min","5 €"],["Beauté","Semi-permanent pieds","45 min","35 €"]];
const COULS=[["noir","#1E1C1B"],["choco","#4A3226"],["marine","#24344F"],["taupe","#5E5149"],["greige","#BDB3A8"],["sable","#C9A97E"],["peche","#E2C3AF"],["sauge","#9EA791"],["lin","#CFC4B3"],["nude","#D9B8A9"],["rose","#EBC3CC"],["bleup","#B9CCE0"]];
const croix='<button class="fe-x" data-a="fermer" aria-label="Fermer">×</button>';
const ligneMS=(t,sub,k,extra="")=>`<div class="ligne" data-a="${k}"><div class="t">${t}${sub?`<span>${sub}</span>`:""}</div>${extra||'<span class="fl">›</span>'}</div>`;
const carteSite=`<div class="noire siteb"><small>Mon site</small><div class="adr">votre-onglerie.fr</div><div class="enl"><i></i>En ligne · 86 visites cette semaine</div><div class="bts"><button class="plein" data-a="voir">Voir</button><button data-a="partage">Partager</button><button data-a="qr">QR code</button></div></div>`;
const choixStyle=()=>`<div class="lab">Style</div><div class="seg seg-l" data-seg><button class="on">Site 1</button><button>Site 2</button><button>Site 3</button></div>
  <div class="lab" style="margin-top:14px">Couleur</div><div class="dots">${COULS.map((c,i)=>`<button class="dot${i?"":" on"}" data-a="dot" style="background:${c[1]}"></button>`).join("")}</div>
  <div class="lab" style="margin-top:14px">Jour ou nuit</div><div class="seg seg-l" data-seg><button class="on">Jour</button><button>Nuit</button><button>Auto</button></div>`;
const MSF={
 "ms-presta":()=>croix+`<h3>Prestations et prix</h3><div class="sous">5 prestations · touchez pour modifier</div>`+["Ongles","Beauté"].map(cat=>`<div class="k">${cat}</div><div class="liste">`+PRESTAS.filter(p=>p[0]===cat).map(p=>`<div class="ligne" data-a="ms-pedit" data-n="${p[1]}" data-d="${p[2]}" data-p="${p[3]}"><div class="t">${p[1]}<span>${p[2]}</span></div><em>${p[3]}</em><span class="fl">›</span></div>`).join("")+`</div>`).join("")+`<button class="btn" data-a="ms-pedit" data-n="" data-d="1 h" data-p="" style="width:100%;margin-top:14px">Ajouter une prestation</button>`,
 "ms-pedit":a=>croix+`<h3>${a.dataset.n||"Nouvelle prestation"}</h3><div class="form" style="margin-top:12px"><label>Nom<input value="${a.dataset.n}" placeholder="Par exemple : Pose américaine"></label><label>Prix<input value="${a.dataset.p}" placeholder="Par exemple : 55 €" inputmode="decimal"></label></div>
   <div class="lab" style="margin-top:12px">Durée</div><div class="chips">${["30 min","45 min","1 h","1 h 30","2 h"].map(d=>`<button class="chip${d===a.dataset.d?" on":""}" data-a="ms-dur">${d}</button>`).join("")}</div>
   <div class="sous" style="margin-top:12px;font-size:11.5px">Sans prix, la prestation s’affiche mais ne peut pas être réservée en ligne.</div><button class="btn" data-a="ok-presta" style="width:100%;margin-top:10px">Enregistrer</button>`,
 "ms-photos":()=>croix+`<h3>Mes photos</h3><div class="sous">Elles s’affichent dans « Réalisations »</div><div class="phg">${Object.values(MPH).map(p=>`<div class="phc"><img src="${p}" alt=""><button class="phx" data-a="ms-phrm" aria-label="Enlever">×</button></div>`).join("")}</div><button class="btn" data-a="ok-photos" style="width:100%;margin-top:14px">Ajouter des photos</button>`,
 "ms-horaires":()=>croix+`<h3>Horaires</h3><div class="sous">La pause se grise toute seule dans votre agenda</div><div class="liste">`+[["Lundi","9:00 – 13:00 · 15:00 – 18:00",1],["Mardi","9:00 – 13:00 · 15:00 – 18:00",1],["Mercredi","Fermé",0],["Jeudi","9:00 – 13:00 · 15:00 – 18:00",1],["Vendredi","9:00 – 13:00 · 15:00 – 18:00",1],["Samedi","9:00 – 13:00",1],["Dimanche","Fermé",0]].map(j=>`<div class="ligne"><div class="t">${j[0]}<span>${j[1]}</span></div><button class="sw${j[2]?" on":""}" data-sw></button></div>`).join("")+`</div><div class="liste" style="margin-top:10px">${ligneMS("Congés et fermetures","Un bandeau s’affiche sur votre site","bientot")}</div>`,
 "ms-style":()=>croix+`<h3>Style et couleur</h3><div class="sous">Votre site change tout de suite</div>${choixStyle()}<button class="btn" data-a="voir" style="width:100%;margin-top:16px">Voir le résultat</button>`,
 "ms-apropos":()=>croix+`<h3>À propos de moi</h3><div class="sous">Quelques lignes, avec vos mots</div><textarea class="msg" style="height:150px">Passionnée par les ongles depuis toujours, je vous accueille dans mon salon pour des poses soignées et durables. Votre texte ici.</textarea><button class="btn" data-a="ok-texte" style="width:100%;margin-top:12px">Enregistrer</button>`,
 "ms-langues":()=>croix+`<h3>Langues de mon site</h3><div class="sous">Les traductions se font toutes seules</div><div class="liste">`+[["Français","Toujours",2],["Anglais","",1],["Italien","",1],["Allemand","",0],["Russe","",0]].map(l=>`<div class="ligne"><div class="t">${l[0]}${l[1]?`<span>${l[1]}</span>`:""}</div>${l[2]===2?'<em>✓</em>':`<button class="sw${l[2]?" on":""}" data-sw></button>`}</div>`).join("")+`</div>`};
const MS={
 msa:()=>tete("Mon site","En ligne")+carteSite
   +'<div class="k">Modifier mon site</div><div class="liste">'
   +ligneMS("Prestations et prix","5 prestations","ms-presta")+ligneMS("Photos","5 photos","ms-photos")+ligneMS("Horaires","Pause 13:00 – 15:00 · fermé mercredi et dimanche","ms-horaires")
   +ligneMS("Style et couleur","Site 1 · Noir · Jour","ms-style")+ligneMS("À propos de moi","","ms-apropos")+ligneMS("Langues","Français, anglais, italien","ms-langues")+'</div>'

 msb:()=>{const P=[["Accueil","Votre nom, votre photo",MPH.creme,null,"ms-style"],["Prestations et prix","5 prestations",null,1,"ms-presta"],["Réalisations","5 photos",MPH.noir,1,"ms-photos"],["Avis","24 avis Google",null,1,"bientot"],["À propos de moi","",MPH.materiel,1,"ms-apropos"],["Bon à savoir","Acompte, retards, annulation",null,1,"bientot"],["Horaires et adresse","Pause 13:00 – 15:00",null,null,"ms-horaires"],["Instagram","Vos dernières publications",MPH.nude,0,"bientot"]];

   +'<div class="k">Les parties de mon site</div><div class="sous" style="text-align:left;margin:-4px 0 10px;font-size:12px">Touchez pour modifier · l’interrupteur pour cacher une partie</div><div class="liste">'

   +'<div class="k">Partager</div><div class="duo"><button class="btn" data-a="partage">Partager</button><button class="btn clair" data-a="qr">QR code</button></div>'},

      else if(k==="tri"){const vu=e.querySelector('.vue[data-p="cl"]');vu.innerHTML=CLIENTES(v,a.dataset.t)}
      else if(k==="relance")ouvre(`<h3>Message pour Manon</h3><div class="sous">Elle devrait déjà être revenue</div><textarea class="msg">Bonjour Manon, ça fait un petit moment ! Voulez-vous reprendre rendez-vous pour votre remplissage ? Votre onglerie</textarea><button class="btn" data-a="ok-relance" style="width:100%;margin-top:12px">Envoyer par SMS</button>`);
      else if(k==="pastille"){const n=a.dataset.n;ouvre(`<button class="fe-x" data-a="pillsclose" aria-label="Fermer">×</button><input type="hidden" class="fiche-n" value="${n}"><h3>Infos sur ${n}</h3><div class="sous">Touchez tout ce qui la concerne, puis fermez</div>${CHIPSEL(curPills(e,n,CLp(n)))}<div class="sous" style="margin-top:14px;font-size:11.5px">Ce sont des informations de santé : notez-les seulement avec l’accord de votre cliente.</div>`)}
      else if(k==="fermer")ferme();
      else if(k==="togpill")a.classList.toggle("on");
      else if(k==="ppadd"){const inp=fc.querySelector(".pp-in"),v2=(inp.value||"").trim();if(!v2){dit("Écrivez d’abord l’info");return}fc.querySelector(".chips.sel").insertAdjacentHTML("beforeend",`<button class="chip on" data-a="togpill" data-p="${v2}">${v2}</button>`);inp.value=""}
      else if(k==="pillsclose"){const n=fc.querySelector(".fiche-n").value,keep=curPills(e,n,CLp(n)).filter(x=>/Anniversaire|Pas de numéro/.test(x));e._set=e._set||{};e._set[n]=[...keep,...[...fc.querySelectorAll(".chips.sel .chip.on")].map(c=>c.dataset.p)];ouvre(FICHE(n,e));dit("Fiche mise à jour")}
      else if(k==="rmpill"){const n=a.dataset.n;e._set=e._set||{};e._set[n]=curPills(e,n,CLp(n)).filter(x=>x!==a.dataset.p);ouvre(FICHE(n,e));dit("Enlevé de la fiche")}
      else if(k==="pillperso")ouvre(`<h3>Écrire une info</h3><div class="sous">Elle s’affichera en pastille en haut de sa fiche</div><div class="form"><input class="pp-in" placeholder="Par exemple : vient avec sa fille"></div><button class="btn" data-a="addperso" data-n="${a.dataset.n}" style="width:100%;margin-top:12px">Ajouter</button>`);
      else if(k==="addperso"){const v2=(fc.querySelector(".pp-in").value||"").trim();if(!v2){dit("Écrivez d’abord l’info");return}const n=a.dataset.n;e._pil=e._pil||{};(e._pil[n]=e._pil[n]||[]).push(v2);ouvre(FICHE(n,e));dit("Ajouté à la fiche")}
      else if(k==="addpill"){const n=a.dataset.n;e._pil=e._pil||{};(e._pil[n]=e._pil[n]||[]).push(a.dataset.p);ouvre(FICHE(n,e));dit("Ajouté à la fiche")}
      else if(k.startsWith("ms-")&&MSF[k])ouvre(MSF[k](a));
      else if(k==="mstab"){const vu=e.querySelector('.vue[data-p="si"]');vu.innerHTML=MS.msc(a.dataset.t)}
      else if(k==="ms-dur"){a.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===a))}
      else if(k==="ms-phrm"){a.closest(".phc").remove();dit("Photo enlevée")}
      else if(k==="dot"){a.parentNode.querySelectorAll(".dot").forEach(c=>c.classList.toggle("on",c===a));dit("Votre site change de couleur")}
      else if(k==="presta"){fc.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===a));const[hh,mm]=a.dataset.h.split(":").map(Number),f=hh*60+mm+ +a.dataset.d;fc.querySelector(".fin").innerHTML=`Fin à <b>${hm(f)}</b> · durée automatique`}
      else if(k==="reprendre")ouvre(`<h3>Prochain rendez-vous</h3><div class="sous">Dans 3 semaines, à la même heure</div><div class="blanche" style="text-align:center"><b style="font-weight:300;font-size:22px">Lundi 23 novembre</b><div style="font-size:13px;color:var(--gris);margin-top:4px">10:00 · Remplissage gel · 1 h</div></div><button class="btn" data-a="ok-repris">Réserver et prévenir par SMS</button><button class="btn clair" data-a="bientot">Choisir une autre date</button>`);
      else if(k==="absente"){ferme();dit("Marquée absente · l’acompte est gardé")}
      else if(k==="ajoutcli")ouvre(`<button class="fe-x" data-a="fermer" aria-label="Fermer">×</button><h3>Ajouter une cliente</h3><div class="sous">Juste l’essentiel</div><div class="form">
        <label>Prénom<input placeholder="Prénom"></label><label>Nom<input placeholder="Nom"></label><label>Téléphone<input placeholder="Pour les SMS de rappel" inputmode="tel"></label><label>Date de naissance <small>facultatif</small><input placeholder="Jour et mois"></label>
        <div class="lab">Infos <small>facultatif</small></div>${CHIPSEL([])}<label>Note <small>facultatif</small><input placeholder="Par exemple : aime les formes amande"></label></div><button class="btn" data-a="ok-cli" style="width:100%;margin-top:14px">Enregistrer</button>`);
      else if(k==="bloque")ouvre(`<h3>Bloquer un créneau</h3><div class="sous">Les clientes ne pourront pas réserver ce moment</div><div class="liste"><div class="ligne" data-a="ok-pause"><div class="t">Une pause<span>Déjeuner, rendez-vous perso…</span></div><span class="fl">›</span></div><div class="ligne" data-a="ok-conges"><div class="t">Des congés<span>Plusieurs jours, un bandeau s’affiche sur mon site</span></div><span class="fl">›</span></div><div class="ligne" data-a="imprevu"><div class="t">Un imprévu aujourd’hui<span>Les clientes du jour reçoivent un SMS</span></div><span class="fl">›</span></div></div>`);
      else if(k==="slot"&&v==="q")ouvre(`<h3>${a.dataset.h}</h3><div class="sous">Lundi 2 novembre</div><button class="btn" data-a="slot-cli" data-h="${a.dataset.h}">Une cliente</button><button class="btn clair" data-a="slot-pause" data-h="${a.dataset.h}">Une pause</button>`);
      else if(k==="slot-cli")ouvre(NOUVQ(a.dataset.h));
      else if(k==="slot-pause")ouvre(`<h3>Une pause à ${a.dataset.h}</h3><div class="sous">Combien de temps ?</div><div class="chips" style="justify-content:center">${[15,30,45,60,90].map(d=>`<button class="chip" data-a="pausedur" data-d="${d}" data-h="${a.dataset.h}">${duree(d)}</button>`).join("")}</div>`);
      else if(k==="pausedur"){const[hh,mm]=a.dataset.h.split(":").map(Number),deb=hh*60+mm,d=+a.dataset.d,pap=e.querySelector('.vue[data-p="ag"] .pap');
        if(pap)pap.insertAdjacentHTML("beforeend",`<div class="ppause" style="top:${deb-OUV}px;height:${d}px"><span>Pause · ${hm(deb)} – ${hm(deb+d)}</span></div>`);ferme();dit("Pause ajoutée : vos clientes ne pourront pas réserver")}
      else if(k==="slot")ouvre(`<h3>Nouveau rendez-vous</h3><div class="sous">À ${a.dataset.h}</div><div class="liste"><div class="ligne"><div class="t">Cliente</div><em>Choisir</em><span class="fl">›</span></div><div class="ligne"><div class="t">Prestation</div><em>Choisir</em><span class="fl">›</span></div><div class="ligne"><div class="t">Heure</div><em>${a.dataset.h}</em><span class="fl">›</span></div></div><button class="btn" data-a="ok-rdv">Enregistrer</button>`);
      else if(k==="aide")ouvre(`<h3>Besoin d’aide ?</h3><div class="sous">Posez votre question, la réponse arrive tout de suite</div><div class="blanche" style="font-size:13.5px;color:var(--gris)">Exemple : « Comment changer mes horaires ? »</div><button class="btn" data-a="ok-q">Envoyer</button>`);
      else if(k.startsWith("ok-")){if(k==="ok-fiche"&&fc.querySelector(".chips.sel")){const n=fc.querySelector(".fiche-n").value,keep=curPills(e,n,CLp(n)).filter(x=>/Anniversaire|Pas de numéro/.test(x));e._set=e._set||{};e._set[n]=[...keep,...[...fc.querySelectorAll(".chips.sel .chip.on")].map(c=>c.dataset.p)]}if(k==="ok-fiche"&&e._numEnCours){e._fait={...(e._fait||{}),num:1};majBadge(e);e._numEnCours=0}ferme();dit({"ok-copie":"Lien copié","ok-wa":"Ouvre WhatsApp","ok-sms":"Ouvre vos messages","ok-pdf":"QR code prêt à imprimer","ok-img":"Image enregistrée","ok-rdv":"Rendez-vous enregistré","ok-q":"Question envoyée","ok-cli":"Cliente ajoutée","ok-ferme":"Journée fermée · SMS envoyés","ok-rien":"Rien n’a changé","ok-repris":"Rendez-vous réservé · SMS envoyé","ok-fiche":"Fiche mise à jour","ok-presta":"Prestation enregistrée","ok-regles":"Règles enregistrées","ok-adresse":"Adresse enregistrée","ok-maphoto":"Choisissez votre photo","ok-legal":"Infos légales enregistrées","ok-insta":"Instagram enregistré","ok-photos":"Choisissez vos photos","ok-texte":"Texte enregistré","ok-relance":"Message envoyé à Manon","ok-pause":"Choisissez l’heure de la pause","ok-conges":"Choisissez vos dates de congés","ok-tel":"Vos rendez-vous du téléphone sont ajoutés","ok-import":"6 rendez-vous ajoutés","ok-pris":"Créneaux bloqués : vos clientes ne pourront pas réserver dessus","ok-fichier":"Choisissez votre fichier"}[k])}
      else dit("Cette page viendra ensuite");
      return}
    const r=t.closest("[data-rdv]");if(r){const n=r.dataset.rdv,R=r.dataset.info?[r.dataset.info.split(" · ")[0],0,r.dataset.info.split(" · ").slice(1).join(" · ")]:RDV.find(x=>x[1]===n);
      ouvre(`<div class="fiche-t"><div><h3 style="text-align:left;margin:0"><span class="lien-cli" data-cli="${n}">${n} <em>›</em></span></h3><div class="sous" style="text-align:left;margin:2px 0 0">${R?R[0]+" · "+R[2]:""}</div>${v==="q"?RAPF(r.dataset.rap,n):""}</div><div class="ronds"><button data-a="appel" aria-label="Appeler"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button><button data-a="msg" aria-label="Message"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg></button></div></div>
        ${v==="q"?'<button class="btn" data-a="reprendre" style="width:100%;margin-top:16px">Reprendre dans 3 semaines</button>':""}
        <div class="petits">${v==="q"?'<button data-a="absente">Pas venue</button>':""}<button data-a="bientot">Annuler le rendez-vous</button></div>
        <div class="astuce-dep">Pour changer l’heure : restez appuyée sur le rendez-vous, puis glissez-le.</div>`);return}
    const c=t.closest("[data-cli]");if(c){ouvre(FICHE(c.dataset.cli,e));return}
  });
});

/* glisser un rendez-vous avec le pouce (appui long puis glisser) */
document.querySelectorAll(".ecran").forEach(e=>{
  let g=null;
  e.addEventListener("pointerdown",ev=>{const p=ev.target.closest(".pap .pr");if(!p)return;const z=parseFloat(getComputedStyle(e.closest(".tel")).zoom)||1;
    g={p,y0:ev.clientY,top0:parseFloat(p.style.top),h:parseFloat(p.style.height),z,on:false};
    g.t=setTimeout(()=>{if(!g)return;g.on=true;p.classList.add("tient");e.querySelector('.vue[data-p="ag"]').style.overflow="hidden";if(navigator.vibrate)navigator.vibrate(12)},350)});
  addEventListener("pointermove",ev=>{if(!g)return;const dy=(ev.clientY-g.y0)/g.z;
    if(!g.on){if(Math.abs(dy)>8){clearTimeout(g.t);g=null}return}
    ev.preventDefault();let top=Math.round((g.top0+dy)/15)*15;top=Math.max(0,Math.min(top,FERM-OUV-g.h));g.p.style.top=top+"px";
    let b=g.p.querySelector(".bulle");if(!b){b=document.createElement("i");b.className="bulle";g.p.appendChild(b)}b.textContent=hm(OUV+top)},{passive:false});
  addEventListener("pointerup",()=>{if(!g)return;clearTimeout(g.t);const G=g;g=null;if(!G.on)return;
    G.p.classList.remove("tient");const b=G.p.querySelector(".bulle");if(b)b.remove();e.querySelector('.vue[data-p="ag"]').style.overflow="";e._sansClic=Date.now();
    const top=parseFloat(G.p.style.top);if(top===G.top0)return;
    const deb=OUV+top,dur=G.h,nom=G.p.dataset.rdv;
    const autres=[...G.p.parentNode.querySelectorAll(".pap .pr")].filter(x=>x!==G.p).some(x=>{const t=parseFloat(x.style.top),h=parseFloat(x.style.height);return top<t+h&&top+dur>t});
    if(autres){G.p.style.top=G.top0+"px";e.querySelector(".toast").textContent="Ce créneau est déjà pris";e.querySelector(".toast").classList.add("on");setTimeout(()=>e.querySelector(".toast").classList.remove("on"),1800);return}
    e._dep={p:G.p,top0:G.top0,deb,dur,nom};
    e.querySelector(".fc").innerHTML=`<h3>Déplacer ${nom} ?</h3><div class="sous">À ${hm(deb)}, jusqu’à ${hm(deb+dur)}<br>${nom} reçoit un SMS avec la nouvelle heure.</div><button class="btn" data-a="dep-ok">Déplacer</button><button class="btn clair" data-a="dep-non">Annuler</button>`;
    e.classList.add("fe")});
  /* pas d'ouverture de fiche juste après un glissé */
  e.addEventListener("click",ev=>{if(e._sansClic&&Date.now()-e._sansClic<400&&ev.target.closest(".pap .pr"))ev.stopImmediatePropagation()},true);
});
document.querySelectorAll(".ecran").forEach(e=>majBadge(e));
setTimeout(()=>document.querySelectorAll(".ecran[data-ouvre]").forEach(e=>{const c=e.querySelector(`.vue[data-p="cl"] [data-cli="${e.dataset.ouvre}"]`);if(c)c.click()}),600);
document.querySelectorAll(".ecran[data-day]").forEach(e=>{const vu=e.querySelector('.vue[data-p="ag"]');vu.innerHTML=AG[e.dataset.v](+e.dataset.day);majBadge(e)});
document.querySelectorAll(".reglages button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".reglages button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".col").forEach(c=>c.classList.toggle("vis",c.dataset.col===b.dataset.c))});
function ajuste(){const z=Math.min(1,(innerHeight-130)/866,(innerWidth-120)/(2*412));document.documentElement.style.setProperty("--z",z.toFixed(3))}
addEventListener("resize",ajuste);ajuste();
</script>
